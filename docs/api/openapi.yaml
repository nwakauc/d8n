                  preferences:
                    oneOf:
                      - $ref: "#/components/schemas/ProfilePreferences"
                      - type: "null"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: updateProfilePreferences
      tags: [Profile]
      summary: Create or update current brand preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfilePreferencesUpdate"
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Updated preferences.
          content:
            application/json:
              schema:
                type: object
                required: [preferences]
                properties:
                  preferences:
                    $ref: "#/components/schemas/ProfilePreferences"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProfileOrMembershipRequired"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/profile/options:
    patch:
      operationId: replaceProfileOptions
      tags: [Profile]
      summary: Replace selections for supplied controlled-option groups
      description: Omitted groups are unchanged. Supplied group arrays replace that group's active selections.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [selections]
              properties:
                selections:
                  type: object
                  additionalProperties:
                    type: array
                    items:
                      type: string
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Updated owner profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProfileOrMembershipRequired"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/profile/prompts:
    get:
      operationId: getProfilePrompts
      tags: [Profile]
      summary: The member's current prompt answers
      responses:
        "200":
          description: The member's answered prompts, ordered by position.
          content:
            application/json:
              schema:
                type: object
                required: [prompts]
                properties:
                  prompts:
                    type: array
                    items:
                      $ref: "#/components/schemas/PromptAnswer"
        "401":

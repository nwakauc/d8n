  /api/v1/profiles/{profile_id}/hook:
    post:
      operationId: sendHook
      tags: [Hooks]
      summary: Send a 🔥 Hook (one opener) to an eligible profile
      description: |
        Creates the sender's single unsolicited opener to a recipient. The body is
        the FINAL text the sender chose — the default copy is a frontend concern
        and receiving it means nothing special. No Match/Conversation/Message is
        created yet: the opener is held on the Hook, and the sender is locked out
        from any further message until the recipient replies (there is literally no
        conversation to message through, and a second Hook to the same person is
        rejected).

        Reachability matches Like exactly: blocked (either direction), suspended,
        closed, hidden, cross-brand, self, and otherwise-ineligible targets all
        fail closed as `profile_unavailable` (404), never revealing which.

        V1 anti-spam: exactly one Hook per (sender → recipient) pair, ever — a
        second attempt (including after decline/expiry) returns `already_hooked`
        (409). Sending is also bounded by a per-sender daily allowance
        (`hook_rate_limited`, 429, with `Retry-After`).
      parameters:
        - $ref: "#/components/parameters/PublicProfileId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendHookRequest"
      responses:
        "201":
          description: The Hook was created and is pending the recipient's reply.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendHookResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: >-
            The resolved database brand has no production contract
            (`brand_not_configured`), Hook is disabled by its contract
            (`hook_not_configured`), or the target profile is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: |
            Interaction conflict: `already_hooked` (already used your one Hook to
            this person), `already_matched`, `already_liked`, or `incoming_hook`
            (they Hooked you — reply from your inbox instead).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Blank (`message_blank`) or oversized (`message_too_long`) opener.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: The sender's daily Hook allowance is exhausted (`hook_rate_limited`).
          headers:
            Retry-After:
              description: Seconds until the sender may Hook again.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/hooks:
    get:
      operationId: listReceivedHooks
      tags: [Hooks]
      summary: List Hooks received and awaiting the current member's reply
      description: |
        The recipient inbox: live (pending, unexpired) Hooks addressed to the
        current member, newest-first and cursor-paginated. Each entry carries the
        opener text and the sender's safe public profile. Hooks are private — only
        the recipient sees them; a sender never sees their own sent Hooks here.
        Senders who became unavailable (blocked, suspended, closed) silently drop
        off without disclosure.
      parameters:
        - $ref: "#/components/parameters/HookLimit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of live received Hooks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HookInboxResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProfileOrMembershipRequired"
        "404":
          $ref: "#/components/responses/HookNotConfigured"
        "422":
          description: Invalid `limit` (`invalid_limit`) or `cursor` (`invalid_cursor`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/hooks/{hook_id}/reply:
    post:
      operationId: replyToHook
      tags: [Hooks]
      summary: Reply to a Hook — accepts it and unlocks a conversation
      description: |
        The recipient's first reply. There is no separate accept step: replying IS
        acceptance. Atomically creates the canonical Match + Conversation,
        materializes the sender's opener as the first message and this text as the
        second, and returns the unlocked conversation. All further messages flow
        through the standard `POST /conversations/{conversation_id}/messages`.

        A Hook that is not live for this member — already accepted/declined,
        expired, blocked either way, or not addressed to the caller — returns the
        neutral `hook_unavailable` (404), never revealing which.
      parameters:
        - $ref: "#/components/parameters/HookId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HookReplyRequest"
      responses:
        "201":
          description: The Hook was accepted; the conversation is unlocked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HookReplyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: >-
            The resolved database brand has no production contract
            (`brand_not_configured`), Hook is disabled by its contract
            (`hook_not_configured`), or the Hook is not live for this member
            (`hook_unavailable`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Blank (`message_blank`) or oversized (`message_too_long`) reply.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/hooks/{hook_id}/decline:
    post:
      operationId: declineHook
      tags: [Hooks]
      summary: Decline a pending Hook
      description: |
        The recipient declines. Terminal and private: the sender is never told a
        decline happened (their `hook_state` simply collapses to `unavailable`,
        indistinguishable from being ignored-then-expired or blocked). A Hook that
        is not live for this member returns the neutral `hook_unavailable` (404).
      parameters:
        - $ref: "#/components/parameters/HookId"
      responses:
        "204":
          description: The Hook was declined; nothing is disclosed to the sender.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: >-
            The resolved database brand has no production contract
            (`brand_not_configured`), Hook is disabled by its contract
            (`hook_not_configured`), or the Hook is not live for this member
            (`hook_unavailable`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/profiles/{profile_id}/opener:
    post:
      operationId: sendOpener
      tags: [D8N Opener]
      summary: Send a D8N Opener (one curated opener) to an eligible profile
      description: |
        The generic, brand-configurable version of `POST
        /api/v1/profiles/{profile_id}/hook` — same engine (Hook model,

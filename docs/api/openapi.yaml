  /api/v1/hq/trust_safety/repeat_offenders:
    get:
      operationId: listHqTrustSafetyRepeatOffenders
      tags: [Hq]
      summary: List repeatedly reported profiles for the current brand
      description: |
        Requires verified admin MFA and `hq.trust_safety.read`; brand-scoped and read-only. "Repeat" means
        at least two retained reports received by one profile. Results are
        ordered by report count descending, then latest report descending, and
        bounded rather than cursor-paginated. This is an investigation signal,
        never an automatic enforcement decision. `member_360_lookup` can be
        passed to GET /api/v1/hq/members/{lookup}; it is null when the retained

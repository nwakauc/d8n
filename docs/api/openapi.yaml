openapi: 3.1.0
info:
  title: D8N Core API
  version: 1.0.0
  summary: Multi-brand dating platform API
  description: |
    D8N resolves the active brand from the request host. Never send a brand ID in
    client-controlled input. Bearer sessions are brand-bound, and profile identifiers
    exposed by dating endpoints are public UUIDs rather than internal database IDs.
servers:
  - url: /
    description: Current API origin (use this for the self-hosted Swagger UI)
  - url: https://{brandHost}
    description: Production brand-specific API origin
    variables:
      brandHost:
        default: hookus.example.com
security:
  - bearerAuth: []
tags:
  - name: System
  - name: Authentication
  - name: Profile
  - name: Matching
  - name: Messaging
  - name: Trust
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      tags: [System]
      summary: Check API availability
      security: []
      responses:
        "200":
          description: API is available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/openapi.json:
    get:
      operationId: getOpenapiContract
      tags: [System]
      summary: Download this API contract as JSON
      security: []
      responses:
        "200":
          description: OpenAPI contract for the deployed commit.
          content:
            application/json:
              schema:
                type: object
  /api/v1/auth/methods:
    get:
      operationId: getAuthenticationMethods
      tags: [Authentication]
      summary: List implemented authentication methods enabled for this brand
      security: []
      responses:
        "200":
          description: Host-resolved brand and currently available methods.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMethodsResponse"
        "404":
          $ref: "#/components/responses/BrandRequired"
  /api/v1/auth/password/register:
    post:
      operationId: registerWithPassword
      tags: [Authentication]
      summary: Register immediately with a phone or email and password
      description: |
        Creates a D8N identity, current-brand membership, and brand-bound session.
        Registration does not prove control of the phone number or email address;
        the returned identifier remains unverified until a later verification flow.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordAuthRequest"
      responses:
        "201":
          description: Account, membership, password credential, and session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordAuthSessionResponse"
        "404":
          $ref: "#/components/responses/AuthMethodUnavailable"
        "409":
          description: The request already carries an authenticated D8N session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Registration cannot be completed with the supplied input.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/password/login:
    post:
      operationId: loginWithPassword
      tags: [Authentication]
      summary: Log in with an existing phone or email password credential
      description: |
        Login requires an existing active membership in the host-resolved brand.
        It never enrolls an existing D8N identity into another brand implicitly.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordAuthRequest"
      responses:
        "201":
          description: Brand-bound session issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordAuthSessionResponse"
        "401":
          description: Identifier, password, account lifecycle, or membership is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/AuthMethodUnavailable"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/password:
    patch:
      operationId: changePassword
      tags: [Authentication]
      summary: Change the current password after reauthentication
      description: |
        Requires a password-backed brand session and the current password in the
        same request. A successful change keeps the current session and revokes
        every other active session issued from the affected password credential.
        Unauthenticated account recovery through phone or email is not this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChangeRequest"
      responses:
        "200":
          description: Password changed and other affected sessions revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: The bearer session or current password is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The current session was not issued from a password credential.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The replacement password is invalid, mismatched, or unchanged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/verification:
    post:
      operationId: requestIdentifierVerification
      tags: [Authentication]
      summary: Request a post-signup phone or email verification code
      description: |
        Requires a brand-bound bearer session. The code is sent only to an
        unverified identifier already owned by the current user. The generic
        success response does not reveal whether that identifier exists or is
        already verified, and requesting a code never creates account state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentifierVerificationRequest"
      responses:
        "202":
          description: Request accepted without disclosing identifier state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidInput"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: The configured delivery channel is temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: verifyIdentifier
      tags: [Authentication]
      summary: Verify the current user's phone or email identifier
      description: |
        Consumes a purpose-bound code and marks only the current user's matching
        identifier verified. This endpoint never issues a session or creates a
        user, credential, membership, or profile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentifierVerification"
      responses:
        "200":
          description: Identifier verified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentifierVerificationResponse"
        "401":
          description: Session or verification code is unavailable, invalid, expired, consumed, or locked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/session:
    delete:
      operationId: revokeSession
      tags: [Authentication]
      summary: Revoke the current session
      responses:
        "204":
          description: Session revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/me:
    get:
      operationId: getCurrentIdentity
      tags: [Authentication]
      summary: Confirm the authenticated identity, brand, and session
      responses:
        "200":
          description: Current authenticated context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/profile/configuration:
    get:
      operationId: getProfileConfiguration
      tags: [Profile]
      summary: Get the resolved brand's onboarding and profile contract
      responses:
        "200":
          description: Brand-owned field and controlled-option configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileConfigurationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/profile:
    get:
      operationId: getProfile
      tags: [Profile]
      summary: Get the current brand profile
      responses:
        "200":
          description: Current profile and resumable onboarding state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: updateProfile
      tags: [Profile]
      summary: Create or update the current brand profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated owner profile and resumable onboarding state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProfileOrMembershipRequired"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/profile/preferences:
    get:
      operationId: getProfilePreferences
      tags: [Profile]
      summary: Get the current brand preferences
      responses:
        "200":
          description: Current preferences or null.
          content:
            application/json:
              schema:
                type: object
                required: [preferences]
                properties:
                  preferences:
                    oneOf:
                      - $ref: "#/components/schemas/ProfilePreferences"
                      - type: "null"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: updateProfilePreferences
      tags: [Profile]
      summary: Create or update current brand preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfilePreferencesUpdate"
      responses:
        "200":
          description: Updated preferences.
          content:
            application/json:
              schema:
                type: object
                required: [preferences]
                properties:
                  preferences:
                    $ref: "#/components/schemas/ProfilePreferences"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProfileOrMembershipRequired"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/profile/options:
    patch:
      operationId: replaceProfileOptions
      tags: [Profile]
      summary: Replace selections for supplied controlled-option groups
      description: Omitted groups are unchanged. Supplied group arrays replace that group's active selections.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [selections]
              properties:
                selections:
                  type: object
                  additionalProperties:
                    type: array
                    items:
                      type: string
      responses:
        "200":
          description: Updated owner profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProfileOrMembershipRequired"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/profile/publication:
    post:
      operationId: activateProfile
      tags: [Profile]
      summary: Activate and publish a complete profile
      responses:
        "200":
          description: Activated owner profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProfileOrMembershipRequired"
        "422":
          description: Profile does not satisfy current brand completion requirements.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncompleteProfileError"
    delete:
      operationId: deactivateProfile
      tags: [Profile]
      summary: Hide and deactivate the current profile
      responses:
        "200":
          description: Deactivated owner profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProfileOrMembershipRequired"
  /api/v1/profile/location:
    put:
      operationId: replaceProfileLocation
      tags: [Profile]
      summary: Replace the current profile's private precise location
      description: Coordinates are accepted but never returned by this API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileLocationUpdate"
      responses:
        "200":
          description: Private location state without coordinates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileLocationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProfileOrMembershipRequired"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      operationId: deleteProfileLocation
      tags: [Profile]
      summary: Soft-delete the current profile's precise location
      responses:
        "200":
          description: Location is no longer configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileLocationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProfileOrMembershipRequired"
  /api/v1/profile/photos:
    get:
      operationId: listProfilePhotos
      tags: [Profile]
      summary: List the current profile's photos
      responses:
        "200":
          description: Owner photo library.
          content:
            application/json:
              schema:
                type: object
                required: [photos]
                properties:
                  photos:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProfilePhoto"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createProfilePhoto
      tags: [Profile]
      summary: Upload a profile photo
      description: Accepts JPEG, PNG, or WebP up to 10 MB. New photos begin pending review and hidden.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                position:
                  type: integer
                  minimum: 0
      responses:
        "201":
          description: Photo accepted for processing/review.
          content:
            application/json:
              schema:
                type: object
                required: [photo]
                properties:
                  photo:
                    $ref: "#/components/schemas/ProfilePhoto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProfileOrMembershipRequired"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/profile/photos/{id}:
    delete:
      operationId: deleteProfilePhoto
      tags: [Profile]
      summary: Soft-delete a profile photo
      parameters:
        - $ref: "#/components/parameters/PhotoId"
      responses:
        "200":
          description: Soft-deleted owner photo record.
          content:
            application/json:
              schema:
                type: object
                required: [photo]
                properties:
                  photo:
                    $ref: "#/components/schemas/ProfilePhoto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/discovery:
    get:
      operationId: getDiscovery
      tags: [Matching]
      summary: Get a ranked page of eligible public profiles
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Strategy-ranked profiles and an opaque next cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Current profile is not active and discoverable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Production matching is not configured for this brand.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/InvalidInput"
  /api/v1/profiles/{profile_id}/likes:
    post:
      operationId: likeProfile
      tags: [Matching]
      summary: Idempotently like an eligible public profile
      parameters:
        - $ref: "#/components/parameters/PublicProfileId"
      responses:
        "200":
          description: Existing like returned idempotently.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LikeResponse"
        "201":
          description: Like created; a mutual like may also create a match.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LikeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/InteractionConflict"
  /api/v1/profiles/{profile_id}/pass:
    post:
      operationId: passProfile
      tags: [Matching]
      summary: Idempotently pass on an eligible public profile
      parameters:
        - $ref: "#/components/parameters/PublicProfileId"
      responses:
        "200":
          description: Existing pass returned idempotently.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PassResponse"
        "201":
          description: Pass created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PassResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/InteractionConflict"
  /api/v1/profiles/{profile_id}/block:
    post:
      operationId: blockProfile
      tags: [Trust]
      summary: Idempotently block a current-brand profile
      description: |
        Blocking applies in either direction for discovery, interactions, match lists,
        and conversation access. It removes existing likes and ends an active match.
      parameters:
        - $ref: "#/components/parameters/PublicProfileId"
      responses:
        "200":
          description: The directional block already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockResponse"
        "201":
          description: The directional block was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProfileOrMembershipRequired"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: unblockProfile
      tags: [Trust]
      summary: Idempotently remove the current profile's directional block
      description: |
        Unknown, cross-brand, self, and soft-deleted targets receive the same no-content
        response. Unblocking does not restore likes or reactivate an ended match.
      parameters:
        - $ref: "#/components/parameters/PublicProfileId"
      responses:
        "204":
          description: The request completed without disclosing target or block state.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProfileOrMembershipRequired"
  /api/v1/matches:
    get:
      operationId: listMatches
      tags: [Matching]
      summary: List current live matches
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Live matches and an opaque next cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProfileOrMembershipRequired"
        "422":
          $ref: "#/components/responses/InvalidInput"
  /api/v1/conversations:
    get:
      operationId: listConversations
      tags: [Messaging]
      summary: List conversations for the current brand profile
      description: Slice 1 returns conversation metadata only; no message-content endpoint is available yet.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Participant-scoped conversations and an opaque next cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProfileOrMembershipRequired"
        "422":
          $ref: "#/components/responses/InvalidInput"
  /api/v1/matches/{match_id}/conversation:
    post:
      operationId: startConversation
      tags: [Messaging]
      summary: Idempotently open the conversation for a live match
      parameters:
        - $ref: "#/components/parameters/PublicMatchId"
      responses:
        "200":
          description: Existing conversation returned idempotently.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartConversationResponse"
        "201":
          description: Conversation and both profile participants created atomically.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartConversationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Match is unavailable, cross-brand, or does not include the current profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Opaque brand-bound D8N session token.
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque signed cursor returned by the same endpoint and brand.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    PublicProfileId:
      name: profile_id
      in: path
      required: true
      description: Stable public profile UUID from discovery.
      schema:
        type: string
        format: uuid
    PhotoId:
      name: id
      in: path
      required: true
      description: Owner photo record ID.
      schema:
        type: integer
    PublicMatchId:
      name: match_id
      in: path
      required: true
      description: Stable public match UUID from the match list.
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Missing, invalid, expired, revoked, or wrong-brand bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BrandRequired:
      description: Request host did not resolve to an active brand.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AuthMethodUnavailable:
      description: Request host did not resolve to an active brand, or this authentication method is disabled.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Authentication rate limit exceeded.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds before another request should be attempted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ProfileOrMembershipRequired:
      description: Required brand membership/profile/lifecycle state is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InvalidInput:
      description: Request input, cursor, or limit is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationFailed:
      description: Validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"
    NotFound:
      description: Resource is unavailable, including cross-brand resources.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InteractionConflict:
      description: Interaction conflicts with the current participant state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthResponse:
      type: object
      required: [status, app, api_version]
      properties:
        status:
          const: ok
        app:
          const: d8n
        api_version:
          const: v1
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    ValidationError:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          required: [details]
          properties:
            details:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
    BrandSummary:
      type: object
      required: [slug, name]
      properties:
        slug:
          type: string
        name:
          type: string
    AuthMethodsResponse:
      type: object
      required: [brand, methods]
      properties:
        brand:
          $ref: "#/components/schemas/BrandSummary"
        methods:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [phone_password, email_password, google]
    IdentifierVerificationRequest:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [phone, email]
    PasswordAuthRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          description: International phone number or email address; normalized by the server.
        password:
          type: string
          format: password
          minLength: 6
          description: At least 6 characters and no more than 72 UTF-8 bytes.
        device_name:
          type: [string, "null"]
          maxLength: 120
    PasswordChangeRequest:
      type: object
      required: [current_password, password, password_confirmation]
      properties:
        current_password:
          type: string
          format: password
        password:
          type: string
          format: password
          minLength: 6
          description: At least 6 characters, no more than 72 UTF-8 bytes, and different from the current password.
        password_confirmation:
          type: string
          format: password
    IdentifierVerification:
      type: object
      required: [kind, code]
      properties:
        kind:
          type: string
          enum: [phone, email]
        code:
          type: string
          pattern: "^[0-9]{6}$"
    IdentifierVerificationResponse:
      type: object
      required: [identifier]
      properties:
        identifier:
          type: object
          required: [kind, verified]
          properties:
            kind:
              type: string
              enum: [phone, email]
            verified:
              const: true
    AuthSessionResponse:
      type: object
      required: [token, token_type, expires_at, user_id, brand]
      properties:
        token:
          type: string
          description: Secret bearer token returned only when the session is issued.
        token_type:
          const: Bearer
        expires_at:
          type: string
          format: date-time
        user_id:
          type: integer
          description: Private platform identity ID; do not use as a public dating-profile ID.
        brand:
          $ref: "#/components/schemas/BrandSummary"
    PasswordAuthSessionResponse:
      allOf:
        - $ref: "#/components/schemas/AuthSessionResponse"
        - type: object
          required: [identifier, onboarding]
          properties:
            identifier:
              type: object
              required: [kind, verified]
              properties:
                kind:
                  type: string
                  enum: [phone, email]
                verified:
                  type: boolean
                  description: False until D8N separately proves control of the phone or email.
            onboarding:
              $ref: "#/components/schemas/ProfileOnboardingStatus"
    MeResponse:
      type: object
      required: [user_id, brand, session]
      properties:
        user_id:
          type: integer
        brand:
          $ref: "#/components/schemas/BrandSummary"
        session:
          type: object
          required: [id, expires_at]
          properties:
            id:
              type: integer
            expires_at:
              type: string
              format: date-time
    Completion:
      type: object
      required: [complete, percent, missing]
      properties:
        complete:
          type: boolean
        percent:
          type: integer
          minimum: 0
          maximum: 100
        missing:
          type: array
          items:
            type: string
    ProfileUpdate:
      type: object
      properties:
        display_name:
          type: [string, "null"]
          maxLength: 80
        bio:
          type: [string, "null"]
          maxLength: 1000
        birthdate:
          type: [string, "null"]
          format: date
        gender:
          type: [string, "null"]
          maxLength: 40
        visibility:
          type: string
          enum: [hidden, visible]
        country_code:
          type: [string, "null"]
          pattern: "^[A-Z]{2}$"
        city:
          type: [string, "null"]
          maxLength: 120
        occupation:
          type: [string, "null"]
          maxLength: 120
        height_cm:
          type: [integer, "null"]
          minimum: 100
          maximum: 250
        body_type:
          type: [string, "null"]
          maxLength: 80
        languages_spoken:
          type: array
          maxItems: 15
          items:
            type: string
            maxLength: 40
        smoking:
          type: [string, "null"]
          enum: [never, occasionally, regularly, null]
        drinking:
          type: [string, "null"]
          enum: [never, occasionally, regularly, null]
        fitness:
          type: [string, "null"]
          enum: [never, occasionally, regularly, null]
    OwnerProfile:
      allOf:
        - $ref: "#/components/schemas/ProfileUpdate"
        - type: object
          required: [id, brand, status, visibility, options, completion, languages_spoken]
          properties:
            id:
              type: string
              format: uuid
            brand:
              $ref: "#/components/schemas/BrandSummary"
            status:
              type: string
              enum: [draft, active, suspended]
            visibility:
              type: string
              enum: [hidden, visible]
            options:
              $ref: "#/components/schemas/ProfileOptionSelections"
            completion:
              $ref: "#/components/schemas/Completion"
    OwnerProfileResponse:
      type: object

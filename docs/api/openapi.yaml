        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InteractionForbidden"
        "404":
          description: >-
            The resolved database brand has no production contract
            (`brand_not_configured`), or matching interactions are disabled by
            its contract (`matching_not_configured`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/InvalidInput"
  /api/v1/likes/outgoing:
    get:
      operationId: listOutgoingLikes
      tags: [Matching]
      summary: List profiles the viewer has liked
      description: |
        Active Likes created by the authenticated viewer that remain a
        current, actionable pre-match relationship state: not blocked in

openapi: 3.1.0
info:
  title: D8N Core API
  version: 1.0.0
  summary: Multi-brand dating platform API
  description: |
    D8N resolves the active brand from the request host. Never send a brand ID in
    client-controlled input. Bearer sessions are brand-bound, and profile identifiers
    exposed by dating endpoints are public UUIDs rather than internal database IDs.

    ## Implementation status (for frontend integration)

    Every path documented in this contract is implemented and callable. Use this
    summary to see which product domains are complete versus intentionally limited:

    - **Available now:** Identity (register, login, session, identifier
      verification), Profiles (profile, configuration, options, preferences,
      location, publication), Matching (discovery, likes, passes, matches), Trust
      (block, unblock, list blocked, report — enforced in either direction across
      discovery, likes, passes, matches, and conversation access).
    - **Preview (limited scope):** Messaging exposes conversation *metadata only* —
      there is no message-content endpoint yet, so do not build or simulate a chat
      transcript against D8N.
    - **Available (owner-scoped, private):** Profile photos use a direct-to-R2
      upload — request an intent, `PUT` the bytes to the returned short-lived
      presigned URL, then attach the returned `signed_id`. Attached photos begin
      `pending_review`; initial visibility is a per-brand policy — HookUs photos
      are `visible` immediately and moderated asynchronously, while brands without
      an explicit policy stay `hidden` until moderated. Delivery is a short-lived
      signed URL. Public/other-user delivery, safe re-encoding, EXIF removal, and
      moderation enforcement remain gated (ADR 0011). The endpoints require private
      R2 storage, so they return `404` when R2 is disabled.
    - **Planned (no endpoints yet):** Verification (identity/selfie), Billing,
      Notifications, Analytics, Admin.

    The live API root (`GET /`) returns the same per-service status machine-readably.
servers:
  - url: /
    description: Current API origin (use this for the self-hosted Swagger UI)
  - url: https://{brandHost}
    description: Production brand-specific API origin
    variables:
      brandHost:
        default: hookus.example.com
security:
  - bearerAuth: []
tags:
  - name: System
  - name: Authentication
  - name: Profile
  - name: Matching
  - name: Messaging
  - name: Trust
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      tags: [System]
      summary: Check API dependency readiness
      description: |
        Reports whether the web process can reach both the primary PostgreSQL
        database and the Solid Queue database. Use `/up` for boot/liveness and
        this endpoint for readiness. It is intentionally independent of brand
        host resolution and exposes no connection details.
      security: []
      responses:
        "200":
          description: API is available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: One or more required database dependencies are unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/openapi.json:
    get:
      operationId: getOpenapiContract
      tags: [System]
      summary: Download this API contract as JSON
      security: []
      responses:
        "200":
          description: OpenAPI contract for the deployed commit.
          content:
            application/json:
              schema:
                type: object
  /api/v1/auth/methods:
    get:
      operationId: getAuthenticationMethods
      tags: [Authentication]
      summary: List implemented authentication methods enabled for this brand
      security: []
      responses:
        "200":
          description: Host-resolved brand and currently available methods.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMethodsResponse"
        "404":
          $ref: "#/components/responses/BrandRequired"
  /api/v1/auth/password/register:
    post:
      operationId: registerWithPassword
      tags: [Authentication]
      summary: Register immediately with a phone or email and password
      description: |
        Creates a D8N identity, current-brand membership, and brand-bound session.
        Registration does not prove control of the phone number or email address;
        the returned identifier remains unverified until a later verification flow.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordAuthRequest"
      responses:
        "201":
          description: Account, membership, password credential, and session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordAuthSessionResponse"
        "404":
          $ref: "#/components/responses/AuthMethodUnavailable"
        "409":
          description: The request already carries an authenticated D8N session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Registration cannot be completed with the supplied input.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/password/login:
    post:
      operationId: loginWithPassword
      tags: [Authentication]
      summary: Log in with an existing phone or email password credential
      description: |
        Login requires an existing active membership in the host-resolved brand.
        It never enrolls an existing D8N identity into another brand implicitly.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordAuthRequest"
      responses:
        "201":
          description: Brand-bound session issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordAuthSessionResponse"
        "401":
          description: Identifier, password, account lifecycle, or membership is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/AuthMethodUnavailable"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/password:
    patch:
      operationId: changePassword
      tags: [Authentication]
      summary: Change the current password after reauthentication
      description: |
        Requires a password-backed brand session and the current password in the
        same request. A successful change keeps the current session and revokes
        every other active session issued from the affected password credential.
        Unauthenticated account recovery through phone or email is not this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChangeRequest"
      responses:
        "200":
          description: Password changed and other affected sessions revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: The bearer session or current password is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The current session was not issued from a password credential.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The replacement password is invalid, mismatched, or unchanged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/verification:
    post:
      operationId: requestIdentifierVerification
      tags: [Authentication]
      summary: Request a post-signup phone or email verification code
      description: |
        Requires a brand-bound bearer session. The code is sent only to an
        unverified identifier already owned by the current user. The generic
        success response does not reveal whether that identifier exists or is
        already verified, and requesting a code never creates account state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentifierVerificationRequest"
      responses:
        "202":
          description: Request accepted without disclosing identifier state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidInput"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: The configured delivery channel is temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: verifyIdentifier
      tags: [Authentication]
      summary: Verify the current user's phone or email identifier
      description: |
        Consumes a purpose-bound code and marks only the current user's matching
        identifier verified. This endpoint never issues a session or creates a
        user, credential, membership, or profile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentifierVerification"
      responses:
        "200":
          description: Identifier verified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentifierVerificationResponse"
        "401":
          description: Session or verification code is unavailable, invalid, expired, consumed, or locked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/session:
    delete:
      operationId: revokeSession
      tags: [Authentication]
      summary: Revoke the current session
      responses:
        "204":
          description: Session revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/me:
    get:
      operationId: getCurrentIdentity
      tags: [Authentication]
      summary: Confirm the authenticated identity, brand, and session
      responses:
        "200":
          description: Current authenticated context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: closeAccount
      tags: [Authentication]
      summary: Close the current user's account for this brand
      description: |
        Brand-level account closure (the user leaves this brand). Requires an
        explicit `confirmation: "close"` so it can never be triggered accidentally.
        Effects are immediate and one-way: the brand membership is tombstoned, the
        profile is discarded and anonymized, active matches end, and **every session
        for this brand is revoked** (including the caller's — a retry with the same
        token returns 401). Profile media is physically purged from object storage
        **asynchronously**; `media_purge_state` starts `pending`. The user's D8N
        network identity (credentials/identifiers) and other brands are untouched —
        platform-wide identity deletion is a separate future capability. Shared and
        safety records (conversations, messages, blocks, reports, enforcements,
        audit) are retained. Re-joining requires fresh registration; closure is not
        reversible through this API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloseAccountRequest"
      responses:
        "200":
          description: The account was closed (or was already closed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloseAccountResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No active membership for this brand (`account_unavailable`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Missing or wrong confirmation (`confirmation_required`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/profile/configuration:
    get:
      operationId: getProfileConfiguration
      tags: [Profile]
      summary: Get the resolved brand's onboarding and profile contract
      responses:
        "200":
          description: Brand-owned field and controlled-option configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileConfigurationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/profile:
    get:
      operationId: getProfile
      tags: [Profile]
      summary: Get the current brand profile
      responses:
        "200":
          description: Current profile and resumable onboarding state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: updateProfile
      tags: [Profile]
      summary: Create or update the current brand profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated owner profile and resumable onboarding state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProfileOrMembershipRequired"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/profile/preferences:
    get:
      operationId: getProfilePreferences
      tags: [Profile]
      summary: Get the current brand preferences
      responses:
        "200":
          description: Current preferences or null.
          content:
            application/json:
              schema:
                type: object
                required: [preferences]
                properties:
                  preferences:
                    oneOf:
                      - $ref: "#/components/schemas/ProfilePreferences"
                      - type: "null"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: updateProfilePreferences
      tags: [Profile]
      summary: Create or update current brand preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfilePreferencesUpdate"
      responses:
        "200":
          description: Updated preferences.
          content:
            application/json:
              schema:
                type: object
                required: [preferences]
                properties:
                  preferences:
                    $ref: "#/components/schemas/ProfilePreferences"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProfileOrMembershipRequired"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/profile/options:
    patch:
      operationId: replaceProfileOptions
      tags: [Profile]
      summary: Replace selections for supplied controlled-option groups
      description: Omitted groups are unchanged. Supplied group arrays replace that group's active selections.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [selections]
              properties:
                selections:
                  type: object
                  additionalProperties:
                    type: array
                    items:
                      type: string
      responses:
        "200":
          description: Updated owner profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProfileOrMembershipRequired"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/profile/publication:
    post:
      operationId: activateProfile
      tags: [Profile]
      summary: Activate and publish a complete profile
      responses:
        "200":
          description: Activated owner profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProfileOrMembershipRequired"
        "422":
          description: Profile does not satisfy current brand completion requirements.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncompleteProfileError"
    delete:
      operationId: deactivateProfile
      tags: [Profile]
      summary: Hide and deactivate the current profile
      responses:
        "200":
          description: Deactivated owner profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProfileOrMembershipRequired"
  /api/v1/profile/location:
    put:
      operationId: replaceProfileLocation
      tags: [Profile]
      summary: Replace the current profile's private precise location
      description: Coordinates are accepted but never returned by this API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileLocationUpdate"
      responses:
        "200":
          description: Private location state without coordinates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileLocationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProfileOrMembershipRequired"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      operationId: deleteProfileLocation
      tags: [Profile]
      summary: Soft-delete the current profile's precise location
      responses:
        "200":
          description: Location is no longer configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileLocationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProfileOrMembershipRequired"
  /api/v1/profile/photos:
    get:
      operationId: listProfilePhotos
      tags: [Profile]
      summary: List the current profile's photos
      description: |
        Each attached image carries a short-lived signed retrieval `url` (direct
        from private R2) plus its `url_expires_in` seconds. Refetch to renew.
      responses:
        "200":
          description: Owner photo library.
          content:
            application/json:
              schema:
                type: object
                required: [photos]
                properties:
                  photos:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProfilePhoto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createProfilePhoto
      tags: [Profile]
      summary: Attach a completed direct upload to the profile
      description: |
        Second step of the direct-to-R2 upload. Submit the `signed_id` returned by
        `POST /api/v1/profile/photos/uploads` after the bytes have been `PUT` to the
        presigned URL. D8N confirms the object exists in private R2, verifies its
        real file signature and size (the declared MIME is only a hint), and
        attaches it to the authenticated owner's profile. New photos begin
        `pending_review`; initial visibility follows the brand policy (HookUs:
        `visible` immediately with asynchronous moderation; other brands: `hidden`
        until moderated). A `signed_id` may be attached only once. The upload is
        then processed asynchronously into a safe, EXIF-stripped display
        derivative (`processing_state`); other users only ever see that
        derivative, and only once it is `ready`. Until then the photo is not
        exposed in discovery/matches even if visible.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signed_id]
              properties:
                signed_id:
                  type: string
                  description: Opaque signed id from the upload-intent response.
                position:
                  type: integer
                  minimum: 0
      responses:
        "201":
          description: Photo accepted for processing/review.
          content:
            application/json:
              schema:
                type: object
                required: [photo]
                properties:
                  photo:
                    $ref: "#/components/schemas/ProfilePhoto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProfileOrMembershipRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/profile/photos/uploads:
    post:
      operationId: createProfilePhotoUpload
      tags: [Profile]
      summary: Request a direct-to-R2 photo upload authorization
      description: |
        First step of the direct-to-R2 upload (control plane). Declare the file's
        `content_type`, `byte_size`, and base64 MD5 `checksum`. D8N authorizes the
        caller, validates the declared media, allocates the object identity, and
        returns a short-lived presigned `PUT` `url` plus the exact `headers` to send
        with it. Upload the bytes directly to that URL, then attach the returned
        `signed_id` via `POST /api/v1/profile/photos`. D8N chooses the object key;
        the client never receives R2 credentials.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content_type, byte_size, checksum]
              properties:
                content_type:
                  type: string
                  enum: [image/jpeg, image/png, image/webp]
                byte_size:
                  type: integer
                  minimum: 1
                  description: Exact byte size of the file to upload (max 10 MB).
                checksum:
                  type: string
                  description: Base64-encoded MD5 digest of the file bytes.
                filename:
                  type: string
      responses:
        "201":
          description: Short-lived upload authorization.
          content:
            application/json:
              schema:
                type: object
                required: [upload]
                properties:
                  upload:
                    $ref: "#/components/schemas/ProfilePhotoUpload"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProfileOrMembershipRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/profile/photos/{id}:
    delete:
      operationId: deleteProfilePhoto
      tags: [Profile]
      summary: Soft-delete a profile photo
      parameters:
        - $ref: "#/components/parameters/PhotoId"
      responses:
        "200":
          description: Soft-deleted owner photo record.
          content:
            application/json:
              schema:
                type: object
                required: [photo]
                properties:
                  photo:
                    $ref: "#/components/schemas/ProfilePhoto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/discovery:
    get:
      operationId: getDiscovery
      tags: [Matching]
      summary: Get a page of eligible public profiles for the selected mode
      description: |
        `mode` selects the discovery feed. All modes apply the **same**
        eligibility rules (brand isolation, active/visible profiles,
        current-user exclusion, reciprocal age/gender/preference, distance,
        blocking/exclusions) — they differ only in ordering:
          * `for_you` (default) — the compatibility-ranked HookUs feed.
          * `new_here` — the newest eligible profiles first, deterministic on
            recency; the compatibility payload is still included.
        A request without `mode` behaves exactly as before (`for_you`).

        `vibe` and `online` are optional facet filters, orthogonal to `mode` and
        to each other; they narrow the feed without relaxing eligibility and
        combine freely (e.g. `?mode=new_here&vibe=420_friendly&online=true`):
          * `vibe` — profiles that publicly selected that "vibes" option. An
            unknown vibe yields `invalid_filter`.
          * `online=true` — profiles whose user has been active within the last
            10 minutes (session activity), i.e. "online now".

        The returned `next_cursor` encodes the mode and every active facet, so a
        later page cannot switch strategy or silently drop/change a filter:
        replaying a cursor under a different mode/vibe/online yields
        `invalid_cursor`. An unknown mode yields `invalid_mode`.

        Each profile includes `photos`: safe, EXIF-stripped display derivatives
        with short-lived signed URLs. Raw originals are never exposed.
      parameters:
        - $ref: "#/components/parameters/DiscoveryMode"
        - $ref: "#/components/parameters/DiscoveryVibe"
        - $ref: "#/components/parameters/DiscoveryOnline"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Strategy-ranked profiles and an opaque next cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Current profile is not active and discoverable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Production matching is not configured for this brand.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/InvalidInput"
  /api/v1/profiles/{profile_id}/likes:
    post:
      operationId: likeProfile
      tags: [Matching]
      summary: Idempotently like an eligible public profile
      parameters:
        - $ref: "#/components/parameters/PublicProfileId"
      responses:
        "200":
          description: Existing like returned idempotently.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LikeResponse"
        "201":
          description: Like created; a mutual like may also create a match.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LikeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/InteractionConflict"
  /api/v1/profiles/{profile_id}/pass:
    post:
      operationId: passProfile
      tags: [Matching]
      summary: Idempotently pass on an eligible public profile
      parameters:
        - $ref: "#/components/parameters/PublicProfileId"
      responses:
        "200":
          description: Existing pass returned idempotently.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PassResponse"
        "201":
          description: Pass created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PassResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/InteractionConflict"
  /api/v1/blocks:
    get:
      operationId: listBlockedProfiles
      tags: [Trust]
      summary: List the profiles the current member has blocked
      description: |
        Returns only outgoing blocks (blocker is the current member), newest
        first, for the Settings / Safety "Blocked users" surface. Blocks whose
        target account was since removed are omitted. Each entry exposes the
        minimum profile information needed to recognise and unblock the target.
      responses:
        "200":
          description: The current member's blocked profiles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockedProfilesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProfileOrMembershipRequired"
  /api/v1/profiles/{profile_id}/block:
    post:
      operationId: blockProfile
      tags: [Trust]
      summary: Idempotently block a current-brand profile
      description: |
        Blocking applies in either direction for discovery, interactions, match lists,
        and conversation access. It removes existing likes and ends an active match.
      parameters:
        - $ref: "#/components/parameters/PublicProfileId"
      responses:
        "200":
          description: The directional block already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockResponse"
        "201":
          description: The directional block was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProfileOrMembershipRequired"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: unblockProfile
      tags: [Trust]
      summary: Idempotently remove the current profile's directional block
      description: |
        Unknown, cross-brand, self, and soft-deleted targets receive the same no-content
        response. Unblocking does not restore likes or reactivate an ended match.
      parameters:
        - $ref: "#/components/parameters/PublicProfileId"
      responses:
        "204":
          description: The request completed without disclosing target or block state.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProfileOrMembershipRequired"
  /api/v1/profiles/{profile_id}/report:
    post:
      operationId: reportProfile
      tags: [Trust]
      summary: File a safety report against a current-brand profile
      description: |
        Reporting is independent of blocking and does not change the target's
        visibility, moderation status, or photo processing — it records an audit
        signal for administrative review. It is idempotent per open report: while
        an earlier report from the same reporter against the same target is still
        open, repeat submissions return `created: false` and do not stack.
        Unknown, cross-brand, and self targets share the `profile_unavailable`
        (404) response so target existence is never disclosed.
      parameters:
        - $ref: "#/components/parameters/PublicProfileId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportRequest"
      responses:
        "200":
          description: An open report from this reporter against this target already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResponse"
        "201":
          description: The report was filed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProfileOrMembershipRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/matches:
    get:
      operationId: listMatches
      tags: [Matching]
      summary: List current live matches
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Live matches and an opaque next cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProfileOrMembershipRequired"
        "422":
          $ref: "#/components/responses/InvalidInput"
  /api/v1/conversations:
    get:
      operationId: listConversations
      tags: [Messaging]
      summary: List conversations for the current brand profile
      description: |
        Participant-scoped conversation cards, newest-first, each with a preview of
        its latest message (or null). Read the full history via the per-conversation
        messages endpoint.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Participant-scoped conversations and an opaque next cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProfileOrMembershipRequired"
        "422":
          $ref: "#/components/responses/InvalidInput"
  /api/v1/matches/{match_id}/conversation:
    post:
      operationId: startConversation
      tags: [Messaging]
      summary: Idempotently open the conversation for a live match
      parameters:
        - $ref: "#/components/parameters/PublicMatchId"
      responses:
        "200":
          description: Existing conversation returned idempotently.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartConversationResponse"
        "201":
          description: Conversation and both profile participants created atomically.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartConversationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Match is unavailable, cross-brand, or does not include the current profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/conversations/{conversation_id}/messages:
    get:
      operationId: listMessages
      tags: [Messaging]
      summary: List a conversation's messages, newest first
      description: |
        Participant-scoped, cursor-paginated plain-text message history for one
        conversation, ordered newest-first by (created_at, id). Only the two
        conversation participants may read. Unknown, cross-brand, non-participant,
        ended, unavailable (suspended/deleted participant), and blocked
        conversations all return the same neutral 404 `conversation_unavailable`;
        the block is never disclosed. History is always bounded by `limit`; page
        backward into older messages with `next_cursor`. A message cursor is bound
        to its brand, viewer, and conversation and cannot be replayed elsewhere.
      parameters:
        - $ref: "#/components/parameters/PublicConversationId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/MessageLimit"
      responses:
        "200":
          description: A page of messages, newest first, and an opaque next cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Conversation is unavailable, cross-brand, ended, blocked, or not the current profile's.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/InvalidInput"
    post:
      operationId: sendMessage
      tags: [Messaging]
      summary: Send a plain-text message to a conversation
      description: |
        Appends one plain-text message after re-authorizing the sender
        (participant, active match, both participants available, neither side
        blocking the other). The body is treated as untrusted input, NFC-normalized,
        and must be non-blank and at most 2000 characters; Unicode/emoji is
        preserved. Content never enters logs. Beta accepts at-least-once client
        sends (no idempotency key), so a retried request creates a second message.
      parameters:
        - $ref: "#/components/parameters/PublicConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "201":
          description: The message was persisted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendMessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Conversation is unavailable, cross-brand, ended, blocked, or not the current profile's.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Body is blank (`message_blank`) or too long (`message_too_long`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/reports:
    get:
      operationId: listReports
      tags: [Admin]
      summary: List the moderation queue for the current brand
      description: |
        Authorized-moderator only. Returns reports for the request's brand
        (resolved from the host — a brand id is never accepted from the client),
        oldest-first by (created_at, id) so the longest-waiting reports surface
        first, cursor-paginated and bounded. Access requires an active AdminUser
        with an active assignment for this brand: unauthenticated callers get 401,
        ordinary users and admins assigned elsewhere get 403. Cross-brand reports
        are simply absent, never disclosed.
      parameters:
        - $ref: "#/components/parameters/ReportStatusFilter"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/AdminReportLimit"
      responses:
        "200":
          description: A page of reports and an opaque next cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminReportListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "422":
          $ref: "#/components/responses/InvalidInput"
  /api/v1/admin/reports/{id}:
    get:
      operationId: getReport
      tags: [Admin]
      summary: Inspect one report
      description: |
        Authorized-moderator only. The read is audited (a sensitive-read
        SecurityEvent is recorded). Unknown and cross-brand ids share the neutral
        `report_unavailable` (404). Only moderator-relevant fields are returned;
        no credentials, sessions, email/phone, private location, or media.
      parameters:
        - $ref: "#/components/parameters/ReportId"
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminReportResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "404":
          description: Report is unknown or belongs to another brand.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateReport
      tags: [Admin]
      summary: Apply a moderation lifecycle transition
      description: |
        Authorized-moderator only. Applies one lifecycle transition and records the
        decision (audited; `reviewed_by`/`reviewed_at`/`resolution_note` set). Only
        `status` and an optional short `note` are accepted; report internals
        (reporter, target, brand, reason, timestamps) can never be mass-assigned.
        Transitions: `open → reviewing | dismissed`, `reviewing → actioned |
        dismissed | open`. `actioned`/`dismissed` are terminal. `actioned` means
        "resolved as warranting action" — it does NOT suspend or ban the account;
        account enforcement is a separate capability (TS-04). A disallowed target
        from a non-terminal state is `invalid_transition` (422); a transition out of
        a terminal state (e.g. another moderator already resolved it) is
        `report_conflict` (409).
      parameters:
        - $ref: "#/components/parameters/ReportId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReportRequest"
      responses:
        "200":
          description: The updated report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminReportResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "404":
          description: Report is unknown or belongs to another brand.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The report is already in a terminal state (`report_conflict`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Invalid `status`, `invalid_transition`, or an oversized `note`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/profiles/{profile_id}/suspension:
    post:
      operationId: suspendProfile
      tags: [Admin]
      summary: Apply a brand-level suspension to a profile's owner
      description: |
        Authorized-moderator only. Brand-level enforcement: suspends the target's
        membership in this brand, revokes all of their sessions for this brand, and
        records an audited, reversible `AccountEnforcement`. Everything happens in
        one transaction. The target's network identity and any other-brand access
        are untouched (platform-wide bans are not modelled yet). Enforcement is
        deliberately separate from the report lifecycle: an optional `report_id`
        links the cause without changing that report's status. Idempotent-by-
        conflict: a second suspension of an already-suspended user returns 409
        `already_suspended`. Cross-brand/unknown targets return neutral
        `profile_unavailable` (404).
      parameters:
        - $ref: "#/components/parameters/PublicProfileId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuspendProfileRequest"
      responses:
        "201":
          description: The suspension was applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEnforcementResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "404":
          description: Target is unknown or belongs to another brand (`profile_unavailable`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The target is already suspended (`already_suspended`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: An unknown `report_id` (`invalid_report`) or an oversized `reason`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: reinstateProfile
      tags: [Admin]
      summary: Lift a brand-level suspension
      description: |
        Authorized-moderator only. Reactivates the membership and marks the
        enforcement reverted, audited, in one transaction. Restores ONLY what
        suspension changed — it does not revive revoked sessions (the user logs in
        again), ended matches, blocks, or deleted data. Reinstating a profile that
        is not suspended returns 409 `not_suspended`.
      parameters:
        - $ref: "#/components/parameters/PublicProfileId"
      responses:
        "200":
          description: The suspension was lifted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEnforcementResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "404":
          description: Target is unknown or belongs to another brand (`profile_unavailable`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The target is not currently suspended (`not_suspended`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Opaque brand-bound D8N session token.
  parameters:
    DiscoveryMode:
      name: mode
      in: query
      required: false
      description: |
        Discovery feed selector. Omitted or `for_you` returns the default
        compatibility-ranked feed; `new_here` returns the newest eligible
        profiles first. Eligibility is identical across modes. An unsupported
        value returns 422 `invalid_mode`.
      schema:
        type: string
        enum: [for_you, new_here]
        default: for_you
    DiscoveryVibe:
      name: vibe
      in: query
      required: false
      description: |
        Optional facet filter: a public "vibes" option code (e.g.
        `420_friendly`). Narrows the feed to profiles that selected it, on top of
        the normal eligibility rules, and combines with any `mode`. An
        unsupported value returns 422 `invalid_filter`.
      schema:
        type: string
    DiscoveryOnline:
      name: online
      in: query
      required: false
      description: |
        Optional "online now" facet. When `true`, narrows the feed to profiles
        whose user has been active in the last 10 minutes. Combines with `mode`
        and `vibe`.
      schema:
        type: boolean
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque signed cursor returned by the same endpoint and brand.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    PublicProfileId:
      name: profile_id
      in: path
      required: true
      description: Stable public profile UUID from discovery.
      schema:
        type: string
        format: uuid
    PhotoId:
      name: id
      in: path
      required: true
      description: Owner photo record ID.
      schema:
        type: integer
    PublicMatchId:
      name: match_id
      in: path
      required: true
      description: Stable public match UUID from the match list.
      schema:
        type: string
        format: uuid
    PublicConversationId:
      name: conversation_id
      in: path
      required: true
      description: Stable public conversation UUID from the conversation list or start-conversation response.
      schema:
        type: string
        format: uuid
    MessageLimit:
      name: limit
      in: query
      required: false
      description: Page size for message history.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 30
    ReportId:
      name: id
      in: path
      required: true
      description: Internal report id (admin-only; scoped to the moderator's brand).
      schema:
        type: integer
    ReportStatusFilter:
      name: status
      in: query
      required: false
      description: Narrow the queue to one lifecycle status. Unknown values return 422 `invalid_filter`.
      schema:
        type: string
        enum: [open, reviewing, actioned, dismissed]
    AdminReportLimit:
      name: limit
      in: query
      required: false
      description: Page size for the moderation queue.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  responses:
    Unauthorized:
      description: Missing, invalid, expired, revoked, or wrong-brand bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AdminForbidden:
      description: Authenticated, but not an authorized moderator for this brand (`forbidden`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BrandRequired:
      description: Request host did not resolve to an active brand.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AuthMethodUnavailable:
      description: Request host did not resolve to an active brand, or this authentication method is disabled.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Authentication rate limit exceeded.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds before another request should be attempted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ProfileOrMembershipRequired:
      description: Required brand membership/profile/lifecycle state is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InvalidInput:
      description: Request input, cursor, or limit is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationFailed:
      description: Validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"
    NotFound:
      description: Resource is unavailable, including cross-brand resources.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InteractionConflict:
      description: Interaction conflicts with the current participant state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthResponse:
      type: object
      required: [status, app, api_version, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        app:
          const: d8n
        api_version:
          const: v1
        checks:
          type: object
          required: [primary_database, queue_database]
          properties:
            primary_database:
              type: string
              enum: [ok, unavailable]
            queue_database:
              type: string
              enum: [ok, unavailable]
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    ValidationError:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          required: [details]
          properties:
            details:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
    BrandSummary:
      type: object
      required: [slug, name]
      properties:
        slug:
          type: string
        name:
          type: string
    AuthMethodsResponse:
      type: object
      required: [brand, methods]
      properties:
        brand:
          $ref: "#/components/schemas/BrandSummary"
        methods:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [phone_password, email_password, google]
    IdentifierVerificationRequest:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [phone, email]
    PasswordAuthRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          description: International phone number or email address; normalized by the server.
        password:
          type: string
          format: password
          minLength: 6
          description: At least 6 characters and no more than 72 UTF-8 bytes.
        device_name:
          type: [string, "null"]
          maxLength: 120
    PasswordChangeRequest:
      type: object
      required: [current_password, password, password_confirmation]
      properties:
        current_password:
          type: string
          format: password
        password:
          type: string
          format: password
          minLength: 6
          description: At least 6 characters, no more than 72 UTF-8 bytes, and different from the current password.
        password_confirmation:
          type: string
          format: password
    IdentifierVerification:
      type: object
      required: [kind, code]
      properties:
        kind:
          type: string
          enum: [phone, email]
        code:
          type: string
          pattern: "^[0-9]{6}$"
    IdentifierVerificationResponse:
      type: object
      required: [identifier]
      properties:
        identifier:
          type: object
          required: [kind, verified]
          properties:
            kind:
              type: string
              enum: [phone, email]
            verified:
              const: true
    AuthSessionResponse:
      type: object
      required: [token, token_type, expires_at, user_id, brand]
      properties:
        token:
          type: string
          description: Secret bearer token returned only when the session is issued.
        token_type:
          const: Bearer
        expires_at:
          type: string
          format: date-time
        user_id:
          type: integer
          description: Private platform identity ID; do not use as a public dating-profile ID.
        brand:
          $ref: "#/components/schemas/BrandSummary"
    PasswordAuthSessionResponse:
      allOf:
        - $ref: "#/components/schemas/AuthSessionResponse"
        - type: object
          required: [identifier, onboarding]
          properties:
            identifier:
              type: object
              required: [kind, verified]
              properties:
                kind:
                  type: string
                  enum: [phone, email]
                verified:
                  type: boolean
                  description: False until D8N separately proves control of the phone or email.
            onboarding:
              $ref: "#/components/schemas/ProfileOnboardingStatus"
    MeResponse:
      type: object
      required: [user_id, brand, session]
      properties:
        user_id:
          type: integer
        brand:
          $ref: "#/components/schemas/BrandSummary"
        session:
          type: object
          required: [id, expires_at]
          properties:
            id:
              type: integer
            expires_at:
              type: string
              format: date-time
    CloseAccountRequest:
      type: object
      required: [confirmation]
      properties:
        confirmation:
          type: string
          enum: [close]
          description: Must equal "close" to authorize this one-way destructive action.
    CloseAccountResponse:
      type: object
      required: [closed, already_closed, media_purge_state]
      properties:
        closed:
          const: true
        already_closed:
          type: boolean
          description: True when the account was already closed (idempotent).
        media_purge_state:
          type: string
          enum: [pending, completed, failed]
          description: Async physical media-purge status; starts pending.
    Completion:
      type: object
      required: [complete, percent, missing]
      properties:
        complete:
          type: boolean
        percent:
          type: integer
          minimum: 0
          maximum: 100
        missing:
          type: array
          items:
            type: string
    ProfileUpdate:
      type: object
      properties:
        display_name:
          type: [string, "null"]
          maxLength: 80
        bio:
          type: [string, "null"]
          maxLength: 1000
        birthdate:
          type: [string, "null"]
          format: date
        gender:
          type: [string, "null"]
          maxLength: 40
        visibility:
          type: string
          enum: [hidden, visible]
        country_code:
          type: [string, "null"]
          pattern: "^[A-Z]{2}$"
        city:
          type: [string, "null"]
          maxLength: 120
        occupation:
          type: [string, "null"]
          maxLength: 120
        height_cm:
          type: [integer, "null"]
          minimum: 100
          maximum: 250
        body_type:
          type: [string, "null"]
          maxLength: 80
        languages_spoken:
          type: array
          maxItems: 15
          items:
            type: string
            maxLength: 40
        smoking:
          type: [string, "null"]
          enum: [never, occasionally, regularly, null]
        drinking:
          type: [string, "null"]
          enum: [never, occasionally, regularly, null]
        fitness:
          type: [string, "null"]
          enum: [never, occasionally, regularly, null]
    OwnerProfile:
      allOf:
        - $ref: "#/components/schemas/ProfileUpdate"
        - type: object
          required: [id, brand, status, visibility, options, completion, languages_spoken]
          properties:
            id:
              type: string
              format: uuid
            brand:
              $ref: "#/components/schemas/BrandSummary"
            status:
              type: string
              enum: [draft, active, suspended]
            visibility:
              type: string
              enum: [hidden, visible]
            options:
              $ref: "#/components/schemas/ProfileOptionSelections"
            completion:
              $ref: "#/components/schemas/Completion"
    OwnerProfileResponse:
      type: object
      required: [profile]
      properties:
        profile:
          $ref: "#/components/schemas/OwnerProfile"
    CurrentProfileResponse:
      type: object
      required: [profile, onboarding]
      properties:
        profile:
          oneOf:
            - $ref: "#/components/schemas/OwnerProfile"
            - type: "null"
        onboarding:
          $ref: "#/components/schemas/ProfileOnboardingStatus"
    ProfileOnboardingStatus:
      type: object
      required: [state, next_step, profile_exists, profile_complete, profile_published, completion]
      properties:
        state:
          type: string
          enum: [profile_required, profile_incomplete, ready_to_publish, complete, profile_suspended]
        next_step:
          type: [string, "null"]
          enum: [profile, preferences, photos, options, publication, null]
        profile_exists:
          type: boolean
        profile_complete:
          type: boolean
        profile_published:
          type: boolean
        completion:
          $ref: "#/components/schemas/Completion"
    ProfileOptionSelections:
      type: object
      additionalProperties:
        type: array
        items:
          type: string
    PublicProfilePhoto:
      type: object
      required: [position, url, url_expires_in]
      description: |
        A safe, D8N-generated display derivative of a profile photo. It is
        decoded, re-encoded, and stripped of EXIF/GPS/other metadata. Only
        deliverable photos (visible and finished processing) appear; the raw
        original and its storage key are never exposed. The `url` is a
        short-lived signed URL — refetch the profile to renew it.
      properties:
        position:
          type: integer
          minimum: 0
        url:
          type: string
          format: uri
        url_expires_in:
          type: integer
    PublicProfile:
      type: object
      required: [id, age, languages_spoken, photos, options]
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: [string, "null"]
        age:
          type: [integer, "null"]
          minimum: 18
        bio:
          type: [string, "null"]
        gender:
          type: [string, "null"]
        country_code:
          type: [string, "null"]
        city:
          type: [string, "null"]
        occupation:
          type: [string, "null"]
        height_cm:
          type: [integer, "null"]
        body_type:
          type: [string, "null"]
        languages_spoken:
          type: array
          items:
            type: string
        smoking:
          type: [string, "null"]
        drinking:
          type: [string, "null"]
        fitness:
          type: [string, "null"]
        photos:
          type: array
          description: |
            Safe display derivatives, ordered by position. Empty when the profile
            has no photo that is both visible and finished processing.
          items:
            $ref: "#/components/schemas/PublicProfilePhoto"
        options:
          $ref: "#/components/schemas/ProfileOptionSelections"
    Compatibility:
      type: object
      required: [score, confidence, reasons]
      properties:
        score:
          type: integer
          minimum: 0
          maximum: 100
        confidence:
          type: number
          minimum: 0
          maximum: 1
        reasons:
          type: array
          items:
            type: string
            enum: [shared_intent, similar_vibe, mutual_age_fit]
    DiscoveryProfile:
      allOf:
        - $ref: "#/components/schemas/PublicProfile"
        - type: object
          required: [compatibility]
          properties:
            compatibility:
              $ref: "#/components/schemas/Compatibility"
    DiscoveryResponse:
      type: object
      required: [profiles, next_cursor]
      properties:
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/DiscoveryProfile"
        next_cursor:
          type: [string, "null"]
    ProfilePreferencesUpdate:
      type: object
      properties:
        min_age:
          type: [integer, "null"]
          minimum: 18
          maximum: 120
        max_age:
          type: [integer, "null"]
          minimum: 18
          maximum: 120
        interested_in:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 40
        max_distance_km:
          type: [integer, "null"]
          minimum: 1
          maximum: 500
        country:
          type: [string, "null"]
          pattern: "^[A-Z]{2}$"
        relationship_intent:
          type: [string, "null"]
          maxLength: 80
    ProfilePreferences:
      allOf:
        - $ref: "#/components/schemas/ProfilePreferencesUpdate"
        - type: object
          required: [id, profile_id, brand, interested_in]
          properties:
            id:
              type: integer
            profile_id:
              type: string
              format: uuid
            brand:
              $ref: "#/components/schemas/BrandSummary"
    ProfileLocationUpdate:
      type: object
      required: [latitude, longitude, accuracy_meters, captured_at]
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
          writeOnly: true
        longitude:
          type: number
          minimum: -180
          maximum: 180
          writeOnly: true
        accuracy_meters:
          type: integer
          minimum: 0
          maximum: 100000
        captured_at:
          type: string
          format: date-time
    ProfileLocationState:
      type: object
      required: [configured]
      properties:
        configured:
          type: boolean
        accuracy_meters:
          type: integer
        source:
          type: string
          enum: [device, manual, imported]
        captured_at:
          type: string
          format: date-time
    ProfileLocationResponse:
      type: object
      required: [location]
      properties:
        location:
          $ref: "#/components/schemas/ProfileLocationState"
    ProfilePhoto:
      type: object
      required: [id, profile_id, position, status, visibility, processing_state, deleted_at, image]
      properties:
        id:
          type: integer
        profile_id:
          type: string
          format: uuid
        position:
          type: integer
        status:
          type: string
          description: Moderation lifecycle; independent of processing_state and visibility.
          enum: [pending_review, approved, rejected]
        visibility:
          type: string
          enum: [hidden, visible]
        processing_state:
          type: string
          description: |
            Safe-derivative pipeline state. Only `ready` photos are eligible for
            delivery to other users. `image` shows the owner their raw upload
            while `pending`/`processing`, and the safe display derivative once
            `ready`. `failed` marks a permanently unprocessable image.
          enum: [pending, processing, ready, failed]
        deleted_at:
          type: [string, "null"]
          format: date-time
        image:
          oneOf:
            - $ref: "#/components/schemas/ProfilePhotoImage"
            - type: "null"
    ProfilePhotoImage:
      type: object
      required: [filename, content_type, byte_size, url, url_expires_in]
      properties:
        filename:
          type: string
        content_type:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        byte_size:
          type: integer
        url:
          type: string
          description: Short-lived signed retrieval URL (direct from private R2).
        url_expires_in:
          type: integer
          description: Seconds until the signed retrieval URL expires.
    ProfilePhotoUpload:
      type: object
      required: [signed_id, url, headers, expires_in, byte_size_limit, allowed_content_types]
      properties:
        signed_id:
          type: string
          description: Opaque id to submit when attaching the completed upload.
        url:
          type: string
          description: Short-lived presigned PUT URL for the media bytes.
        headers:
          type: object
          additionalProperties:
            type: string
          description: Exact headers to send with the PUT (includes Content-MD5).
        expires_in:
          type: integer
          description: Seconds until the presigned upload URL expires.
        byte_size_limit:
          type: integer
        allowed_content_types:
          type: array
          items:
            type: string
    ProfileConfigurationResponse:
      type: object
      required: [configuration]
      properties:
        configuration:
          $ref: "#/components/schemas/ProfileConfiguration"
    ProfileConfiguration:
      type: object
      required: [profile_fields, preference_fields, collections, option_groups]
      properties:
        profile_fields:
          type: array
          items:
            $ref: "#/components/schemas/ConfiguredField"
        preference_fields:
          type: array
          items:
            $ref: "#/components/schemas/ConfiguredField"
        collections:
          type: array
          items:
            $ref: "#/components/schemas/ConfiguredField"
        option_groups:
          type: array
          items:
            $ref: "#/components/schemas/ConfiguredOptionGroup"
    ConfiguredField:
      type: object
      required: [key, label, required]
      properties:
        key:
          type: string
        label:
          type: string
        required:
          type: boolean
    ConfiguredOptionGroup:
      type: object
      required: [key, label, cardinality, max_selections, required, visibility, options]
      properties:
        key:
          type: string
        label:
          type: string
        cardinality:
          type: string
          enum: [single, multiple]
        max_selections:
          type: integer
        required:
          type: boolean
        visibility:
          type: string
          enum: [owner_only, public_profile]
        options:
          type: array
          items:
            type: object
            required: [code, label]
            properties:
              code:
                type: string
              label:
                type: string
    IncompleteProfileError:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          required: [completion]
          properties:
            completion:
              type: object
              required: [percent, missing]
              properties:
                percent:
                  type: integer
                missing:
                  type: array
                  items:
                    type: string
    LikeResponse:
      type: object
      required: [liked, matched, match_id, created]
      properties:
        liked:
          const: true
        matched:
          type: boolean
        match_id:
          type: [string, "null"]
          format: uuid
        created:
          type: boolean
    PassResponse:
      type: object
      required: [passed, created]
      properties:
        passed:
          const: true
        created:
          type: boolean
    BlockResponse:
      type: object
      required: [blocked, created]
      properties:
        blocked:
          const: true
        created:
          type: boolean
    BlockedProfilesResponse:
      type: object
      required: [blocks]
      properties:
        blocks:
          type: array
          description: Profiles the current member has blocked, newest first.
          items:
            type: object
            required: [profile, blocked_at]
            properties:
              profile:
                type: object
                required: [id, display_name]
                description: Minimum information needed to recognise and unblock the target.
                properties:
                  id:
                    type: string
                    format: uuid
                  display_name:
                    type: [string, "null"]
              blocked_at:
                type: string
                format: date-time
    ReportRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          description: Why the profile is being reported.
          enum: [inappropriate_content, harassment, spam, fake_profile, underage, other]
        note:
          type: [string, "null"]
          maxLength: 2000
          description: Optional free-text detail from the reporter.
    ReportResponse:
      type: object
      required: [reported, created]
      properties:
        reported:
          const: true
        created:
          type: boolean
          description: True when a new report was filed; false when an open report already existed.
    Match:
      type: object
      required: [id, matched_at, profile]
      properties:
        id:
          type: string
          format: uuid
        matched_at:
          type: string
          format: date-time
        profile:
          $ref: "#/components/schemas/PublicProfile"
    MatchListResponse:
      type: object
      required: [matches, next_cursor]
      properties:
        matches:
          type: array
          items:
            $ref: "#/components/schemas/Match"
        next_cursor:
          type: [string, "null"]
    Conversation:
      type: object
      required: [id, match_id, status, created_at, profile, last_message]
      properties:
        id:
          type: string
          format: uuid
        match_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [active, closed]
        created_at:
          type: string
          format: date-time
        profile:
          $ref: "#/components/schemas/PublicProfile"
        last_message:
          description: Preview of the newest message, or null for an empty conversation.
          oneOf:
            - $ref: "#/components/schemas/MessagePreview"
            - type: "null"
    MessagePreview:
      type: object
      required: [id, sender_id, body, created_at]
      properties:
        id:
          type: string
          format: uuid
        sender_id:
          type: [string, "null"]
          format: uuid
          description: Public profile id of the author.
        body:
          type: string
        created_at:
          type: string
          format: date-time
    Message:
      type: object
      required: [id, conversation_id, sender_id, body, created_at]
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        sender_id:
          type: string
          format: uuid
          description: |
            Public profile id of the author. The client identifies its own
            messages by comparing against the counterpart profile id on the
            conversation (there are exactly two participants).
        body:
          type: string
        created_at:
          type: string
          format: date-time
    MessageListResponse:
      type: object
      required: [messages, next_cursor]
      properties:
        messages:
          type: array
          description: Newest-first page of messages.
          items:
            $ref: "#/components/schemas/Message"
        next_cursor:
          type: [string, "null"]
    SendMessageRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 2000
          description: Plain-text message. Non-blank, NFC-normalized, Unicode preserved.
    SendMessageResponse:
      type: object
      required: [message]
      properties:
        message:
          $ref: "#/components/schemas/Message"
    AdminReportParty:
      description: Minimal identity of a report participant, or null if unresolved.
      oneOf:
        - type: object
          required: [id, display_name]
          properties:
            id:
              type: string
              format: uuid
            display_name:
              type: [string, "null"]
        - type: "null"
    AdminReport:
      type: object
      required:
        [id, status, reason, reporter, reported, note, resolution_note,
         reviewed_by_admin_user_id, reviewed_at, created_at, updated_at]
      properties:
        id:
          type: integer
        status:
          type: string
          enum: [open, reviewing, actioned, dismissed]
        reason:
          type: string
          enum: [inappropriate_content, harassment, spam, fake_profile, underage, other]
        reporter:
          $ref: "#/components/schemas/AdminReportParty"
        reported:
          $ref: "#/components/schemas/AdminReportParty"
        note:
          type: [string, "null"]
          description: Reporter-supplied context.
        resolution_note:
          type: [string, "null"]
          description: Moderator's short decision note.
        reviewed_by_admin_user_id:
          type: [integer, "null"]
        reviewed_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AdminReportListResponse:
      type: object
      required: [reports, next_cursor]
      properties:
        reports:
          type: array
          items:
            $ref: "#/components/schemas/AdminReport"
        next_cursor:
          type: [string, "null"]
    AdminReportResponse:
      type: object
      required: [report]
      properties:
        report:
          $ref: "#/components/schemas/AdminReport"
    UpdateReportRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [reviewing, actioned, dismissed, open]
          description: Target lifecycle status. Server enforces valid transitions.
        note:
          type: [string, "null"]
          maxLength: 2000
          description: Optional short moderator decision note.
    SuspendProfileRequest:
      type: object
      properties:
        reason:
          type: [string, "null"]
          maxLength: 500
          description: Optional short moderator reason (audited, never exposed publicly).
        report_id:
          type: [integer, "null"]
          description: Optional id of the report that motivated the enforcement (same brand).
    AdminEnforcement:
      type: object
      required:
        [id, state, profile_id, reason, report_id, admin_user_id,
         reverted_by_admin_user_id, created_at, reverted_at]
      properties:
        id:
          type: integer
        state:
          type: string
          enum: [active, reverted]
          description: The enforcement's own state, distinct from account/report status.
        profile_id:
          type: [string, "null"]
          format: uuid
        reason:
          type: [string, "null"]
        report_id:
          type: [integer, "null"]
        admin_user_id:
          type: integer
        reverted_by_admin_user_id:
          type: [integer, "null"]
        created_at:
          type: string
          format: date-time
        reverted_at:
          type: [string, "null"]
          format: date-time
    AdminEnforcementResponse:
      type: object
      required: [enforcement]
      properties:
        enforcement:
          $ref: "#/components/schemas/AdminEnforcement"
    StartConversationResponse:
      type: object
      required: [conversation, created]
      properties:
        conversation:
          $ref: "#/components/schemas/Conversation"
        created:
          type: boolean
    ConversationListResponse:
      type: object
      required: [conversations, next_cursor]
      properties:
        conversations:
          type: array
          items:
            $ref: "#/components/schemas/Conversation"
        next_cursor:
          type: [string, "null"]

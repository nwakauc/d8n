openapi: 3.1.0
info:
  title: D8N Core API
  version: 1.0.0
  summary: Multi-brand dating platform API
  description: |
    D8N resolves the active brand from the request host. Never send a brand ID in
    client-controlled input. Bearer sessions are brand-bound, and profile identifiers
    exposed by dating endpoints are public UUIDs rather than internal database IDs.

    ## Implementation status (for frontend integration)

    Every path documented in this contract is implemented and callable. Use this
    summary to see which product domains are complete versus intentionally limited:

    - **Available now:** Identity (register, login, password and login-email
      change, recovery, brand-bound session, identifier verification), Profiles (profile,
      configuration, options, preferences, location, publication), HookUs Matching
      (discovery, likes, passes, matches), DateZA Find (10 unique profiles per
      Johannesburg day) with deterministic DateZA v1 compatibility and
      verification-gated DateZA interactions, and Trust foundations (block,
      report, brand-scoped review and suspension).
    - **Preview (limited scope):** Messaging supports match-gated plain-text
      messages and history. Client idempotency, delivery/read receipts, realtime,
      and message media are not available.
    - **Available (owner-scoped, private):** Profile photos use a direct-to-R2
      upload — request an intent, `PUT` the bytes to the returned short-lived
      presigned URL, then attach the returned `signed_id`. Attached photos begin
      `pending_review`; initial visibility is a per-brand policy — HookUs photos
      are `visible` immediately and moderated asynchronously, while brands without
      an explicit policy stay `hidden` until moderated. Delivery is a short-lived
      signed URL. Public/other-user delivery, safe re-encoding, EXIF removal, and
      moderation enforcement remain gated (ADR 0011). The endpoints require private
      R2 storage, so they return `404` when R2 is disabled.
    - **Preview (limited scope):** Admin exposes brand-scoped report review and
      suspension APIs; stronger admin authentication/RBAC and the complete admin
      product remain gated.
    - **Available foundation:** Product Notifications exposes a brand-scoped,
      polling-friendly in-app inbox and read state. DateZA registration produces
      `dateza.welcome`; product email is asynchronous. Device/push storage and a
      provider boundary exist, but device-registration API and a production push
      provider remain gated.
    - **Planned (no consumer product endpoints yet):** RealMe verification,
      Billing, and Analytics.

    DateZA is a provisionable tenant (`DateZA`, slug `dateza`) with phone/email
    password authentication, a v1 profile catalog, and Find with a durable daily
    10-unique-profile allowance plus deterministic `dateza_v1` compatibility on
    sufficiently informed Find cards. Daily Discovery 10, RealMe, public Trust
    standing, AI Matchmaker, notification UI/device enrollment, and
    subscriptions/entitlements are not implemented. DateZA Discovery remains
    deliberately unconfigured.

    The live API root (`GET /`) returns the same per-service status machine-readably.
servers:
  - url: /
    description: Current API origin (use this for the self-hosted Swagger UI)
  - url: https://{brandHost}
    description: Production brand-specific API origin
    variables:
      brandHost:
        default: hookus.example.com
security:
  - bearerAuth: []
tags:
  - name: System
  - name: Authentication
  - name: Profile
  - name: Matching
  - name: Messaging
  - name: Notifications
  - name: Trust
  - name: Hooks
    description: |
      🔥 Hook — a stronger-intent interaction than a Like. The sender gets exactly
      ONE unsolicited opening message to a recipient and is then locked out until
      the recipient engages. The recipient's first reply IS acceptance: it creates
      a normal Match + Conversation, after which all further chat flows through the
      standard Messaging endpoints. See ADR 0015.
  - name: Hook Tonight
    description: |
      Hook Tonight — a TEMPORARY "I'm available/open to meeting tonight"
      availability signal (distinct from a 🔥 Hook, which says "I specifically
      want you"). Activating surfaces a member in the Hook Tonight discovery pool
      of other compatible, currently-available members; it never creates a match
      or conversation on its own. To approach someone found there, the member
      sends the existing 🔥 Hook. Availability lapses automatically and is checked
      against the clock at read time, so a stale activation never makes anyone
      appear available.
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      tags: [System]
      summary: Check API dependency readiness
      description: |
        Reports whether the web process can reach both the primary PostgreSQL
        database and the Solid Queue database. Use `/up` for boot/liveness and
        this endpoint for readiness. It is intentionally independent of brand
        host resolution and exposes no connection details.
      security: []
      responses:
        "200":
          description: API is available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: One or more required database dependencies are unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/openapi.json:
    get:
      operationId: getOpenapiContract
      tags: [System]
      summary: Download this API contract as JSON
      security: []
      responses:
        "200":
          description: OpenAPI contract for the deployed commit.
          content:
            application/json:
              schema:
                type: object
  /api/v1/auth/methods:
    get:
      operationId: getAuthenticationMethods
      tags: [Authentication]
      summary: List implemented authentication methods enabled for this brand
      security: []
      responses:
        "200":
          description: Host-resolved brand and currently available methods.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMethodsResponse"
        "404":
          $ref: "#/components/responses/BrandRequired"
  /api/v1/auth/password/register:
    post:
      operationId: registerWithPassword
      tags: [Authentication]
      summary: Register immediately with a phone or email and password
      description: |
        Creates a D8N identity, current-brand membership, and brand-bound session.
        Registration does not prove control of the phone number or email address;
        the returned identifier remains unverified until a later verification flow.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordAuthRequest"
      responses:
        "201":
          description: Account, membership, password credential, and session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordAuthSessionResponse"
        "404":
          $ref: "#/components/responses/AuthMethodUnavailable"
        "409":
          description: The request already carries an authenticated D8N session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Registration cannot be completed with the supplied input.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/password/login:
    post:
      operationId: loginWithPassword
      tags: [Authentication]
      summary: Log in with an existing phone or email password credential
      description: |
        Login requires an existing active membership in the host-resolved brand.
        It never enrolls an existing D8N identity into another brand implicitly.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordAuthRequest"
      responses:
        "201":
          description: Brand-bound session issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordAuthSessionResponse"
        "401":
          description: Identifier, password, account lifecycle, or membership is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/AuthMethodUnavailable"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/password:
    patch:
      operationId: changePassword
      tags: [Authentication]
      summary: Change the current password after reauthentication
      description: |
        Requires a password-backed brand session and the current password in the
        same request. A successful change keeps the current session and revokes
        every other active session issued from the affected password credential.
        Unauthenticated account recovery through phone or email is not this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChangeRequest"
      responses:
        "200":
          description: Password changed and other affected sessions revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: The bearer session or current password is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The current session was not issued from a password credential.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The replacement password is invalid, mismatched, or unchanged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/email/change:
    post:
      operationId: requestEmailChange
      tags: [Authentication]
      summary: Request a verification code for a replacement login email
      description: |
        Requires a bearer session issued from the email/password credential being
        changed plus the current password in this request. The replacement is
        normalized and must not already belong to another D8N identity. D8N sends
        a single-use 10-minute code to the proposed email while leaving the current
        identifier, password credential, and login behavior untouched. Malformed,
        unchanged, and occupied replacement addresses share one
        `email_change_unavailable` response after successful reauthentication.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailChangeRequest"
      responses:
        "202":
          description: A purpose- and session-bound code was queued for the proposed email.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: The bearer session or current password is invalid (`invalid_current_password`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The current session is not backed by an email/password credential (`password_credential_required`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The proposed address is malformed, unchanged, or unavailable (`email_change_unavailable`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: The configured email delivery channel is unavailable (`delivery_unavailable`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: confirmEmailChange
      tags: [Authentication]
      summary: Confirm and activate a replacement login email
      description: |
        Submit the exact proposed email and its six-digit code from the same
        brand-bound session that requested the change. On success D8N updates the
        existing identity identifier in place, marks the new email verified,
        preserves its password credential and the current session, consumes other
        outstanding challenges for that identifier, and revokes every other active
        session backed by the affected credential across brands. The old address
        remains active until this atomic confirmation succeeds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailChangeConfirmation"
      responses:
        "200":
          description: The verified replacement email is now the login identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailChangeResponse"
        "401":
          description: Session, proposed email, or code is unavailable, invalid, expired, consumed, locked, or belongs to another request (`invalid_code`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The proposed email became occupied before confirmation (`email_change_unavailable`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/password/recovery:
    post:
      operationId: requestPasswordRecovery
      tags: [Authentication]
      summary: Start signed-out password recovery
      description: |
        Step 1 of 3 of the signed-out "Forgot password?" flow. No bearer session is
        required. Submit the account identifier (phone or email); the server sends a
        single-use recovery code to that channel **only** when it maps to an eligible
        identity: an already-verified identifier that owns an active password
        credential and a membership in the resolved brand.

        This endpoint is deliberately account-enumeration resistant. It returns the
        **same** neutral `202` with the same body for every case — identifier
        unknown, unverified, without a password credential, not a member of this
        brand, suspended, closed/left, or rate-limited. It never returns `429`:
        throttling manifests as silent non-delivery so rate-limit behavior cannot be
        used to probe which identifiers exist. The recovery code expires in 10
        minutes. Only a `422 invalid_request` (identifier field absent) differs, and
        that reflects request shape, not account state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordRecoveryRequest"
      responses:
        "202":
          description: Request accepted. Identical regardless of whether an eligible account exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "422":
          description: The `identifier` field was missing (`invalid_request`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/password/recovery/verify:
    post:
      operationId: verifyPasswordRecovery
      tags: [Authentication]
      summary: Verify a recovery code and obtain a reset authorization
      description: |
        Step 2 of 3. Submit the identifier and the recovery code that was delivered.
        On success the server returns a single-use, short-lived (15 minute) reset
        authorization token used in step 3. The recovery code is consumed on success
        and is attempt-limited (locked after 5 wrong tries).

        Responses are generic: an unknown identifier, a missing/expired recovery
        code, and a wrong code all return the same `401 invalid_code`. A reset token
        is only ever returned to a caller that presents the code delivered to the
        identifier's own channel.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordRecoveryVerifyRequest"
      responses:
        "201":
          description: Recovery code accepted; a single-use reset authorization is issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetAuthorization"
        "401":
          description: The identifier/code pair is unknown, invalid, expired, consumed, or locked (`invalid_code`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/password/recovery/reset:
    post:
      operationId: resetPasswordWithRecovery
      tags: [Authentication]
      summary: Set a new password using a reset authorization
      description: |
        Step 3 of 3. Exchange the reset authorization token from step 2 for a new
        password. The new password must satisfy the same policy as registration and
        password change (≥ 6 characters, ≤ 72 UTF-8 bytes).

        On success the reset token is consumed (replay returns `401`) and **every
        active session issued from the affected password credential is revoked across
        all brands** — the D8N password is a platform-wide identity secret, so
        rotating it invalidates every brand-scoped session it backed. Recovery never
        changes brand-membership state: a suspended or `left`/closed membership stays
        as-is, so a successful reset does not by itself restore the ability to sign
        in to a brand the user was suspended from or has left.

        An invalid/mismatched/short password returns `422 invalid_password` and
        leaves the authorization usable for a retry. An unknown, expired, or already
        used token returns `401 invalid_or_expired_token`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "200":
          description: Password reset; affected sessions revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: The reset token is unknown, expired, or already used (`invalid_or_expired_token`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The new password is invalid, too short, or does not match its confirmation (`invalid_password`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/verification:
    post:
      operationId: requestIdentifierVerification
      tags: [Authentication]
      summary: Request a post-signup phone or email verification code
      description: |
        Requires a brand-bound bearer session. The code is sent only to an
        unverified identifier already owned by the current user. The generic
        success response does not reveal whether that identifier exists or is
        already verified, and requesting a code never creates account state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentifierVerificationRequest"
      responses:
        "202":
          description: Request accepted without disclosing identifier state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidInput"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: The configured delivery channel is temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: verifyIdentifier
      tags: [Authentication]
      summary: Verify the current user's phone or email identifier
      description: |
        Consumes a purpose-bound code and marks only the current user's matching
        identifier verified. This endpoint never issues a session or creates a
        user, credential, membership, or profile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentifierVerification"
      responses:
        "200":
          description: Identifier verified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentifierVerificationResponse"
        "401":
          description: Session or verification code is unavailable, invalid, expired, consumed, or locked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/session:
    delete:
      operationId: revokeSession
      tags: [Authentication]
      summary: Revoke the current session
      responses:
        "204":
          description: Session revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/me:
    get:
      operationId: getCurrentIdentity
      tags: [Authentication]
      summary: Confirm the authenticated identity, brand, and session
      responses:
        "200":
          description: Current authenticated context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: closeAccount
      tags: [Authentication]
      summary: Close the current user's account for this brand
      description: |
        Brand-level account closure (the user leaves this brand). Requires an
        explicit `confirmation: "close"` so it can never be triggered accidentally.
        Effects are immediate and one-way: the brand membership is tombstoned, the
        profile is discarded and anonymized, active matches end, and **every session
        for this brand is revoked** (including the caller's — a retry with the same
        token returns 401). Profile media is physically purged from object storage
        **asynchronously**; `media_purge_state` starts `pending`. The user's D8N
        network identity (credentials/identifiers) and other brands are untouched —
        platform-wide identity deletion is a separate future capability. Shared and
        safety records (conversations, messages, blocks, reports, enforcements,
        audit) are retained. Re-joining requires fresh registration; closure is not
        reversible through this API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloseAccountRequest"
      responses:
        "200":
          description: The account was closed (or was already closed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloseAccountResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No active membership for this brand (`account_unavailable`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Missing or wrong confirmation (`confirmation_required`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/profile/configuration:
    get:
      operationId: getProfileConfiguration
      tags: [Profile]
      summary: Get the resolved brand's onboarding and profile contract
      responses:
        "200":
          description: Brand-owned field/option configuration and current server-owned onboarding state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileConfigurationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/profile:
    get:
      operationId: getProfile
      tags: [Profile]
      summary: Get the current brand profile
      responses:
        "200":
          description: Current profile and resumable onboarding state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: updateProfile
      tags: [Profile]
      summary: Create or update the current brand profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Updated owner profile and resumable onboarding state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProfileOrMembershipRequired"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/profile/preferences:
    get:
      operationId: getProfilePreferences
      tags: [Profile]
      summary: Get the current brand preferences
      responses:
        "200":
          description: Current preferences or null.
          content:
            application/json:
              schema:
                type: object
                required: [preferences]
                properties:
                  preferences:
                    oneOf:
                      - $ref: "#/components/schemas/ProfilePreferences"
                      - type: "null"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: updateProfilePreferences
      tags: [Profile]
      summary: Create or update current brand preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfilePreferencesUpdate"
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Updated preferences.
          content:
            application/json:
              schema:
                type: object
                required: [preferences]
                properties:
                  preferences:
                    $ref: "#/components/schemas/ProfilePreferences"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProfileOrMembershipRequired"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/profile/options:
    patch:
      operationId: replaceProfileOptions
      tags: [Profile]
      summary: Replace selections for supplied controlled-option groups
      description: Omitted groups are unchanged. Supplied group arrays replace that group's active selections.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [selections]
              properties:
                selections:
                  type: object
                  additionalProperties:
                    type: array
                    items:
                      type: string
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Updated owner profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProfileOrMembershipRequired"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/profile/prompts:
    get:
      operationId: getProfilePrompts
      tags: [Profile]
      summary: The member's current prompt answers
      responses:
        "200":
          description: The member's answered prompts, ordered by position.
          content:
            application/json:
              schema:
                type: object
                required: [prompts]
                properties:
                  prompts:
                    type: array
                    items:
                      $ref: "#/components/schemas/PromptAnswer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProfileOrMembershipRequired"
    put:
      operationId: replaceProfilePrompts
      tags: [Profile]
      summary: Replace the member's prompt answers
      description: |
        Replaces the full ordered set of prompt answers. Array order becomes the
        display position. Unknown or duplicate prompt keys are rejected; at most
        five answers are allowed and each answer is length-limited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers:
                  type: array
                  maxItems: 5
                  items:
                    $ref: "#/components/schemas/PromptAnswerInput"
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Updated owner profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProfileOrMembershipRequired"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/profile/publication:
    post:
      operationId: activateProfile
      tags: [Profile]
      summary: Activate and publish a complete profile
      responses:
        "200":
          description: Activated owner profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProfileOrMembershipRequired"
        "422":
          description: Profile does not satisfy current brand completion requirements.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncompleteProfileError"
    delete:
      operationId: deactivateProfile
      tags: [Profile]
      summary: Hide and deactivate the current profile
      responses:
        "200":
          description: Deactivated owner profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProfileOrMembershipRequired"
  /api/v1/profile/location:
    put:
      operationId: replaceProfileLocation
      tags: [Profile]
      summary: Replace the current profile's private precise location
      description: Coordinates are accepted but never returned by this API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileLocationUpdate"
      responses:
        "200":
          description: Private location state without coordinates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileLocationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProfileOrMembershipRequired"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      operationId: deleteProfileLocation
      tags: [Profile]
      summary: Soft-delete the current profile's precise location
      responses:
        "200":
          description: Location is no longer configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileLocationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProfileOrMembershipRequired"
  /api/v1/profile/photos:
    get:
      operationId: listProfilePhotos
      tags: [Profile]
      summary: List the current profile's photos
      description: |
        Each attached image carries a short-lived signed retrieval `url` (direct
        from private R2) plus its `url_expires_in` seconds. Refetch to renew.
      responses:
        "200":
          description: Owner photo library.
          content:
            application/json:
              schema:
                type: object
                required: [photos]
                properties:
                  photos:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProfilePhoto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createProfilePhoto
      tags: [Profile]
      summary: Attach a completed direct upload to the profile
      description: |
        Second step of the direct-to-R2 upload. Submit the `signed_id` returned by
        `POST /api/v1/profile/photos/uploads` after the bytes have been `PUT` to the
        presigned URL. D8N confirms the object exists in private R2, verifies its
        real file signature and size (the declared MIME is only a hint), and
        attaches it to the authenticated owner's profile. New photos begin
        `pending_review`; initial visibility follows the brand policy (HookUs:
        `visible` immediately with asynchronous moderation; other brands: `hidden`
        until moderated). A `signed_id` may be attached only once. The upload is
        then processed asynchronously into a safe, EXIF-stripped display
        derivative (`processing_state`); other users only ever see that
        derivative, and only once it is `ready`. Until then the photo is not
        exposed in discovery/matches even if visible.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signed_id]
              properties:
                signed_id:
                  type: string
                  description: Opaque signed id from the upload-intent response.
                position:
                  type: integer
                  minimum: 0
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "201":
          description: Photo accepted for processing/review.
          content:
            application/json:
              schema:
                type: object
                required: [photo]
                properties:
                  photo:
                    $ref: "#/components/schemas/ProfilePhoto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProfileOrMembershipRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/profile/photos/uploads:
    post:
      operationId: createProfilePhotoUpload
      tags: [Profile]
      summary: Request a direct-to-R2 photo upload authorization
      description: |
        First step of the direct-to-R2 upload (control plane). Declare the file's
        `content_type`, `byte_size`, and base64 MD5 `checksum`. D8N authorizes the
        caller, validates the declared media, allocates the object identity, and
        returns a short-lived presigned `PUT` `url` plus the exact `headers` to send
        with it. Upload the bytes directly to that URL, then attach the returned
        `signed_id` via `POST /api/v1/profile/photos`. D8N chooses the object key;
        the client never receives R2 credentials.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content_type, byte_size, checksum]
              properties:
                content_type:
                  type: string
                  enum: [image/jpeg, image/png, image/webp]
                byte_size:
                  type: integer
                  minimum: 1
                  description: Exact byte size of the file to upload (max 10 MB).
                checksum:
                  type: string
                  description: Base64-encoded MD5 digest of the file bytes.
                filename:
                  type: string
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "201":
          description: Short-lived upload authorization.
          content:
            application/json:
              schema:
                type: object
                required: [upload]
                properties:
                  upload:
                    $ref: "#/components/schemas/ProfilePhotoUpload"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProfileOrMembershipRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/profile/photos/{id}:
    delete:
      operationId: deleteProfilePhoto
      tags: [Profile]
      summary: Soft-delete a profile photo
      parameters:
        - $ref: "#/components/parameters/PhotoId"
      responses:
        "200":
          description: Soft-deleted owner photo record.
          content:
            application/json:
              schema:
                type: object
                required: [photo]
                properties:
                  photo:
                    $ref: "#/components/schemas/ProfilePhoto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/discovery:
    get:
      operationId: getDiscovery
      tags: [Matching]
      summary: Get a page of eligible public profiles for the selected mode
      description: |
        `mode` selects the discovery feed. All modes apply the **same**
        eligibility rules (brand isolation, active/visible profiles,
        current-user exclusion, reciprocal age/gender/preference, distance,
        blocking/exclusions) — they differ only in ordering:
          * `for_you` (default) — the compatibility-ranked HookUs feed.
          * `new_here` — the newest eligible profiles first, deterministic on
            recency; the compatibility payload is still included.
        A request without `mode` behaves exactly as before (`for_you`).

        `vibe` and `online` are optional facet filters, orthogonal to `mode` and
        to each other; they narrow the feed without relaxing eligibility and
        combine freely (e.g. `?mode=new_here&vibe=420_friendly&online=true`):
          * `vibe` — profiles that publicly selected that "vibes" option. An
            unknown vibe yields `invalid_filter`.
          * `online=true` — profiles whose user has been active within the last
            10 minutes (session activity), i.e. "online now".

        The returned `next_cursor` encodes the mode and every active facet, so a
        later page cannot switch strategy or silently drop/change a filter:
        replaying a cursor under a different mode/vibe/online yields
        `invalid_cursor`. An unknown mode yields `invalid_mode`.

        Each profile includes `photos`: safe, EXIF-stripped display derivatives
        with short-lived signed URLs. Raw originals are never exposed.
      parameters:
        - $ref: "#/components/parameters/DiscoveryMode"
        - $ref: "#/components/parameters/DiscoveryVibe"
        - $ref: "#/components/parameters/DiscoveryOnline"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Strategy-ranked profiles and an opaque next cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Current profile is not active and discoverable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Production matching is not configured for this brand.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/InvalidInput"
  /api/v1/find:
    get:
      operationId: getFindProfiles
      tags: [Matching]
      summary: Explore DateZA-eligible profiles under the daily unique-exposure allowance
      description: |
        DateZA Find returns deterministic newest-first pages from the shared D8N
        eligibility scope. For a free member, at most 10 unique candidate profiles
        may be surfaced during one Africa/Johannesburg calendar day. Replaying a
        page or seeing a previously exposed candidate does not consume allowance
        again. Detail, Like, and Pass operations do not consume Find allowance.
        An otherwise eligible DateZA member may use Find while the identifier
        attached to the current login session is unverified; verification is
        required only when they proceed to an interaction surface.

        Every returned profile has `compatibility`: a deterministic DateZA v1
        score, confidence and bounded reason codes when at least 35% of weighted
        dimensions are comparable, otherwise null. Compatibility is computed
        after eligibility and exposure allocation and does not consume allowance.

        The cursor is opaque, signed, and bound to the resolved brand, current
        membership, DateZA Find policy version, and exact filter set. Filters only
        narrow the member's stored reciprocal age/gender/distance eligibility.
        DateZA Discovery is a separate, unimplemented product surface.
      parameters:
        - $ref: "#/components/parameters/FindCursor"
        - $ref: "#/components/parameters/FindLimit"
        - $ref: "#/components/parameters/FindMinAge"
        - $ref: "#/components/parameters/FindMaxAge"
        - $ref: "#/components/parameters/FindMaxDistance"
        - $ref: "#/components/parameters/FindRelationshipIntent"
      responses:
        "200":
          description: Eligible safe public profiles and authoritative daily allowance state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Current profile is not active and discoverable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Find is not configured for the resolved brand (`find_not_configured`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/InvalidInput"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/profiles/{profile_id}:
    get:
      operationId: getPublicProfile
      tags: [Matching]
      summary: Get one member's safe public profile by its public UUID
      description: |
        Authoritative, refreshable detail for a single profile, resolved from the
        stable public UUID surfaced by discovery (`profiles[].id`). This is the
        source of truth for a profile page: a browser refresh, a new tab, or a
        deep link all resolve independently — no client-side cache is required
        for correctness.

        Requires an authenticated member with an active, discoverable profile.
        "Public" means *safe information visible to another eligible authenticated
        member* — it is NOT unauthenticated web-public data.

        The response is the same safe public profile shape as discovery, minus the
        ranking-only `compatibility` payload. `photos` are safe, EXIF-stripped
        display derivatives with short-lived signed URLs, in deterministic
        position order; raw originals and storage keys are never exposed.

        Availability enforces the SAME fundamental safety rules as discovery —
        brand isolation, active/visible lifecycle, suspension, account closure,
        soft-deletion, and blocking in either direction — but deliberately does
        NOT reapply reciprocal age/gender/distance, so a profile reachable from
        discovery keeps resolving even after ranking or dating preferences change.
        Every unavailable case (unknown, cross-brand, hidden, inactive, suspended,
        closed, discarded, or blocked either way) returns the same neutral
        `profile_unavailable` (404) and never reveals why.
      parameters:
        - $ref: "#/components/parameters/PublicProfileId"
      responses:
        "200":
          description: The target member's safe public profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InteractionForbidden"
        "404":
          description: |
            Target is unavailable. Unknown, cross-brand, hidden, inactive,
            suspended, closed, discarded, and blocked targets all share the
            neutral `profile_unavailable` response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/profiles/{profile_id}/likes:
    post:
      operationId: likeProfile
      tags: [Matching]
      summary: Idempotently like an eligible public profile
      parameters:
        - $ref: "#/components/parameters/PublicProfileId"
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Existing like returned idempotently.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LikeResponse"
        "201":
          description: Like created; a mutual like may also create a match.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LikeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InteractionForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/InteractionConflict"
  /api/v1/profiles/{profile_id}/pass:
    post:
      operationId: passProfile
      tags: [Matching]
      summary: Idempotently pass on an eligible public profile
      parameters:
        - $ref: "#/components/parameters/PublicProfileId"
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Existing pass returned idempotently.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PassResponse"
        "201":
          description: Pass created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PassResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InteractionForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/InteractionConflict"
  /api/v1/profiles/{profile_id}/hook:
    post:
      operationId: sendHook
      tags: [Hooks]
      summary: Send a 🔥 Hook (one opener) to an eligible profile
      description: |
        Creates the sender's single unsolicited opener to a recipient. The body is
        the FINAL text the sender chose — the default copy is a frontend concern
        and receiving it means nothing special. No Match/Conversation/Message is
        created yet: the opener is held on the Hook, and the sender is locked out
        from any further message until the recipient replies (there is literally no
        conversation to message through, and a second Hook to the same person is
        rejected).

        Reachability matches Like exactly: blocked (either direction), suspended,
        closed, hidden, cross-brand, self, and otherwise-ineligible targets all
        fail closed as `profile_unavailable` (404), never revealing which.

        V1 anti-spam: exactly one Hook per (sender → recipient) pair, ever — a
        second attempt (including after decline/expiry) returns `already_hooked`
        (409). Sending is also bounded by a per-sender daily allowance
        (`hook_rate_limited`, 429, with `Retry-After`).
      parameters:
        - $ref: "#/components/parameters/PublicProfileId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendHookRequest"
      responses:
        "201":
          description: The Hook was created and is pending the recipient's reply.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendHookResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: >-
            Hook is not configured for the resolved brand
            (`hook_not_configured`), or the target profile is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: |
            Interaction conflict: `already_hooked` (already used your one Hook to
            this person), `already_matched`, `already_liked`, or `incoming_hook`
            (they Hooked you — reply from your inbox instead).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Blank (`message_blank`) or oversized (`message_too_long`) opener.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: The sender's daily Hook allowance is exhausted (`hook_rate_limited`).
          headers:
            Retry-After:
              description: Seconds until the sender may Hook again.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/hooks:
    get:
      operationId: listReceivedHooks
      tags: [Hooks]
      summary: List Hooks received and awaiting the current member's reply
      description: |
        The recipient inbox: live (pending, unexpired) Hooks addressed to the
        current member, newest-first and cursor-paginated. Each entry carries the
        opener text and the sender's safe public profile. Hooks are private — only
        the recipient sees them; a sender never sees their own sent Hooks here.
        Senders who became unavailable (blocked, suspended, closed) silently drop
        off without disclosure.
      parameters:
        - $ref: "#/components/parameters/HookLimit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of live received Hooks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HookInboxResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProfileOrMembershipRequired"
        "404":
          $ref: "#/components/responses/HookNotConfigured"
        "422":
          description: Invalid `limit` (`invalid_limit`) or `cursor` (`invalid_cursor`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/hooks/{hook_id}/reply:
    post:
      operationId: replyToHook
      tags: [Hooks]
      summary: Reply to a Hook — accepts it and unlocks a conversation
      description: |
        The recipient's first reply. There is no separate accept step: replying IS
        acceptance. Atomically creates the canonical Match + Conversation,
        materializes the sender's opener as the first message and this text as the
        second, and returns the unlocked conversation. All further messages flow
        through the standard `POST /conversations/{conversation_id}/messages`.

        A Hook that is not live for this member — already accepted/declined,
        expired, blocked either way, or not addressed to the caller — returns the
        neutral `hook_unavailable` (404), never revealing which.
      parameters:
        - $ref: "#/components/parameters/HookId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HookReplyRequest"
      responses:
        "201":
          description: The Hook was accepted; the conversation is unlocked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HookReplyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: >-
            Hook is not configured for the resolved brand
            (`hook_not_configured`), or the Hook is not live for this member
            (`hook_unavailable`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Blank (`message_blank`) or oversized (`message_too_long`) reply.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/hooks/{hook_id}/decline:
    post:
      operationId: declineHook
      tags: [Hooks]
      summary: Decline a pending Hook
      description: |
        The recipient declines. Terminal and private: the sender is never told a
        decline happened (their `hook_state` simply collapses to `unavailable`,
        indistinguishable from being ignored-then-expired or blocked). A Hook that
        is not live for this member returns the neutral `hook_unavailable` (404).
      parameters:
        - $ref: "#/components/parameters/HookId"
      responses:
        "204":
          description: The Hook was declined; nothing is disclosed to the sender.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: >-
            Hook is not configured for the resolved brand
            (`hook_not_configured`), or the Hook is not live for this member
            (`hook_unavailable`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/hook_tonight:
    get:
      operationId: getHookTonight
      tags: [Hook Tonight]
      summary: Get the current member's Hook Tonight availability
      description: |
        Authoritative current availability, computed against the clock: a lapsed
        or deactivated activation reports `active: false`. Drives the CTA state
        ("🔥 Hook Tonight" when inactive, "🔥 You're available tonight" with the
        expiry when active).
      responses:
        "200":
          description: The current availability state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HookTonightState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/HookTonightNotConfigured"
    post:
      operationId: activateHookTonight
      tags: [Hook Tonight]
      summary: Activate (or refresh) Hook Tonight availability
      description: |
        Turns Hook Tonight on for the current member and (re)stamps the expiry,
        surfacing them in the Hook Tonight discovery pool. Idempotent: re-posting
        while active simply refreshes the same single state row (no history is
        accumulated, safe under concurrent calls). Requires an active, discoverable
        member — a suspended, closed, or incomplete profile is rejected with
        `discoverable_profile_required`. A Hook Tonight activation grants NO extra
        Hook allowance; approaching someone still spends a normal 🔥 Hook.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HookTonightActivateRequest"
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "201":
          description: Hook Tonight is active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HookTonightState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The member is not active and discoverable (`discoverable_profile_required`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/HookTonightNotConfigured"
        "422":
          description: The requested `intent` is not supported (`invalid_intent`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deactivateHookTonight
      tags: [Hook Tonight]
      summary: Deactivate Hook Tonight availability
      description: |
        Turns Hook Tonight off; the member immediately leaves the pool. The normal
        profile, existing Hooks, matches, and conversations are untouched.
        Idempotent — deactivating when already off is a safe no-op.
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "204":
          description: Hook Tonight is off (or was already off).
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/hook_tonight/discovery:
    get:
      operationId: getHookTonightDiscovery
      tags: [Hook Tonight]
      summary: Get a page of members who are available tonight
      description: |
        The exact same eligible, ranked discovery population as `GET
        /api/v1/discovery` — identical brand isolation, active/visible lifecycle,
        blocking (either direction), reciprocal age/gender/preference, distance,
        exclusions (including live Hooks), facet filters, safe photos, and
        pagination — narrowed to members who currently have a live Hook Tonight
        availability. Each profile carries the same viewer-relative `hook_state`,
        so the client renders the correct 🔥 Hook action; approaching still goes
        through the existing Hook endpoints. `mode`, `vibe`, `online`, `cursor`,
        and `limit` behave exactly as on `GET /api/v1/discovery`.

        Access is **reciprocal**: the viewer must have a live Hook Tonight
        activation to see the pool (to browse who's available tonight you must be
        available tonight). A viewer without one gets 403 `hook_tonight_required`;
        activate via `POST /api/v1/hook_tonight` first. Normal discovery
        (`GET /api/v1/discovery`) is unaffected and open to any eligible member.
      parameters:
        - $ref: "#/components/parameters/DiscoveryMode"
        - $ref: "#/components/parameters/DiscoveryVibe"
        - $ref: "#/components/parameters/DiscoveryOnline"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Available-tonight profiles and an opaque next cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            The viewer is not active and discoverable
            (`discoverable_profile_required`), or has no live Hook Tonight
            activation (`hook_tonight_required`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/HookTonightNotConfigured"
        "422":
          $ref: "#/components/responses/InvalidInput"
  /api/v1/blocks:
    get:
      operationId: listBlockedProfiles
      tags: [Trust]
      summary: List the profiles the current member has blocked
      description: |
        Returns only outgoing blocks (blocker is the current member), newest
        first, for the Settings / Safety "Blocked users" surface. Blocks whose
        target account was since removed are omitted. Each entry exposes the
        minimum profile information needed to recognise and unblock the target.
      responses:
        "200":
          description: The current member's blocked profiles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockedProfilesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProfileOrMembershipRequired"
  /api/v1/profiles/{profile_id}/block:
    post:
      operationId: blockProfile
      tags: [Trust]
      summary: Idempotently block a current-brand profile
      description: |
        Blocking applies in either direction for discovery, interactions, match lists,
        and conversation access. It removes existing likes and ends an active match.
      parameters:
        - $ref: "#/components/parameters/PublicProfileId"
      responses:
        "200":
          description: The directional block already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockResponse"
        "201":
          description: The directional block was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProfileOrMembershipRequired"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: unblockProfile
      tags: [Trust]
      summary: Idempotently remove the current profile's directional block
      description: |
        Unknown, cross-brand, self, and soft-deleted targets receive the same no-content
        response. Unblocking does not restore likes or reactivate an ended match.
      parameters:
        - $ref: "#/components/parameters/PublicProfileId"
      responses:
        "204":
          description: The request completed without disclosing target or block state.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProfileOrMembershipRequired"
  /api/v1/reports:
    post:
      operationId: fileReport
      tags: [Trust]
      summary: File a safety report against a profile or a specific piece of content
      description: |
        Content-level reporting foundation. The reporter is always the
        authenticated current-brand member (never the body); the target is
        identified by an opaque public id and the responsible profile is derived
        server-side from it. Supported targets: a `profile`, a chat `message`
        (reportable by a conversation participant, and still reportable after the
        sender is blocked/suspended/closed), a `profile_media` photo (reportable
        while the owner is visible to the viewer), and a `hook` opener (reportable
        by its recipient).

        Idempotent per open (reporter, target): a repeat returns `created: false`.
        Distinct content from the same person can each be reported. Unknown,
        inaccessible, and cross-brand targets all share the neutral
        `target_unavailable` (404) response so nothing is enumerable. The response
        reveals only that the report was received.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileReportRequest"
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: An open report from this reporter against this target already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileReportResponse"
        "201":
          description: The report was filed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileReportResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProfileOrMembershipRequired"
        "404":
          description: |
            The target is unknown, inaccessible to the reporter, or belongs to
            another brand — returned neutrally as `target_unavailable`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: |
            Malformed input — an unknown `reason` (`invalid_reason`) or unknown
            `target_type` (`invalid_target_type`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/profiles/{profile_id}/report:
    post:
      operationId: reportProfile
      tags: [Trust]
      summary: File a safety report against a current-brand profile
      description: |
        Reporting is independent of blocking and does not change the target's
        visibility, moderation status, or photo processing — it records an audit
        signal for administrative review. It is idempotent per open report: while
        an earlier report from the same reporter against the same target is still
        open, repeat submissions return `created: false` and do not stack.
        Unknown, cross-brand, and self targets share the `profile_unavailable`
        (404) response so target existence is never disclosed.
      parameters:
        - $ref: "#/components/parameters/PublicProfileId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportRequest"
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: An open report from this reporter against this target already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResponse"
        "201":
          description: The report was filed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProfileOrMembershipRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/matches:
    get:
      operationId: listMatches
      tags: [Matching]
      summary: List current live matches
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Live matches and an opaque next cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InteractionForbidden"
        "422":
          $ref: "#/components/responses/InvalidInput"
  /api/v1/conversations:
    get:
      operationId: listConversations
      tags: [Messaging]
      summary: List conversations for the current brand profile
      description: |
        Participant-scoped conversation cards, newest-first, each with a preview of
        its latest message (or null). Read the full history via the per-conversation
        messages endpoint.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Participant-scoped conversations and an opaque next cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InteractionForbidden"
        "422":
          $ref: "#/components/responses/InvalidInput"
  /api/v1/matches/{match_id}/conversation:
    post:
      operationId: startConversation
      tags: [Messaging]
      summary: Idempotently open the conversation for a live match
      parameters:
        - $ref: "#/components/parameters/PublicMatchId"
      responses:
        "200":
          description: Existing conversation returned idempotently.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartConversationResponse"
        "201":
          description: Conversation and both profile participants created atomically.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartConversationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InteractionForbidden"
        "404":
          description: Match is unavailable, cross-brand, or does not include the current profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/conversations/{conversation_id}/messages:
    get:
      operationId: listMessages
      tags: [Messaging]
      summary: List a conversation's messages, newest first
      description: |
        Participant-scoped, cursor-paginated plain-text message history for one
        conversation, ordered newest-first by (created_at, id). Only the two
        conversation participants may read. Unknown, cross-brand, non-participant,
        ended, unavailable (suspended/deleted participant), and blocked
        conversations all return the same neutral 404 `conversation_unavailable`;
        the block is never disclosed. History is always bounded by `limit`; page
        backward into older messages with `next_cursor`. A message cursor is bound
        to its brand, viewer, and conversation and cannot be replayed elsewhere.
      parameters:
        - $ref: "#/components/parameters/PublicConversationId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/MessageLimit"
      responses:
        "200":
          description: A page of messages, newest first, and an opaque next cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InteractionForbidden"
        "404":
          description: Conversation is unavailable, cross-brand, ended, blocked, or not the current profile's.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/InvalidInput"
    post:
      operationId: sendMessage
      tags: [Messaging]
      summary: Send a plain-text message to a conversation
      description: |
        Appends one plain-text message after re-authorizing the sender
        (participant, active match, both participants available, neither side
        blocking the other). The body is treated as untrusted input, NFC-normalized,
        and must be non-blank and at most 2000 characters; Unicode/emoji is
        preserved. Content never enters logs. Beta accepts at-least-once client
        sends (no idempotency key), so a retried request creates a second message.
      parameters:
        - $ref: "#/components/parameters/PublicConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "201":
          description: The message was persisted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendMessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InteractionForbidden"
        "404":
          description: Conversation is unavailable, cross-brand, ended, blocked, or not the current profile's.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Body is blank (`message_blank`) or too long (`message_too_long`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/notifications:
    get:
      operationId: listNotifications
      tags: [Notifications]
      summary: List the current member's brand-scoped product notifications
      description: |
        Returns at most 50 newest-first notifications for the authenticated user
        and active membership in the host-resolved brand. The same D8N identity's
        notifications in another brand are never returned. Presentation-safe copy
        is derived from the stable notification type; provider, recipient, device,
        delivery-attempt, and internal database fields are never exposed.
      responses:
        "200":
          description: The current brand inbox and unread count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/notifications/read_all:
    post:
      operationId: markAllNotificationsRead
      tags: [Notifications]
      summary: Mark every current-brand notification read
      responses:
        "200":
          description: Number of notifications newly marked read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarkAllNotificationsReadResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [Notifications]
      summary: Mark one current-brand notification read
      description: Unknown and cross-brand notification ids return the same neutral 404.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The notification with its read timestamp.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Notification is unknown or belongs to another brand/member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/reports:
    get:
      operationId: listReports
      tags: [Admin]
      summary: List the moderation queue for the current brand
      description: |
        Authorized-moderator only. Returns reports for the request's brand
        (resolved from the host — a brand id is never accepted from the client),
        oldest-first by (created_at, id) so the longest-waiting reports surface
        first, cursor-paginated and bounded. Access requires an active AdminUser
        with an active assignment for this brand: unauthenticated callers get 401,
        ordinary users and admins assigned elsewhere get 403. Cross-brand reports
        are simply absent, never disclosed.
      parameters:
        - $ref: "#/components/parameters/ReportStatusFilter"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/AdminReportLimit"
      responses:
        "200":
          description: A page of reports and an opaque next cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminReportListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "422":
          $ref: "#/components/responses/InvalidInput"
  /api/v1/admin/reports/{id}:
    get:
      operationId: getReport
      tags: [Admin]
      summary: Inspect one report
      description: |
        Authorized-moderator only. The read is audited (a sensitive-read
        SecurityEvent is recorded). Unknown and cross-brand ids share the neutral
        `report_unavailable` (404). Only moderator-relevant fields are returned;
        no credentials, sessions, email/phone, private location, or media.
      parameters:
        - $ref: "#/components/parameters/ReportId"
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminReportResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "404":
          description: Report is unknown or belongs to another brand.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateReport
      tags: [Admin]
      summary: Apply a moderation lifecycle transition
      description: |
        Authorized-moderator only. Applies one lifecycle transition and records the
        decision (audited; `reviewed_by`/`reviewed_at`/`resolution_note` set). Only
        `status` and an optional short `note` are accepted; report internals
        (reporter, target, brand, reason, timestamps) can never be mass-assigned.
        Transitions: `open → reviewing | dismissed`, `reviewing → actioned |
        dismissed | open`. `actioned`/`dismissed` are terminal. `actioned` means
        "resolved as warranting action" — it does NOT suspend or ban the account;
        account enforcement is a separate capability (TS-04). A disallowed target
        from a non-terminal state is `invalid_transition` (422); a transition out of
        a terminal state (e.g. another moderator already resolved it) is
        `report_conflict` (409).
      parameters:
        - $ref: "#/components/parameters/ReportId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReportRequest"
      responses:
        "200":
          description: The updated report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminReportResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "404":
          description: Report is unknown or belongs to another brand.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The report is already in a terminal state (`report_conflict`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Invalid `status`, `invalid_transition`, or an oversized `note`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/profiles/{profile_id}/suspension:
    post:
      operationId: suspendProfile
      tags: [Admin]
      summary: Apply a brand-level suspension to a profile's owner
      description: |
        Authorized-moderator only. Brand-level enforcement: suspends the target's
        membership in this brand, revokes all of their sessions for this brand, and
        records an audited, reversible `AccountEnforcement`. Everything happens in
        one transaction. The target's network identity and any other-brand access
        are untouched (platform-wide bans are not modelled yet). Enforcement is
        deliberately separate from the report lifecycle: an optional `report_id`
        links the cause without changing that report's status. Idempotent-by-
        conflict: a second suspension of an already-suspended user returns 409
        `already_suspended`. Cross-brand/unknown targets return neutral
        `profile_unavailable` (404).
      parameters:
        - $ref: "#/components/parameters/PublicProfileId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuspendProfileRequest"
      responses:
        "201":
          description: The suspension was applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEnforcementResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "404":
          description: Target is unknown or belongs to another brand (`profile_unavailable`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The target is already suspended (`already_suspended`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: An unknown `report_id` (`invalid_report`) or an oversized `reason`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: reinstateProfile
      tags: [Admin]
      summary: Lift a brand-level suspension
      description: |
        Authorized-moderator only. Reactivates the membership and marks the
        enforcement reverted, audited, in one transaction. Restores ONLY what
        suspension changed — it does not revive revoked sessions (the user logs in
        again), ended matches, blocks, or deleted data. Reinstating a profile that
        is not suspended returns 409 `not_suspended`.
      parameters:
        - $ref: "#/components/parameters/PublicProfileId"
      responses:
        "200":
          description: The suspension was lifted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEnforcementResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "404":
          description: Target is unknown or belongs to another brand (`profile_unavailable`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The target is not currently suspended (`not_suspended`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Opaque brand-bound D8N session token.
  parameters:
    DiscoveryMode:
      name: mode
      in: query
      required: false
      description: |
        Discovery feed selector. Omitted or `for_you` returns the default
        compatibility-ranked feed; `new_here` returns the newest eligible
        profiles first. Eligibility is identical across modes. An unsupported
        value returns 422 `invalid_mode`.
      schema:
        type: string
        enum: [for_you, new_here]
        default: for_you
    DiscoveryVibe:
      name: vibe
      in: query
      required: false
      description: |
        Optional facet filter: a public "vibes" option code (e.g.
        `420_friendly`). Narrows the feed to profiles that selected it, on top of
        the normal eligibility rules, and combines with any `mode`. An
        unsupported value returns 422 `invalid_filter`.
      schema:
        type: string
    DiscoveryOnline:
      name: online
      in: query
      required: false
      description: |
        Optional "online now" facet. When `true`, narrows the feed to profiles
        whose user has been active in the last 10 minutes. Combines with `mode`
        and `vibe`.
      schema:
        type: boolean
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque signed cursor returned by the same endpoint and brand.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    FindCursor:
      name: cursor
      in: query
      required: false
      description: Opaque signed cursor bound to the brand, membership, policy, and filters.
      schema:
        type: string
    FindLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 10
        default: 10
    FindMinAge:
      name: min_age
      in: query
      required: false
      schema:
        type: integer
        minimum: 18
        maximum: 120
    FindMaxAge:
      name: max_age
      in: query
      required: false
      schema:
        type: integer
        minimum: 18
        maximum: 120
    FindMaxDistance:
      name: max_distance_km
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
    FindRelationshipIntent:
      name: relationship_intent
      in: query
      required: false
      description: Active DateZA relationship-intent option code; narrows eligible candidates.
      schema:
        type: string
    PublicProfileId:
      name: profile_id
      in: path
      required: true
      description: Stable public profile UUID from discovery.
      schema:
        type: string
        format: uuid
    PhotoId:
      name: id
      in: path
      required: true
      description: Owner photo record ID.
      schema:
        type: integer
    PublicMatchId:
      name: match_id
      in: path
      required: true
      description: Stable public match UUID from the match list.
      schema:
        type: string
        format: uuid
    PublicConversationId:
      name: conversation_id
      in: path
      required: true
      description: Stable public conversation UUID from the conversation list or start-conversation response.
      schema:
        type: string
        format: uuid
    MessageLimit:
      name: limit
      in: query
      required: false
      description: Page size for message history.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 30
    HookId:
      name: hook_id
      in: path
      required: true
      description: Stable public Hook UUID from the received-Hooks inbox.
      schema:
        type: string
        format: uuid
    HookLimit:
      name: limit
      in: query
      required: false
      description: Page size for the received-Hooks inbox.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    ReportId:
      name: id
      in: path
      required: true
      description: Internal report id (admin-only; scoped to the moderator's brand).
      schema:
        type: integer
    ReportStatusFilter:
      name: status
      in: query
      required: false
      description: Narrow the queue to one lifecycle status. Unknown values return 422 `invalid_filter`.
      schema:
        type: string
        enum: [open, reviewing, actioned, dismissed]
    AdminReportLimit:
      name: limit
      in: query
      required: false
      description: Page size for the moderation queue.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  responses:
    Unauthorized:
      description: Missing, invalid, expired, revoked, or wrong-brand bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InteractionForbidden:
      description: >-
        For a published DateZA member, the identifier attached to the current
        login session has not been verified (`identifier_verification_required`).
        Existing profile, membership, and lifecycle authorization errors remain
        distinct. This DateZA-only rule does not change HookUs authorization.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    HookNotConfigured:
      description: Hook is not enabled for the resolved brand (`hook_not_configured`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    HookTonightNotConfigured:
      description: >-
        Hook Tonight is not enabled for the resolved brand
        (`hook_tonight_not_configured`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AdminForbidden:
      description: Authenticated, but not an authorized moderator for this brand (`forbidden`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BrandRequired:
      description: Request host did not resolve to an active brand.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AuthMethodUnavailable:
      description: Request host did not resolve to an active brand, or this authentication method is disabled.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: >-
        Rate limit exceeded (`rate_limited`). Returned by authentication throttles
        and by the generic abuse-protection layer on write/read surfaces
        (messaging, likes, passes, reports, media uploads, profile writes,
        discovery, Hook Tonight). The 🔥 Hook send endpoint has its own distinct
        product limit (`hook_rate_limited`) and is documented separately.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds before another request should be attempted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ProfileOrMembershipRequired:
      description: Required brand membership/profile/lifecycle state is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InvalidInput:
      description: Request input, cursor, or limit is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationFailed:
      description: Validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"
    NotFound:
      description: Resource is unavailable, including cross-brand resources.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InteractionConflict:
      description: Interaction conflicts with the current participant state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthResponse:
      type: object
      required: [status, app, api_version, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        app:
          const: d8n
        api_version:
          const: v1
        checks:
          type: object
          required: [primary_database, queue_database]
          properties:
            primary_database:
              type: string
              enum: [ok, unavailable]
            queue_database:
              type: string
              enum: [ok, unavailable]
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    ValidationError:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          required: [details]
          properties:
            details:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
    BrandSummary:
      type: object
      required: [slug, name]
      properties:
        slug:
          type: string
        name:
          type: string
    AuthMethodsResponse:
      type: object
      required: [brand, methods]
      properties:
        brand:
          $ref: "#/components/schemas/BrandSummary"
        methods:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [phone_password, email_password, google]
    IdentifierVerificationRequest:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [phone, email]
    PasswordAuthRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          description: International phone number or email address; normalized by the server.
        password:
          type: string
          format: password
          minLength: 6
          description: At least 6 characters and no more than 72 UTF-8 bytes.
        device_name:
          type: [string, "null"]
          maxLength: 120
    PasswordChangeRequest:
      type: object
      required: [current_password, password, password_confirmation]
      properties:
        current_password:
          type: string
          format: password
        password:
          type: string
          format: password
          minLength: 6
          description: At least 6 characters, no more than 72 UTF-8 bytes, and different from the current password.
        password_confirmation:
          type: string
          format: password
    EmailChangeRequest:
      type: object
      required: [email, current_password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Proposed replacement login email. It is not activated until code confirmation.
        current_password:
          type: string
          format: password
          description: Current password for the email-backed credential used by this session.
    EmailChangeConfirmation:
      type: object
      required: [email, code]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: The same proposed email supplied to the request step.
        code:
          type: string
          pattern: "^[0-9]{6}$"
          description: Single-use code delivered to the proposed email; expires after 10 minutes.
    EmailChangeResponse:
      type: object
      required: [identifier, revoked_session_count]
      properties:
        identifier:
          type: object
          required: [kind, verified]
          properties:
            kind:
              const: email
            verified:
              const: true
        revoked_session_count:
          type: integer
          minimum: 0
          description: Other active sessions revoked because the login identifier changed.
    PasswordRecoveryRequest:
      type: object
      required: [identifier]
      properties:
        identifier:
          type: string
          description: International phone number or email address; normalized by the server.
    PasswordRecoveryVerifyRequest:
      type: object
      required: [identifier, code]
      properties:
        identifier:
          type: string
          description: The same identifier used to request recovery.
        code:
          type: string
          pattern: "^[0-9]{6}$"
          description: The recovery code delivered to the identifier's channel.
    PasswordResetAuthorization:
      type: object
      required: [reset_token, expires_at]
      properties:
        reset_token:
          type: string
          description: Single-use secret authorizing one password reset. Send it only to the reset endpoint.
        expires_at:
          type: string
          format: date-time
          description: When the reset authorization expires (15 minutes after issue).
    PasswordResetRequest:
      type: object
      required: [reset_token, password, password_confirmation]
      properties:
        reset_token:
          type: string
          description: The reset authorization token returned by the verify step.
        password:
          type: string
          format: password
          minLength: 6
          description: At least 6 characters and no more than 72 UTF-8 bytes.
        password_confirmation:
          type: string
          format: password
    IdentifierVerification:
      type: object
      required: [kind, code]
      properties:
        kind:
          type: string
          enum: [phone, email]
        code:
          type: string
          pattern: "^[0-9]{6}$"
    IdentifierVerificationResponse:
      type: object
      required: [identifier]
      properties:
        identifier:
          type: object
          required: [kind, verified]
          properties:
            kind:
              type: string
              enum: [phone, email]
            verified:
              const: true
    AuthSessionResponse:
      type: object
      required: [token, token_type, expires_at, user_id, brand]
      properties:
        token:
          type: string
          description: Secret bearer token returned only when the session is issued.
        token_type:
          const: Bearer
        expires_at:
          type: string
          format: date-time
        user_id:
          type: integer
          description: Private platform identity ID; do not use as a public dating-profile ID.
        brand:
          $ref: "#/components/schemas/BrandSummary"
    PasswordAuthSessionResponse:
      allOf:
        - $ref: "#/components/schemas/AuthSessionResponse"
        - type: object
          required: [identifier, verification_required, onboarding]
          properties:
            identifier:
              type: object
              required: [kind, verified]
              properties:
                kind:
                  type: string
                  enum: [phone, email]
                verified:
                  type: boolean
                  description: False until D8N separately proves control of the phone or email.
            verification_required:
              type: boolean
              description: |
                True whenever the session's identifier is still unverified. On
                register the server has asynchronously dispatched a verification
                code to `verification_channel`; on login of an unverified
                identifier this stays true (request a fresh code via
                `POST /auth/verification`). Login never re-sends a code by itself.
            verification_channel:
              type: [string, "null"]
              enum: [phone, email, null]
              description: The channel a verification code is (or would be) sent to; null once verified.
            onboarding:
              $ref: "#/components/schemas/ProfileOnboardingStatus"
    MeResponse:
      type: object
      required: [user_id, brand, session]
      properties:
        user_id:
          type: integer
        brand:
          $ref: "#/components/schemas/BrandSummary"
        session:
          type: object
          required: [id, expires_at]
          properties:
            id:
              type: integer
            expires_at:
              type: string
              format: date-time
    CloseAccountRequest:
      type: object
      required: [confirmation]
      properties:
        confirmation:
          type: string
          enum: [close]
          description: Must equal "close" to authorize this one-way destructive action.
    CloseAccountResponse:
      type: object
      required: [closed, already_closed, media_purge_state]
      properties:
        closed:
          const: true
        already_closed:
          type: boolean
          description: True when the account was already closed (idempotent).
        media_purge_state:
          type: string
          enum: [pending, completed, failed]
          description: Async physical media-purge status; starts pending.
    Completion:
      type: object
      required: [complete, percent, missing]
      properties:
        complete:
          type: boolean
        percent:
          type: integer
          minimum: 0
          maximum: 100
        missing:
          type: array
          items:
            type: string
        sections:
          type: object
          description: |
            Informational per-section completeness (photos, bio, basics, intent,
            lifestyle, interests, prompts, verification). Present on the owner
            profile only. Purely a client nudge — never affects requirements,
            publication, or visibility.
          additionalProperties:
            type: object
            required: [complete]
            properties:
              complete:
                type: boolean
    ProfileUpdate:
      type: object
      description: |
        Owner-scoped onboarding update. `first_name` and `last_name` update the
        private platform identity and are never part of public profile JSON.
        `display_name` remains the separate, brand-owned public dating identity.
      properties:
        first_name:
          type: [string, "null"]
          maxLength: 100
          description: Private, self-declared account identity. Required by DateZA completion; not a verified claim.
        last_name:
          type: [string, "null"]
          maxLength: 100
          description: Private, self-declared account identity. Required by DateZA completion and never publicly exposed.
        display_name:
          type: [string, "null"]
          maxLength: 80
        bio:
          type: [string, "null"]
          maxLength: 1000
        birthdate:
          type: [string, "null"]
          format: date
        gender:
          type: [string, "null"]
          maxLength: 40
        pronouns:
          type: [string, "null"]
          maxLength: 40
        visibility:
          type: string
          enum: [hidden, visible]
        country_code:
          type: [string, "null"]
          pattern: "^[A-Z]{2}$"
        city:
          type: [string, "null"]
          maxLength: 120
        occupation:
          type: [string, "null"]
          maxLength: 120
        job_title:
          type: [string, "null"]
          maxLength: 120
        company_name:
          type: [string, "null"]
          maxLength: 120
          description: Employer. Optional and NEVER exposed to other members (owner-only).
        school_or_institution:
          type: [string, "null"]
          maxLength: 160
        looking_for_text:
          type: [string, "null"]
          maxLength: 600
        children_count:
          type: [integer, "null"]
          minimum: 0
          maximum: 30
          description: Optional; owner-only. No other child detail is stored or exposed.
        height_cm:
          type: [integer, "null"]
          minimum: 100
          maximum: 250
        body_type:
          type: [string, "null"]
          maxLength: 80
        languages_spoken:
          type: array
          maxItems: 15
          description: Legacy free-text languages, retained for backward compatibility. Prefer `languages`.
          items:
            type: string
            maxLength: 40
        languages:
          type: array
          maxItems: 15
          description: |
            Canonical structured languages. `code` must be a supported taxonomy
            code; `proficiency` and `primary` are optional (at most one primary).
          items:
            $ref: "#/components/schemas/Language"
        smoking:
          type: [string, "null"]
          enum: [never, occasionally, regularly, null]
        drinking:
          type: [string, "null"]
          enum: [never, occasionally, regularly, null]
        fitness:
          type: [string, "null"]
          enum: [never, occasionally, regularly, null]
    OwnerProfile:
      allOf:
        - $ref: "#/components/schemas/ProfileUpdate"
        - type: object
          required: [id, brand, status, visibility, options, completion, languages_spoken]
          properties:
            id:
              type: string
              format: uuid
            brand:
              $ref: "#/components/schemas/BrandSummary"
            status:
              type: string
              enum: [draft, active, suspended]
            visibility:
              type: string
              enum: [hidden, visible]
            options:
              $ref: "#/components/schemas/ProfileOptionSelections"
            prompts:
              type: array
              items:
                $ref: "#/components/schemas/PromptAnswer"
            completion:
              $ref: "#/components/schemas/Completion"
    OwnerProfileResponse:
      type: object
      required: [profile]
      properties:
        profile:
          $ref: "#/components/schemas/OwnerProfile"
    CurrentProfileResponse:
      type: object
      required: [profile, onboarding]
      properties:
        profile:
          oneOf:
            - $ref: "#/components/schemas/OwnerProfile"
            - type: "null"
        onboarding:
          $ref: "#/components/schemas/ProfileOnboardingStatus"
    ProfileOnboardingStatus:
      type: object
      required: [state, next_step, profile_exists, profile_complete, profile_published, completion]
      properties:
        state:
          type: string
          enum: [profile_required, profile_incomplete, ready_to_publish, complete, profile_suspended]
        next_step:
          type: [string, "null"]
          enum: [profile, preferences, photos, options, publication, null]
        profile_exists:
          type: boolean
        profile_complete:
          type: boolean
        profile_published:
          type: boolean
        completion:
          $ref: "#/components/schemas/Completion"
    ProfileOptionSelections:
      type: object
      additionalProperties:
        type: array
        items:
          type: string
    Language:
      type: object
      required: [code]
      description: |
        A structured language entry. On write, only `code` is required (`proficiency`
        and `primary` optional; at most one primary). On read, `label` is included.
      properties:
        code:
          type: string
          description: Supported taxonomy code (ISO 639-1), e.g. "en".
        label:
          type: string
          readOnly: true
          description: Human-readable label from the taxonomy (read-only).
        proficiency:
          type: [string, "null"]
          enum: [native, fluent, conversational, learning, null]
        primary:
          type: boolean
    ProfileLocation:
      type: object
      required: [precision]
      description: |
        Safe, approximate location metadata for presentation — never raw
        coordinates. Viewer-relative `distance_km` is supplied separately in status.
      properties:
        city:
          type: [string, "null"]
        country_code:
          type: [string, "null"]
        precision:
          type: string
          enum: [approximate]
    ProfileInterest:
      type: object
      required: [slug, label]
      properties:
        slug:
          type: string
        label:
          type: string
        category:
          type: [string, "null"]
    PromptAnswer:
      type: object
      required: [key, prompt, answer, position]
      properties:
        key:
          type: string
        prompt:
          type: string
          description: The prompt text (copy) at read time.
        answer:
          type: string
        position:
          type: integer
          minimum: 0
    PromptAnswerInput:
      type: object
      required: [key, answer]
      properties:
        key:
          type: string
        answer:
          type: string
          maxLength: 300
    PublicProfilePhoto:
      type: object
      required: [id, position, url, url_expires_in]
      description: |
        A safe, D8N-generated display derivative of a profile photo. It is
        decoded, re-encoded, and stripped of EXIF/GPS/other metadata. Only
        deliverable photos (visible and finished processing) appear; the raw
        original and its storage key are never exposed. The `url` is a
        short-lived signed URL — refetch the profile to renew it.
      properties:
        id:
          type: string
          format: uuid
          description: |
            Stable, opaque photo id. This is the `target_id` used to report this
            specific photo via POST /api/v1/reports; never the internal id or the
            R2 object key.
        position:
          type: integer
          minimum: 0
        url:
          type: string
          format: uri
        url_expires_in:
          type: integer
    PublicProfile:
      type: object
      required: [id, age, languages_spoken, photos, options]
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: [string, "null"]
        age:
          type: [integer, "null"]
          minimum: 18
        bio:
          type: [string, "null"]
        gender:
          type: [string, "null"]
        pronouns:
          type: [string, "null"]
        country_code:
          type: [string, "null"]
        city:
          type: [string, "null"]
        location:
          oneOf:
            - $ref: "#/components/schemas/ProfileLocation"
            - type: "null"
        occupation:
          type: [string, "null"]
        job_title:
          type: [string, "null"]
        school_or_institution:
          type: [string, "null"]
        looking_for_text:
          type: [string, "null"]
        height_cm:
          type: [integer, "null"]
        body_type:
          type: [string, "null"]
        languages_spoken:
          type: array
          description: Legacy free-text languages, retained for backward compatibility.
          items:
            type: string
        languages:
          type: array
          description: Canonical structured languages (with taxonomy label).
          items:
            $ref: "#/components/schemas/Language"
        smoking:
          type: [string, "null"]
        drinking:
          type: [string, "null"]
        fitness:
          type: [string, "null"]
        photos:
          type: array
          description: |
            Safe display derivatives, ordered by position. Empty when the profile
            has no photo that is both visible and finished processing.
          items:
            $ref: "#/components/schemas/PublicProfilePhoto"
        options:
          description: |
            Selections for public_profile-visibility groups. On the profile-detail
            endpoint this ALSO includes matches_only groups when an active Match
            exists. company_name and owner-only groups are never included.
          $ref: "#/components/schemas/ProfileOptionSelections"
    Compatibility:
      type: object
      required: [score, confidence, reasons]
      properties:
        score:
          type: integer
          minimum: 0
          maximum: 100
        confidence:
          type: number
          minimum: 0
          maximum: 1
        reasons:
          type: array
          items:
            type: string
            enum: [shared_intent, similar_vibe, mutual_age_fit]
    DatezaCompatibility:
      type: [object, "null"]
      description: |
        Pair-specific deterministic DateZA compatibility. null means meaningful
        comparable input weight is below the dateza_v1 publication threshold;
        it does not mean incompatibility. Reason codes reveal no raw answers.
      required: [score, confidence, confidence_level, version, reasons]
      properties:
        score:
          type: integer
          minimum: 0
          maximum: 100
        confidence:
          type: number
          minimum: 0
          maximum: 1
        confidence_level:
          type: string
          enum: [low, medium, high]
        version:
          type: string
          enum: [dateza_v1]
        reasons:
          type: array
          maxItems: 5
          items:
            type: string
            enum:
              - shared_long_term_intent
              - compatible_relationship_goals
              - relationship_goal_mismatch
              - compatible_family_plans
              - family_plan_mismatch
              - shared_no_smoking
              - smoking_lifestyle_mismatch
              - compatible_drinking_style
              - similar_faith_importance
              - similar_social_style
              - compatible_meeting_pace
              - shared_interests
              - shared_languages
              - compatible_communication_style
              - compatible_planning_style
              - similar_travel_style
              - compatible_diet
    ProfileStatus:
      type: object
      description: |
        Viewer-relative status signals, recomputed per request. Present only on the
        discovery feed and the single-profile detail endpoint — NOT on match or
        conversation payloads, which carry the base public profile only.
      required: [verified, online, active_today, new_here, hook_tonight_active, last_active_at, distance_km, hook_state]
      properties:
        verified:
          type: boolean
          description: |
            The member has proven ownership of at least one contact identifier
            (email or phone). This is CONTACT verification, not photo/identity
            ("it's really them") verification, which does not exist yet — treat it
            as a "reachable" signal rather than a strong trust badge.
        active_today:
          type: boolean
          description: An active brand session was used within the last 24 hours.
        new_here:
          type: boolean
          description: The member's profile was created within the last 7 days.
        hook_tonight_active:
          type: boolean
          description: The member currently has a live Hook Tonight availability state.
        hook_state:
          type: string
          enum: [available, pending, hooked, unavailable]
          description: |
            The viewer's 🔥 Hook button state toward this profile:
            `available` (may Hook), `pending` (viewer has a live outgoing Hook
            awaiting their reply), `hooked` (an active Match already exists — use
            the conversation), `unavailable` (cannot Hook: already used their one
            Hook to this person, this person has a live Hook waiting on the viewer,
            already Liked, or otherwise not Hookable). Deliberately does not
            distinguish declined/expired/blocked — all collapse to `unavailable`.
        online:
          type: boolean
          description: An active brand session was used within the last 10 minutes.
        last_active_at:
          type: [string, "null"]
          format: date-time
          description: |
            Most recent active-session use (ISO8601), or null when the member has
            no active session (never signed in on this brand, revoked, or expired).
        distance_km:
          type: [integer, "null"]
          minimum: 1
          description: |
            Whole-kilometre great-circle distance from the viewer, floored to 1km
            (never 0, which would read as exact co-location). null unless BOTH the
            viewer and the member have a location no older than 24h.
    ProfileWithStatus:
      allOf:
        - $ref: "#/components/schemas/PublicProfile"
        - $ref: "#/components/schemas/ProfileStatus"
    DiscoveryProfile:
      allOf:
        - $ref: "#/components/schemas/PublicProfile"
        - $ref: "#/components/schemas/ProfileStatus"
        - type: object
          required: [compatibility]
          properties:
            compatibility:
              $ref: "#/components/schemas/Compatibility"
    DiscoveryResponse:
      type: object
      required: [profiles, next_cursor]
      properties:
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/DiscoveryProfile"
        next_cursor:
          type: [string, "null"]
    FindProfileStatus:
      type: object
      required: [verified, online, active_today, new_here, last_active_at, distance_km]
      properties:
        verified:
          type: boolean
        online:
          type: boolean
        active_today:
          type: boolean
        new_here:
          type: boolean
        last_active_at:
          type: [string, "null"]
          format: date-time
        distance_km:
          type: [integer, "null"]
          minimum: 1
    FindProfile:
      allOf:
        - $ref: "#/components/schemas/PublicProfile"
        - $ref: "#/components/schemas/FindProfileStatus"
        - type: object
          required: [compatibility]
          properties:
            compatibility:
              $ref: "#/components/schemas/DatezaCompatibility"
    FindAllowance:
      type: object
      required: [limit, used, remaining, exhausted, resets_at]
      properties:
        limit:
          type: integer
          minimum: 1
        used:
          type: integer
          minimum: 0
        remaining:
          type: integer
          minimum: 0
        exhausted:
          type: boolean
        resets_at:
          type: string
          format: date-time
          description: Next midnight in Africa/Johannesburg, including its UTC offset.
    FindResponse:
      type: object
      required: [profiles, next_cursor, allowance]
      properties:
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/FindProfile"
        next_cursor:
          type: [string, "null"]
        allowance:
          $ref: "#/components/schemas/FindAllowance"
    ProfileDetail:
      description: |
        The rich single-profile view (GET /profiles/:id): the public profile with
        viewer-relative status, plus the heavier detail-only sections (prompts and a
        categorized interests view). matches_only option groups appear under
        `options` only when an active Match exists between the viewer and member.
      allOf:
        - $ref: "#/components/schemas/ProfileWithStatus"
        - type: object
          required: [prompts, interests]
          properties:
            prompts:
              type: array
              items:
                $ref: "#/components/schemas/PromptAnswer"
            interests:
              type: array
              description: Categorized interests derived from the `interests` group's selections.
              items:
                $ref: "#/components/schemas/ProfileInterest"
    ProfileDetailResponse:
      type: object
      required: [profile]
      properties:
        profile:
          $ref: "#/components/schemas/ProfileDetail"
    ProfilePreferencesUpdate:
      type: object
      properties:
        min_age:
          type: [integer, "null"]
          minimum: 18
          maximum: 120
        max_age:
          type: [integer, "null"]
          minimum: 18
          maximum: 120
        interested_in:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 40
        max_distance_km:
          type: [integer, "null"]
          minimum: 1
          maximum: 500
        country:
          type: [string, "null"]
          pattern: "^[A-Z]{2}$"
        relationship_intent:
          type: [string, "null"]
          maxLength: 80
    ProfilePreferences:
      allOf:
        - $ref: "#/components/schemas/ProfilePreferencesUpdate"
        - type: object
          required: [id, profile_id, brand, interested_in]
          properties:
            id:
              type: integer
            profile_id:
              type: string
              format: uuid
            brand:
              $ref: "#/components/schemas/BrandSummary"
    ProfileLocationUpdate:
      type: object
      required: [latitude, longitude, accuracy_meters, captured_at]
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
          writeOnly: true
        longitude:
          type: number
          minimum: -180
          maximum: 180
          writeOnly: true
        accuracy_meters:
          type: integer
          minimum: 0
          maximum: 100000
        captured_at:
          type: string
          format: date-time
    ProfileLocationState:
      type: object
      required: [configured]
      properties:
        configured:
          type: boolean
        accuracy_meters:
          type: integer
        source:
          type: string
          enum: [device, manual, imported]
        captured_at:
          type: string
          format: date-time
    ProfileLocationResponse:
      type: object
      required: [location]
      properties:
        location:
          $ref: "#/components/schemas/ProfileLocationState"
    ProfilePhoto:
      type: object
      required: [id, profile_id, position, status, visibility, processing_state, deleted_at, image]
      properties:
        id:
          type: integer
        profile_id:
          type: string
          format: uuid
        position:
          type: integer
        status:
          type: string
          description: Moderation lifecycle; independent of processing_state and visibility.
          enum: [pending_review, approved, rejected]
        visibility:
          type: string
          enum: [hidden, visible]
        processing_state:
          type: string
          description: |
            Safe-derivative pipeline state. Only `ready` photos are eligible for
            delivery to other users. `image` shows the owner their raw upload
            while `pending`/`processing`, and the safe display derivative once
            `ready`. `failed` marks a permanently unprocessable image.
          enum: [pending, processing, ready, failed]
        deleted_at:
          type: [string, "null"]
          format: date-time
        image:
          oneOf:
            - $ref: "#/components/schemas/ProfilePhotoImage"
            - type: "null"
    ProfilePhotoImage:
      type: object
      required: [filename, content_type, byte_size, url, url_expires_in]
      properties:
        filename:
          type: string
        content_type:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        byte_size:
          type: integer
        url:
          type: string
          description: Short-lived signed retrieval URL (direct from private R2).
        url_expires_in:
          type: integer
          description: Seconds until the signed retrieval URL expires.
    ProfilePhotoUpload:
      type: object
      required: [signed_id, url, headers, expires_in, byte_size_limit, allowed_content_types]
      properties:
        signed_id:
          type: string
          description: Opaque id to submit when attaching the completed upload.
        url:
          type: string
          description: Short-lived presigned PUT URL for the media bytes.
        headers:
          type: object
          additionalProperties:
            type: string
          description: Exact headers to send with the PUT (includes Content-MD5).
        expires_in:
          type: integer
          description: Seconds until the presigned upload URL expires.
        byte_size_limit:
          type: integer
        allowed_content_types:
          type: array
          items:
            type: string
    ProfileConfigurationResponse:
      type: object
      required: [configuration, onboarding]
      properties:
        configuration:
          $ref: "#/components/schemas/ProfileConfiguration"
        onboarding:
          $ref: "#/components/schemas/ProfileOnboardingStatus"
    ProfileConfiguration:
      type: object
      required: [identity_fields, profile_fields, preference_fields, collections, option_groups, prompts]
      properties:
        identity_fields:
          type: array
          description: Private platform-identity fields enabled for this brand's onboarding flow.
          items:
            $ref: "#/components/schemas/ConfiguredField"
        profile_fields:
          type: array
          items:
            $ref: "#/components/schemas/ConfiguredField"
        preference_fields:
          type: array
          items:
            $ref: "#/components/schemas/ConfiguredField"
        collections:
          type: array
          items:
            $ref: "#/components/schemas/ConfiguredCollection"
        option_groups:
          type: array
          items:
            $ref: "#/components/schemas/ConfiguredOptionGroup"
        prompts:
          type: array
          description: Brand-enabled prompt definitions a member may answer.
          items:
            $ref: "#/components/schemas/ConfiguredPrompt"
    ConfiguredField:
      type: object
      required: [key, label, required, cardinality, input_type, visibility, options]
      properties:
        key:
          type: string
        label:
          type: string
        required:
          type: boolean
        cardinality:
          type: string
          enum: [single, multiple]
        input_type:
          type: string
          enum: [text, textarea, date, integer, select, string_list, language_list]
        visibility:
          type: string
          enum: [owner_only, public_profile]
        options:
          type: array
          description: Controlled choices when the field has a server-owned vocabulary; otherwise empty.
          items:
            type: object
            required: [code, label]
            properties:
              code:
                type: string
              label:
                type: string
    ConfiguredCollection:
      type: object
      required: [key, label, required, minimum_count]
      properties:
        key:
          type: string
        label:
          type: string
        required:
          type: boolean
        minimum_count:
          type: integer
          minimum: 1
    ConfiguredOptionGroup:
      type: object
      required: [key, label, cardinality, max_selections, required, visibility, options]
      properties:
        key:
          type: string
        label:
          type: string
        cardinality:
          type: string
          enum: [single, multiple]
        max_selections:
          type: integer
        required:
          type: boolean
        visibility:
          type: string
          enum: [owner_only, public_profile, matches_only]
        options:
          type: array
          items:
            type: object
            required: [code, label]
            properties:
              code:
                type: string
              label:
                type: string
              category:
                type: [string, "null"]
    ConfiguredPrompt:
      type: object
      required: [key, text]
      properties:
        key:
          type: string
        text:
          type: string
        category:
          type: [string, "null"]
    IncompleteProfileError:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          required: [completion]
          properties:
            completion:
              type: object
              required: [percent, missing]
              properties:
                percent:
                  type: integer
                missing:
                  type: array
                  items:
                    type: string
    LikeResponse:
      type: object
      required: [liked, matched, match_id, created]
      properties:
        liked:
          const: true
        matched:
          type: boolean
        match_id:
          type: [string, "null"]
          format: uuid
        created:
          type: boolean
    PassResponse:
      type: object
      required: [passed, created]
      properties:
        passed:
          const: true
        created:
          type: boolean
    BlockResponse:
      type: object
      required: [blocked, created]
      properties:
        blocked:
          const: true
        created:
          type: boolean
    BlockedProfilesResponse:
      type: object
      required: [blocks]
      properties:
        blocks:
          type: array
          description: Profiles the current member has blocked, newest first.
          items:
            type: object
            required: [profile, blocked_at]
            properties:
              profile:
                type: object
                required: [id, display_name]
                description: Minimum information needed to recognise and unblock the target.
                properties:
                  id:
                    type: string
                    format: uuid
                  display_name:
                    type: [string, "null"]
              blocked_at:
                type: string
                format: date-time
    ReportReason:
      type: string
      description: |
        Stable safety-reason code. Codes are stable and never renumbered; the
        frontend maps them to display labels and may offer a tailored subset per
        target type. `violence_or_threat`, `non_consensual_content`, and
        `impersonation` were added in Reporting V2.
      enum:
        [inappropriate_content, harassment, spam, fake_profile, underage, other,
         violence_or_threat, non_consensual_content, impersonation]
    ReportTargetType:
      type: string
      description: |
        The kind of thing being reported. `profile` reports a person; the others
        report a specific piece of that person's content. New types are added as
        the underlying features ship.
      enum: [profile, message, profile_media, hook]
    ReportRequest:
      type: object
      required: [reason]
      properties:
        reason:
          $ref: "#/components/schemas/ReportReason"
        note:
          type: [string, "null"]
          maxLength: 2000
          description: Optional free-text detail from the reporter.
    ReportResponse:
      type: object
      required: [reported, created]
      properties:
        reported:
          const: true
        created:
          type: boolean
          description: True when a new report was filed; false when an open report already existed.
    FileReportRequest:
      type: object
      required: [target_type, reason]
      properties:
        target_type:
          $ref: "#/components/schemas/ReportTargetType"
        target_id:
          type: [string, "null"]
          description: |
            Opaque public id of the target content — a message id, photo id, or
            Hook id (a profile's public id when `target_type` is `profile`). The
            responsible profile is always derived server-side from this target,
            never supplied by the client.
        reason:
          $ref: "#/components/schemas/ReportReason"
        details:
          type: [string, "null"]
          maxLength: 2000
          description: Optional untrusted reporter context. Normalized and length-bounded.
        block:
          type: boolean
          default: false
          description: |
            When true, the responsible profile is also blocked after the report is
            filed. Both actions are idempotent.
    FileReportResponse:
      type: object
      required: [report, created, blocked]
      properties:
        report:
          type: object
          required: [status]
          properties:
            status:
              type: string
              const: received
              description: |
                Acknowledgement only. Internal moderation status/notes/evidence
                and any offender history are never exposed to the reporter.
        created:
          type: boolean
          description: True when a new report was filed; false when an open report for this target already existed.
        blocked:
          type: boolean
          description: True when `block` was requested and the responsible profile is now blocked.
    ProductNotification:
      type: object
      required: [id, type, title, body, payload, read_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [dateza.welcome]
          description: Stable semantic type. New types are added compatibly.
        title:
          type: string
        body:
          type: string
        payload:
          type: object
          description: Type-controlled, presentation-safe structured data. Empty for dateza.welcome.
          additionalProperties: true
        read_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
    NotificationListResponse:
      type: object
      required: [notifications, unread_count]
      properties:
        notifications:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/ProductNotification"
        unread_count:
          type: integer
          minimum: 0
    NotificationResponse:
      type: object
      required: [notification]
      properties:
        notification:
          $ref: "#/components/schemas/ProductNotification"
    MarkAllNotificationsReadResponse:
      type: object
      required: [marked_read, unread_count]
      properties:
        marked_read:
          type: integer
          minimum: 0
        unread_count:
          const: 0
    Match:
      type: object
      required: [id, matched_at, profile]
      properties:
        id:
          type: string
          format: uuid
        matched_at:
          type: string
          format: date-time
        profile:
          $ref: "#/components/schemas/PublicProfile"
    MatchListResponse:
      type: object
      required: [matches, next_cursor]
      properties:
        matches:
          type: array
          items:
            $ref: "#/components/schemas/Match"
        next_cursor:
          type: [string, "null"]
    Conversation:
      type: object
      required: [id, match_id, status, created_at, profile, last_message]
      properties:
        id:
          type: string
          format: uuid
        match_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [active, closed]
        created_at:
          type: string
          format: date-time
        profile:
          $ref: "#/components/schemas/PublicProfile"
        last_message:
          description: Preview of the newest message, or null for an empty conversation.
          oneOf:
            - $ref: "#/components/schemas/MessagePreview"
            - type: "null"
    MessagePreview:
      type: object
      required: [id, sender_id, body, created_at]
      properties:
        id:
          type: string
          format: uuid
        sender_id:
          type: [string, "null"]
          format: uuid
          description: Public profile id of the author.
        body:
          type: string
        created_at:
          type: string
          format: date-time
    Message:
      type: object
      required: [id, conversation_id, sender_id, body, created_at]
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        sender_id:
          type: string
          format: uuid
          description: |
            Public profile id of the author. The client identifies its own
            messages by comparing against the counterpart profile id on the
            conversation (there are exactly two participants).
        body:
          type: string
        created_at:
          type: string
          format: date-time
    MessageListResponse:
      type: object
      required: [messages, next_cursor]
      properties:
        messages:
          type: array
          description: Newest-first page of messages.
          items:
            $ref: "#/components/schemas/Message"
        next_cursor:
          type: [string, "null"]
    SendMessageRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 2000
          description: Plain-text message. Non-blank, NFC-normalized, Unicode preserved.
    SendMessageResponse:
      type: object
      required: [message]
      properties:
        message:
          $ref: "#/components/schemas/Message"
    HookTonightActivateRequest:
      type: object
      description: |
        Optional activation body. V1 accepts a single availability `intent`;
        omitting the body activates with the default.
      properties:
        intent:
          type: string
          enum: [open_to_meeting]
          default: open_to_meeting
          description: The availability intent. Unsupported values yield `invalid_intent`.
    HookTonightState:
      type: object
      description: |
        Current Hook Tonight availability, authoritative and clock-checked. When
        `active` is false, `expires_at` and `intent` are null.
      required: [active, expires_at, intent]
      properties:
        active:
          type: boolean
          description: Whether the member is currently live in the Hook Tonight pool.
        expires_at:
          type: [string, "null"]
          format: date-time
          description: When the current availability lapses, or null when inactive.
        intent:
          type: [string, "null"]
          enum: [open_to_meeting, null]
          description: The active availability intent, or null when inactive.
    SendHookRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 2000
          description: |
            The opener the sender chose to submit (the pre-filled default or an
            edited version). Plain text, non-blank, NFC-normalized, Unicode
            preserved. Same constraints as a chat message.
    SendHookResponse:
      type: object
      required: [hook]
      properties:
        hook:
          $ref: "#/components/schemas/HookAcknowledgement"
    HookAcknowledgement:
      type: object
      description: |
        Minimal sender-facing acknowledgement. The sender learns only that their
        opener is pending and when it lapses — never anything the recipient does.
      required: [id, status, created_at, expires_at]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending]
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: When the pending Hook expires if the recipient never engages.
    ReceivedHook:
      type: object
      description: One received Hook in the recipient inbox.
      required: [id, message, created_at, expires_at, sender]
      properties:
        id:
          type: string
          format: uuid
        message:
          type: string
          description: The sender's opener.
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        sender:
          $ref: "#/components/schemas/PublicProfile"
    HookInboxResponse:
      type: object
      required: [hooks, next_cursor]
      properties:
        hooks:
          type: array
          description: Newest-first page of live received Hooks.
          items:
            $ref: "#/components/schemas/ReceivedHook"
        next_cursor:
          type: [string, "null"]
    HookReplyRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 2000
          description: The recipient's reply text. Same constraints as a chat message.
    HookReplyResponse:
      type: object
      description: The unlocked conversation plus the recipient's stored reply message.
      required: [conversation, message]
      properties:
        conversation:
          $ref: "#/components/schemas/Conversation"
        message:
          $ref: "#/components/schemas/Message"
    AdminReportParty:
      description: Minimal identity of a report participant, or null if unresolved.
      oneOf:
        - type: object
          required: [id, display_name]
          properties:
            id:
              type: string
              format: uuid
            display_name:
              type: [string, "null"]
        - type: "null"
    AdminReport:
      type: object
      required:
        [id, status, reason, target_type, evidence, reporter, reported, note,
         resolution_note, reviewed_by_admin_user_id, reviewed_at, created_at, updated_at]
      properties:
        id:
          type: integer
        status:
          type: string
          enum: [open, reviewing, actioned, dismissed]
        reason:
          $ref: "#/components/schemas/ReportReason"
        target_type:
          $ref: "#/components/schemas/ReportTargetType"
        evidence:
          type: object
          additionalProperties: true
          description: |
            Minimal, immutable moderation snapshot captured when the report was
            filed (e.g. message/opener text, photo identity + lifecycle). Empty
            for a plain profile report. Survives later deletion of the target.
            Moderator-only; never contains R2 keys, storage paths, or URLs.
        reporter:
          $ref: "#/components/schemas/AdminReportParty"
        reported:
          description: The responsible profile, derived server-side from the target.
          $ref: "#/components/schemas/AdminReportParty"
        note:
          type: [string, "null"]
          description: Reporter-supplied context.
        resolution_note:
          type: [string, "null"]
          description: Moderator's short decision note.
        reviewed_by_admin_user_id:
          type: [integer, "null"]
        reviewed_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AdminReportListResponse:
      type: object
      required: [reports, next_cursor]
      properties:
        reports:
          type: array
          items:
            $ref: "#/components/schemas/AdminReport"
        next_cursor:
          type: [string, "null"]
    AdminReportResponse:
      type: object
      required: [report]
      properties:
        report:
          $ref: "#/components/schemas/AdminReport"
    UpdateReportRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [reviewing, actioned, dismissed, open]
          description: Target lifecycle status. Server enforces valid transitions.
        note:
          type: [string, "null"]
          maxLength: 2000
          description: Optional short moderator decision note.
    SuspendProfileRequest:
      type: object
      properties:
        reason:
          type: [string, "null"]
          maxLength: 500
          description: Optional short moderator reason (audited, never exposed publicly).
        report_id:
          type: [integer, "null"]
          description: Optional id of the report that motivated the enforcement (same brand).
    AdminEnforcement:
      type: object
      required:
        [id, state, profile_id, reason, report_id, admin_user_id,
         reverted_by_admin_user_id, created_at, reverted_at]
      properties:
        id:
          type: integer
        state:
          type: string
          enum: [active, reverted]
          description: The enforcement's own state, distinct from account/report status.
        profile_id:
          type: [string, "null"]
          format: uuid
        reason:
          type: [string, "null"]
        report_id:
          type: [integer, "null"]
        admin_user_id:
          type: integer
        reverted_by_admin_user_id:
          type: [integer, "null"]
        created_at:
          type: string
          format: date-time
        reverted_at:
          type: [string, "null"]
          format: date-time
    AdminEnforcementResponse:
      type: object
      required: [enforcement]
      properties:
        enforcement:
          $ref: "#/components/schemas/AdminEnforcement"
    StartConversationResponse:
      type: object
      required: [conversation, created]
      properties:
        conversation:
          $ref: "#/components/schemas/Conversation"
        created:
          type: boolean
    ConversationListResponse:
      type: object
      required: [conversations, next_cursor]
      properties:
        conversations:
          type: array
          items:
            $ref: "#/components/schemas/Conversation"
        next_cursor:
          type: [string, "null"]

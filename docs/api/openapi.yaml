  /api/v1/hq/trust_safety/overview:
    get:
      operationId: getHqTrustSafetyOverview
      tags: [Hq]
      summary: Current-brand Trust & Safety queue and enforcement overview
      description: |
        Requires verified admin MFA and `hq.trust_safety.read`; brand-scoped and read-only. Returns current
        report counts by status, reason, and target type; open-queue aging; and
        enforcement totals. `overdue` is deliberately null and `sla_status` is
        `not_configured` because D8N has not defined an SLA threshold. The read
        is audited as `hq.trust_safety_overview_viewed` without recording report
        content, filters, or member PII.
      responses:
        "200":
          description: Current Trust & Safety overview for the host-resolved brand.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HqTrustSafetyOverviewResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":

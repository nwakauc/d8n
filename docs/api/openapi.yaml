        "403":
          $ref: "#/components/responses/ProfileOrMembershipRequired"
    put:
      operationId: replaceProfilePrompts
      tags: [Profile]
      summary: Replace the member's prompt answers
      description: |
        Replaces the full ordered set of prompt answers. Array order becomes the
        display position. Unknown or duplicate prompt keys are rejected; at most
        five answers are allowed and each answer is length-limited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers:
                  type: array
                  maxItems: 5
                  items:
                    $ref: "#/components/schemas/PromptAnswerInput"
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Updated owner profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProfileOrMembershipRequired"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/profile/publication:
    post:
      operationId: activateProfile
      tags: [Profile]
      summary: Activate and publish a complete profile
      responses:
        "200":
          description: Activated owner profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProfileOrMembershipRequired"
        "422":
          description: Profile does not satisfy current brand completion requirements.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncompleteProfileError"
    delete:
      operationId: deactivateProfile
      tags: [Profile]
      summary: Hide and deactivate the current profile
      responses:
        "200":
          description: Deactivated owner profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProfileOrMembershipRequired"
  /api/v1/profile/location:
    get:
      operationId: showProfileLocation
      tags: [Profile]
      summary: Authoritative owner readback of the current profile's dating location
      description: |
        The backend is the sole source of truth for whether a dating location is
        configured — clients must not derive this from local/device state. Reads
        the same `ProfileLocation` row every write path (`PUT /profile/location`,
        `PUT /profile/place`) and Matching's distance filtering consume, so this
        endpoint can never disagree with what Discover/Find actually use.

        Never returns latitude/longitude, regardless of `source` — only a safe
        display representation. A missing profile, a profile with no saved
        location, and a soft-deleted location all resolve to the same
        `configured: false` response rather than an error, matching
        `GET /api/v1/profile/preferences`'s null-safe convention. Owner-only:
        there is no way to address another member's location through this
        endpoint, and a suspended profile may still read its own location.

        `configured` here is definitionally identical to the `location.configured`
        summary already returned inline by `GET /api/v1/profile` — the two must
        never disagree, since both derive from the presence of the same kept
        `ProfileLocation` row.
      responses:
        "200":
          description: Current dating location, or its configured absence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileLocationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: replaceProfileLocation
      tags: [Profile]
      summary: Replace the current profile's private precise location
      description: Coordinates are accepted but never returned by this API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileLocationUpdate"
      responses:
        "200":
          description: Private location state without coordinates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileLocationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProfileOrMembershipRequired"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      operationId: deleteProfileLocation
      tags: [Profile]
      summary: Soft-delete the current profile's precise location
      responses:
        "200":
          description: Location is no longer configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileLocationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProfileOrMembershipRequired"
  /api/v1/places:
    get:
      operationId: listPlaces
      tags: [Profile]
      summary: List the current brand's canonical place catalog
      description: |
        Brand/country-scoped hierarchy (currently region → city → locality for
        DateZA; `country_code = ZA` is implicit and never listed). Omit
        `parent_id` for the top-level regions; pass a region/city `id` as
        `parent_id` to list its children. Returns `404 place_not_found` if
        `parent_id` does not resolve within the brand's configured countries.
        `404 capability_not_configured` for brands without place selection
        (e.g. HookUs).
      parameters:
        - name: parent_id
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Selectable places at the requested level.
          content:
            application/json:
              schema:
                type: object
                required: [places]
                properties:
                  places:
                    type: array
                    items:
                      $ref: "#/components/schemas/Place"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/locations/search:
    get:
      operationId: searchLocations
      tags: [Profile]
      summary: Search area-level dating locations (suburb, city, town) for "Enter my area or suburb"
      description: |
        Server-side search over D8N's own geography data, scoped to the
        request brand's configured countries (DateZA: South Africa only) —
        the client never calls an external geocoding provider directly, and
        the provider behind this endpoint may change without changing this
        contract. Never returns a country-level entry, individual addresses,
        or raw coordinates: only area-level results (region, city, or
        locality) suitable as a general dating-area choice. Each result's
        `place_id` is directly usable as-is with
        `PUT /api/v1/profile/place` — there is no separate selection/token
        endpoint. Same brand gate as `GET /places`: `404
        capability_not_configured` for brands without place selection
        configured (e.g. HookUs).
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
          description: Free-text area/suburb/city query. Whitespace is normalized; at least 2 meaningful characters are required.
      responses:
        "200":
          description: Up to 8 normalized, area-level matches, best first.
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/LocationSearchResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: The query was blank or below the minimum length.
          content:
            application/json:
              schema:
                type: object
                required: [error, min_length]
                properties:
                  error:
                    type: string
                    enum: [query_too_short]
                  min_length:
                    type: integer
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/profile/place:
    put:
      operationId: replaceProfilePlace
      tags: [Profile]
      summary: Set the current profile's dating location from the canonical place catalog
      description: |
        Resolves `place_id` (a region/city/locality, never a country) to its
        server-held centroid coordinates and writes the same authoritative
        location record `PUT /api/v1/profile/location` does — the two paths
        are mutually exclusive updates to one location, not parallel systems.
        A client cannot submit or influence coordinates directly; only a valid
        `place_id` within the brand's configured countries is accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [place_id]
              properties:
                place_id:
                  type: integer
      responses:
        "200":
          description: Location configured from the selected place, without coordinates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileLocationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProfileOrMembershipRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Unknown place, or outside the brand's configured countries.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    enum: [invalid_place]
  /api/v1/profile/photos:
    get:
      operationId: listProfilePhotos
      tags: [Profile]
      summary: List the current profile's photos
      description: |
        Each attached image carries a short-lived signed retrieval `url` (direct
        from private R2) plus its `url_expires_in` seconds. Refetch to renew.
      responses:
        "200":
          description: Owner photo library.
          content:
            application/json:
              schema:
                type: object
                required: [photos]
                properties:
                  photos:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProfilePhoto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createProfilePhoto
      tags: [Profile]
      summary: Attach a completed direct upload to the profile
      description: |
        Second step of the direct-to-R2 upload. Submit the `signed_id` returned by
        `POST /api/v1/profile/photos/uploads` after the bytes have been `PUT` to the
        presigned URL. D8N confirms the object exists in private R2, verifies its
        real file signature and size (the declared MIME is only a hint), and
        attaches it to the authenticated owner's profile. New photos begin
        `pending_review`; initial visibility follows the brand policy (HookUs and
        DateZA: `visible` immediately with asynchronous moderation; a brand
        without an explicit immediate policy: `hidden` until moderated). A
        `signed_id` may be attached only once. The upload is
        then processed asynchronously into a safe, EXIF-stripped display
        derivative (`processing_state`); other users only ever see that
        derivative, and only once it is `ready`. Until then the photo is not
        exposed in discovery/matches even if visible. The current brand's
        `configuration.collections[photos].maximum_count` is enforced atomically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signed_id]
              properties:
                signed_id:
                  type: string
                  description: Opaque signed id from the upload-intent response.
                position:
                  type: integer
                  minimum: 0
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "201":
          description: Photo accepted for processing/review.
          content:
            application/json:
              schema:
                type: object
                required: [photo]
                properties:
                  photo:
                    $ref: "#/components/schemas/ProfilePhoto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProfileOrMembershipRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Invalid/reused upload, invalid insertion position, or the configured photo maximum was reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/profile/photos/order:
    put:
      operationId: reorderProfilePhotos
      tags: [Profile]
      summary: Replace the current profile's complete kept-photo order
      description: |
        `photo_ids` must contain every and only kept photo id returned by the
        owner photo library, exactly once. The replacement is atomic and assigns
        sequential positions from zero. The first ordered owner photo is primary;
        public surfaces independently select the first deliverable ordered photo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [photo_ids]
              properties:
                photo_ids:
                  type: array
                  uniqueItems: true
                  items:
                    type: integer
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Complete owner photo library in its new order.
          content:
            application/json:
              schema:
                type: object
                required: [photos]
                properties:
                  photos:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProfilePhoto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Malformed, duplicate, incomplete, deleted, or foreign photo ids.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/profile/photos/uploads:
    post:
      operationId: createProfilePhotoUpload
      tags: [Profile]
      summary: Request a direct-to-R2 photo upload authorization
      description: |
        First step of the direct-to-R2 upload (control plane). Declare the file's
        `content_type`, `byte_size`, and base64 MD5 `checksum`. D8N authorizes the
        caller, validates the declared media, allocates the object identity, and
        returns a short-lived presigned `PUT` `url` plus the exact `headers` to send
        with it. Upload the bytes directly to that URL, then attach the returned
        `signed_id` via `POST /api/v1/profile/photos`. D8N chooses the object key;
        the client never receives R2 credentials.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content_type, byte_size, checksum]
              properties:
                content_type:
                  type: string
                  enum: [image/jpeg, image/png, image/webp]
                byte_size:
                  type: integer
                  minimum: 1
                  description: Exact byte size of the file to upload (max 10 MB).
                checksum:
                  type: string
                  description: Base64-encoded MD5 digest of the file bytes.
                filename:
                  type: string
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "201":
          description: Short-lived upload authorization.
          content:
            application/json:
              schema:
                type: object
                required: [upload]
                properties:
                  upload:
                    $ref: "#/components/schemas/ProfilePhotoUpload"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProfileOrMembershipRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/profile/photos/{id}:
    delete:
      operationId: deleteProfilePhoto
      tags: [Profile]
      summary: Soft-delete a profile photo
      parameters:
        - $ref: "#/components/parameters/PhotoId"
      responses:
        "200":
          description: Soft-deleted owner photo record.
          content:
            application/json:
              schema:
                type: object
                required: [photo]
                properties:
                  photo:
                    $ref: "#/components/schemas/ProfilePhoto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/discovery:
    get:
      operationId: getDiscovery
      tags: [Matching]
      summary: Get the brand's configured default Discovery surface
      description: |
        All configured surfaces apply the **same**
        eligibility rules (brand isolation, active/visible profiles,
        current-user exclusion, reciprocal age/gender/preference, distance,
        blocking/exclusions).

        For HookUs, `mode` selects a cursor feed:
          * `for_you` (default) — the compatibility-ranked feed.
          * `new_here` — the newest eligible profiles first, deterministic on
            recency; the compatibility payload is still included.
        `vibe`, `online`, `cursor`, and `limit` apply to these HookUs feeds.

        For DateZA, omitting `mode` resolves `discovery.curated_daily`. The first
        request in an Africa/Johannesburg calendar day finalizes a persisted,
        compatibility-ranked allocation of up to 10 profiles. Repeated requests
        return the same order and do not consume profiles or DateZA Find
        allowance. Safety and shared interaction exclusions are rechecked on
        delivery; invalid candidates are omitted without refill. The response has
        `next_cursor: null` and `selection` metadata. `count` is the number
        currently safe to return, so it may be below the original allocation.
        There is intentionally no `remaining` consumption counter.

        A HookUs `next_cursor` encodes the mode and every active facet, so a
        later page cannot switch strategy or silently drop/change a filter:
        replaying a cursor under a different mode/vibe/online yields
        `invalid_cursor`. An unknown mode yields `invalid_mode`.

        Each profile includes `photos`: safe, EXIF-stripped display derivatives
        with short-lived signed URLs. Raw originals are never exposed.
      parameters:
        - $ref: "#/components/parameters/DiscoveryMode"
        - $ref: "#/components/parameters/DiscoveryVibe"
        - $ref: "#/components/parameters/DiscoveryOnline"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Configured strategy-ranked Discovery profiles and surface metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Current profile is not active and discoverable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: >-
            The resolved database brand has no production contract
            (`brand_not_configured`), or its contract does not enable Discovery
            (`matching_not_configured`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/InvalidInput"
  /api/v1/find:
    get:
      operationId: getFindProfiles
      tags: [Matching]
      summary: Explore DateZA-eligible profiles under the daily unique-exposure allowance
      description: |
        DateZA Find returns deterministic newest-first pages from the shared D8N
        eligibility scope. For a free member, at most 10 unique candidate profiles
        may be surfaced during one Africa/Johannesburg calendar day. Replaying a
        page or seeing a previously exposed candidate does not consume allowance
        again. Detail, Like, and Pass operations do not consume Find allowance.
        An otherwise eligible DateZA member may use Find while the identifier
        attached to the current login session is unverified; verification is
        required only when they proceed to an interaction surface.

        Every returned profile has `compatibility`: a deterministic DateZA v1
        score, confidence and bounded reason codes when at least 35% of weighted
        dimensions are comparable, otherwise null. Compatibility is computed
        after eligibility and exposure allocation and does not consume allowance.

        The cursor is opaque, signed, and bound to the resolved brand, current
        membership, DateZA Find policy version, and exact filter set. Filters only
        narrow the member's stored reciprocal age/gender/distance eligibility.
        DateZA Discovery is a separate, unimplemented product surface.
      parameters:
        - $ref: "#/components/parameters/FindCursor"
        - $ref: "#/components/parameters/FindLimit"
        - $ref: "#/components/parameters/FindMinAge"
        - $ref: "#/components/parameters/FindMaxAge"
        - $ref: "#/components/parameters/FindMaxDistance"
        - $ref: "#/components/parameters/FindRelationshipIntent"
      responses:
        "200":
          description: Eligible safe public profiles and authoritative daily allowance state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Current profile is not active and discoverable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: >-
            The resolved database brand has no production contract
            (`brand_not_configured`), or its contract does not enable Find
            (`find_not_configured`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/InvalidInput"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/profiles/{profile_id}:
    get:
      operationId: getPublicProfile
      tags: [Matching]
      summary: Get one member's safe public profile by its public UUID
      description: |
        Authoritative, refreshable detail for a single profile, resolved from the
        stable public UUID surfaced by discovery (`profiles[].id`). This is the
        source of truth for a profile page: a browser refresh, a new tab, or a
        deep link all resolve independently — no client-side cache is required
        for correctness.

        Requires an authenticated member with an active, discoverable profile.
        "Public" means *safe information visible to another eligible authenticated
        member* — it is NOT unauthenticated web-public data.

        The response extends the safe public profile shape used by discovery with
        prompts, categorized interests, explicit contact-verification state, and
        DateZA's existing pair compatibility payload where configured.
        Compatibility is presentation-only here and does not change eligibility
        or matching semantics. `photos` are safe, EXIF-stripped display derivatives
        with short-lived signed URLs, in deterministic position order; raw
        originals and storage keys are never exposed.

        Availability enforces the SAME fundamental safety rules as discovery —
        brand isolation, active/visible lifecycle, suspension, account closure,
        soft-deletion, and blocking in either direction — but deliberately does
        NOT reapply reciprocal age/gender/distance, so a profile reachable from
        discovery keeps resolving even after ranking or dating preferences change.
        Every unavailable case (unknown, cross-brand, hidden, inactive, suspended,
        closed, discarded, or blocked either way) returns the same neutral
        `profile_unavailable` (404) and never reveals why.
      parameters:
        - $ref: "#/components/parameters/PublicProfileId"
      responses:
        "200":
          description: The target member's safe public profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InteractionForbidden"
        "404":
          description: |
            Target is unavailable. Unknown, cross-brand, hidden, inactive,
            suspended, closed, discarded, and blocked targets all share the
            neutral `profile_unavailable` response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/likes/incoming:
    get:
      operationId: listIncomingLikes
      tags: [Matching]
      summary: List profiles who have liked the viewer
      description: |
        Active Likes where another profile has liked the authenticated viewer's
        profile, and the pair remains a current, actionable relationship state:
        not blocked in either direction, not yet a Match (a mutual Like
        surfaces through `GET /api/v1/matches` instead, not here), and
        otherwise visible under the same base policy every Matching surface
        shares. Newest-liked-first, cursor-paginated. Shares its authorization
        capability with `POST /api/v1/profiles/{profile_id}/likes`.
      parameters:

        with a curated catalog (DateZA) requires `opener_key` to reference an
        active entry from `GET /api/v1/profile/configuration` → `openers`; the
        resolved catalog text is what gets sent (there is no freeform field). No
        Match/Conversation/Message is created yet: the opener is held on the
        record, and the sender is locked out from any further message until the
        recipient replies (and a second Opener to the same person is rejected).

        Reachability matches Like exactly: blocked (either direction), suspended,
        closed, hidden, cross-brand, self, and otherwise-ineligible targets all
        fail closed as `profile_unavailable` (404), never revealing which.

        V1 anti-spam: exactly one Opener per (sender → recipient) pair, ever — a
        second attempt (including after decline/expiry) returns `already_hooked`
        (409). Sending is also bounded by a per-sender daily allowance
        (`hook_rate_limited`, 429, with `Retry-After`).

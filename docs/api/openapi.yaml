  /api/v1/hook_tonight:
    get:
      operationId: getHookTonight
      tags: [Hook Tonight]
      summary: Get the current member's Hook Tonight availability
      description: |
        Authoritative current availability, computed against the clock: a lapsed
        or deactivated activation reports `active: false`. Drives the CTA state
        ("🔥 Hook Tonight" when inactive, "🔥 You're available tonight" with the
        expiry when active).
      responses:
        "200":
          description: The current availability state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HookTonightState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/HookTonightNotConfigured"
    post:
      operationId: activateHookTonight
      tags: [Hook Tonight]
      summary: Activate (or refresh) Hook Tonight availability
      description: |
        Turns Hook Tonight on for the current member and (re)stamps the expiry,
        surfacing them in the Hook Tonight discovery pool. Idempotent: re-posting
        while active simply refreshes the same single state row (no history is
        accumulated, safe under concurrent calls). Requires an active, discoverable
        member — a suspended, closed, or incomplete profile is rejected with
        `discoverable_profile_required`. A Hook Tonight activation grants NO extra
        Hook allowance; approaching someone still spends a normal 🔥 Hook.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HookTonightActivateRequest"
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "201":
          description: Hook Tonight is active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HookTonightState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The member is not active and discoverable (`discoverable_profile_required`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/HookTonightNotConfigured"
        "422":
          description: The requested `intent` is not supported (`invalid_intent`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deactivateHookTonight
      tags: [Hook Tonight]
      summary: Deactivate Hook Tonight availability
      description: |
        Turns Hook Tonight off; the member immediately leaves the pool. The normal
        profile, existing Hooks, matches, and conversations are untouched.
        Idempotent — deactivating when already off is a safe no-op.
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "204":
          description: Hook Tonight is off (or was already off).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: >-
            The resolved database brand has no production contract
            (`brand_not_configured`). Registered production brands may always
            clear Hook Tonight state even when the capability is disabled.
  /api/v1/hook_tonight/discovery:
    get:
      operationId: getHookTonightDiscovery
      tags: [Hook Tonight]
      summary: Get a page of members who are available tonight
      description: |
        The exact same eligible, ranked discovery population as `GET
        /api/v1/discovery` — identical brand isolation, active/visible lifecycle,
        blocking (either direction), reciprocal age/gender/preference, distance,
        exclusions (including live Hooks), facet filters, safe photos, and
        pagination — narrowed to members who currently have a live Hook Tonight
        availability. Each profile carries the same viewer-relative `hook_state`,
        so the client renders the correct 🔥 Hook action; approaching still goes
        through the existing Hook endpoints. This endpoint is permanently bound
        to the configured Hook Tonight restricted-pool surface; clients cannot
        redirect it to another Discovery mode. `vibe`, `online`, `cursor`, and
        `limit` use the shared configured Discovery machinery.

        Access is **reciprocal**: the viewer must have a live Hook Tonight
        activation to see the pool (to browse who's available tonight you must be
        available tonight). A viewer without one gets 403 `hook_tonight_required`;
        activate via `POST /api/v1/hook_tonight` first. Normal discovery
        (`GET /api/v1/discovery`) is unaffected and open to any eligible member.
      parameters:
        - $ref: "#/components/parameters/DiscoveryVibe"
        - $ref: "#/components/parameters/DiscoveryOnline"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Available-tonight profiles and an opaque next cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            The viewer is not active and discoverable
            (`discoverable_profile_required`), or has no live Hook Tonight
            activation (`hook_tonight_required`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/HookTonightNotConfigured"
        "422":
          $ref: "#/components/responses/InvalidInput"
  /api/v1/blocks:
    get:
      operationId: listBlockedProfiles
      tags: [Trust]
      summary: List the profiles the current member has blocked
      description: |
        Returns only outgoing blocks (blocker is the current member), newest
        first, for the Settings / Safety "Blocked users" surface. Blocks whose
        target account was since removed are omitted. Each entry exposes the
        minimum profile information needed to recognise and unblock the target.
      responses:
        "200":
          description: The current member's blocked profiles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockedProfilesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProfileOrMembershipRequired"
  /api/v1/profiles/{profile_id}/block:
    post:
      operationId: blockProfile
      tags: [Trust]
      summary: Idempotently block a current-brand profile
      description: |
        Blocking applies in either direction for discovery, interactions, match lists,
        and conversation access. It removes existing likes and ends an active match.
      parameters:
        - $ref: "#/components/parameters/PublicProfileId"
      responses:
        "200":
          description: The directional block already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockResponse"
        "201":
          description: The directional block was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProfileOrMembershipRequired"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: unblockProfile
      tags: [Trust]
      summary: Idempotently remove the current profile's directional block
      description: |
        Unknown, cross-brand, self, and soft-deleted targets receive the same no-content
        response. Unblocking does not restore likes or reactivate an ended match.
      parameters:
        - $ref: "#/components/parameters/PublicProfileId"
      responses:
        "204":
          description: The request completed without disclosing target or block state.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProfileOrMembershipRequired"
  /api/v1/reports:
    post:
      operationId: fileReport
      tags: [Trust]
      summary: File a safety report against a profile or a specific piece of content
      description: |
        Content-level reporting foundation. The reporter is always the
        authenticated current-brand member (never the body); the target is
        identified by an opaque public id and the responsible profile is derived
        server-side from it. Supported targets: a `profile`, a chat `message`
        (reportable by a conversation participant, and still reportable after the
        sender is blocked/suspended/closed), a `profile_media` photo (reportable
        while the owner is visible to the viewer), a `hook` opener (reportable by
        its recipient), and a `conversation` (reportable by either participant,
        for pattern-level harm across several messages; works identically for a
        Match-origin or an accepted-Opener-origin conversation).

        Message evidence snapshots only the reported message. Conversation
        evidence snapshots a bounded window of the most recent messages that
        existed at report time — never the full history. Filing a report never
        blocks, unmatches, or hides the conversation; those are separate actions.

        Idempotent per open (reporter, target): a repeat returns `created: false`.
        Distinct content from the same person can each be reported. Unknown,
        inaccessible, and cross-brand targets all share the neutral
        `target_unavailable` (404) response so nothing is enumerable. The response
        reveals only that the report was received.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileReportRequest"
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: An open report from this reporter against this target already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileReportResponse"
        "201":
          description: The report was filed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileReportResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProfileOrMembershipRequired"
        "404":
          description: |
            The target is unknown, inaccessible to the reporter, or belongs to
            another brand — returned neutrally as `target_unavailable`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: |
            Malformed input — an unknown `reason` (`invalid_reason`) or unknown
            `target_type` (`invalid_target_type`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/profiles/{profile_id}/report:
    post:
      operationId: reportProfile
      tags: [Trust]
      summary: File a safety report against a current-brand profile
      description: |
        Reporting is independent of blocking and does not change the target's
        visibility, moderation status, or photo processing — it records an audit
        signal for administrative review. It is idempotent per open report: while
        an earlier report from the same reporter against the same target is still
        open, repeat submissions return `created: false` and do not stack.
        Unknown, cross-brand, and self targets share the `profile_unavailable`
        (404) response so target existence is never disclosed.
      parameters:
        - $ref: "#/components/parameters/PublicProfileId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportRequest"
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: An open report from this reporter against this target already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResponse"
        "201":
          description: The report was filed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProfileOrMembershipRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/matches:
    get:
      operationId: listMatches
      tags: [Matching]
      summary: List current live matches
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Live matches and an opaque next cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InteractionForbidden"
        "404":
          description: >-
            The resolved database brand has no production contract
            (`brand_not_configured`), or matching is disabled by its contract
            (`matching_not_configured`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/InvalidInput"
  /api/v1/matches/{match_id}/unmatch:
    post:
      operationId: unmatchProfile
      tags: [Matching]
      summary: End an active Match without blocking the other member
      description: |
        Distinct from Trust's block endpoints: Unmatch ends the relationship
        (transitions the Match to its ended state and discards active Likes in
        both directions) but never creates a ProfileBlock — the pair remains
        free to encounter, like, and rematch each other later through normal
        discovery/Find/Likes surfaces. Block remains the separate, stronger
        safety action and is unaffected by this endpoint.

        Idempotent: unmatching an already-ended Match (whether ended by a
        prior Unmatch or by a Block) is a safe no-op and still returns 204.
        Only a current participant may unmatch; unknown, cross-brand, and
        non-participant match ids all receive the same `match_unavailable`
        response so nothing about the relationship is enumerable.

        The conversation and its message history are not deleted. New
        messages can no longer be sent or read through the ended Match (this
        is already enforced by the existing Messaging authorization that
        every conversation/message endpoint shares), but the conversation's
        card continues to appear in `GET /api/v1/conversations` as read-only
        history, exactly as it already does when a Match ends for any other
        reason.
      parameters:
        - $ref: "#/components/parameters/PublicMatchId"
      responses:
        "204":
          description: >-
            The Match is now ended (or already was). No Block was created.
            Likes between the pair were discarded.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            The authenticated profile is not currently a valid match member
            (matches `GET /api/v1/matches`'s handling of the same underlying
            check).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: >-
            The resolved database brand has no production contract
            (`brand_not_configured`), unmatching is disabled by its contract
            (`matching_not_configured`), or the Match is unknown, cross-brand,
            or does not include the current profile (`match_unavailable`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/conversations:
    get:
      operationId: listConversations
      tags: [Messaging]
      summary: List conversations for the current brand profile
      description: |
        Participant-scoped conversation cards, newest-first, each with a preview of
        its latest message (or null). Read the full history via the per-conversation
        messages endpoint.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Participant-scoped conversations and an opaque next cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InteractionForbidden"
        "404":
          description: >-
            The resolved database brand has no production contract
            (`brand_not_configured`), or messaging is disabled by its contract
            (`messaging_not_configured`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/InvalidInput"
  /api/v1/matches/{match_id}/conversation:
    post:
      operationId: startConversation
      tags: [Messaging]
      summary: Idempotently open the conversation for a live match
      parameters:
        - $ref: "#/components/parameters/PublicMatchId"
      responses:
        "200":
          description: Existing conversation returned idempotently.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartConversationResponse"
        "201":
          description: Conversation and both profile participants created atomically.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartConversationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InteractionForbidden"
        "404":
          description: >-
            The resolved database brand has no production contract
            (`brand_not_configured`), messaging is disabled by its contract
            (`messaging_not_configured`), or the Match is unavailable,
            cross-brand, or does not include the current profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/conversations/{conversation_id}/messages:
    get:
      operationId: listMessages
      tags: [Messaging]
      summary: List a conversation's messages, newest first
      description: |
        Participant-scoped, cursor-paginated plain-text message history for one
        conversation, ordered newest-first by (created_at, id). Only the two
        conversation participants may read. Unknown, cross-brand, non-participant,
        ended, unavailable (suspended/deleted participant), and blocked
        conversations all return the same neutral 404 `conversation_unavailable`;
        the block is never disclosed. History is always bounded by `limit`; page
        backward into older messages with `next_cursor`. A message cursor is bound
        to its brand, viewer, and conversation and cannot be replayed elsewhere.
      parameters:
        - $ref: "#/components/parameters/PublicConversationId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/MessageLimit"
      responses:
        "200":
          description: A page of messages, newest first, and an opaque next cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InteractionForbidden"
        "404":
          description: >-
            The resolved database brand has no production contract
            (`brand_not_configured`), messaging is disabled by its contract
            (`messaging_not_configured`), or the Conversation is unavailable,
            cross-brand, ended, blocked, or not the current profile's.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/InvalidInput"
    post:
      operationId: sendMessage
      tags: [Messaging]
      summary: Send a plain-text message to a conversation
      description: |
        Appends one plain-text message after re-authorizing the sender
        (participant, active match, both participants available, neither side
        blocking the other). The body is treated as untrusted input, NFC-normalized,
        and must be non-blank and at most 2000 characters; Unicode/emoji is
        preserved. Content never enters logs. Beta accepts at-least-once client
        sends (no idempotency key), so a retried request creates a second message.
      parameters:
        - $ref: "#/components/parameters/PublicConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "201":
          description: The message was persisted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendMessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InteractionForbidden"
        "404":
          description: >-
            The resolved database brand has no production contract
            (`brand_not_configured`), messaging is disabled by its contract
            (`messaging_not_configured`), or the Conversation is unavailable,
            cross-brand, ended, blocked, or not the current profile's.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >-
            Body and attachments are both absent (`message_blank`), body is too
            long (`message_too_long`), too many attachments
            (`too_many_attachments`), or an attachment reference is invalid
            (`invalid_media_kind`, `upload_already_used`, `upload_not_found`,
            `invalid_attachment`, `invalid_attachment_upload`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/conversations/{conversation_id}/attachments/uploads:
    post:
      operationId: createMessageAttachmentUpload
      tags: [Messaging]
      summary: Request a direct-to-R2 upload authorization for a chat image or video (D8N Chat Media)
      description: |
        Control-plane step of the direct-to-R2 upload for a chat attachment.
        Authorizes the caller through the same participant/active-match/
        availability/block gate as sending a message itself. Declare
        `media_kind`, `content_type`, `byte_size`, and a base64 MD5 `checksum`;
        D8N allocates the object identity and returns a short-lived presigned
        `PUT` `url` plus the exact `headers` to send with it. Upload the bytes
        directly to that URL, then reference the returned `signed_id` in
        `attachment_uploads` on `POST /conversations/{conversation_id}/messages`
        — attach and send are the same operation, there is no separate finalize
        endpoint. The client never receives R2 credentials or chooses the
        object key. A video's `byte_size_limit` is a technical abuse ceiling
        (storage/bandwidth/worker protection), not a product-facing video
        length/size limit.
      parameters:
        - $ref: "#/components/parameters/PublicConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMessageAttachmentUploadRequest"
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "201":
          description: Short-lived upload authorization.
          content:
            application/json:
              schema:
                type: object
                required: [upload]
                properties:
                  upload:
                    $ref: "#/components/schemas/MessageAttachmentUpload"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InteractionForbidden"
        "404":
          description: >-
            The resolved database brand has no production contract
            (`brand_not_configured`), D8N Chat Media is disabled by its contract
            (`messaging_not_configured`), or the conversation is unavailable,
            cross-brand, ended, blocked, or not the current profile's.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >-
            Missing/invalid upload parameters (`upload_parameters_required`),
            unknown `media_kind` (`invalid_media_kind`), unsupported
            `content_type` for that media kind (`unsupported_content_type`),
            `byte_size` beyond the technical ceiling (`invalid_byte_size`), or
            a missing checksum (`checksum_required`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/conversations/{conversation_id}/messages/{message_id}/attachments/{id}:
    delete:
      operationId: deleteMessageAttachment
      tags: [Messaging]
      summary: Delete an attachment the caller sent, for everyone (D8N Chat Media)
      description: |
        "Delete for everyone" at attachment granularity — only the specific
        attachment is removed; the message and any other attachments/body are
        unaffected. Only the message's sender may delete; a recipient cannot
        remove another profile's media. Once deleted, no further `view_url`,
        `download_url`, or `poster_url` is issued for this attachment (it is
        shown with `deleted: true`), and the underlying R2 object(s) are purged
        as soon as Active Storage's purge queue runs. This is deliberately
        NOT reachable once the conversation itself is unavailable (unmatch,
        block, suspension) — attachment access always follows the same
        participant/active-match gate as the rest of messaging, so there is no
        path to fetch or delete an attachment after messaging access ends.
      parameters:
        - $ref: "#/components/parameters/PublicConversationId"
        - $ref: "#/components/parameters/PublicMessageId"
        - $ref: "#/components/parameters/PublicAttachmentId"
      responses:
        "200":
          description: The attachment was deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteMessageAttachmentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InteractionForbidden"
        "404":
          description: >-
            The conversation, message, or attachment is unavailable
            (`conversation_unavailable`, `message_unavailable`,
            `attachment_unavailable`), or the caller did not send it
            (`attachment_not_owned`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/notifications:
    get:
      operationId: listNotifications
      tags: [Notifications]
      summary: List the current member's brand-scoped product notifications
      description: |
        Returns at most 50 newest-first notifications for the authenticated user
        and active membership in the host-resolved brand. The same D8N identity's
        notifications in another brand are never returned. Presentation-safe copy
        is derived from the stable notification type; provider, recipient, device,
        delivery-attempt, and internal database fields are never exposed.
      responses:
        "200":
          description: The current brand inbox and unread count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/notifications/read_all:
    post:
      operationId: markAllNotificationsRead
      tags: [Notifications]
      summary: Mark every current-brand notification read
      responses:
        "200":
          description: Number of notifications newly marked read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarkAllNotificationsReadResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [Notifications]
      summary: Mark one current-brand notification read
      description: Unknown and cross-brand notification ids return the same neutral 404.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The notification with its read timestamp.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Notification is unknown or belongs to another brand/member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/notifications/preferences:
    get:
      operationId: showNotificationPreferences
      tags: [Notifications]
      summary: Effective notification delivery preferences for the current brand membership
      description: |
        Returns the authenticated member's current DateZA/HookUs product
        notification delivery preferences, scoped to their brand membership in
        the host-resolved brand — the same D8N identity's preferences in
        another brand are entirely independent rows. If no preference row has
        been saved yet (or the current brand membership is not active), this
        returns the same effective defaults `Notifications::Policy` already
        applies when deciding delivery — both fields default to `true` — never
        an error, and reading never creates a row.

        These two fields only control the *delivery channel* for D8N product
        notifications (in-app is never affected — see
        `GET /api/v1/notifications`). They do not control whether an
        underlying dating event (e.g. `match_created`) exists.
      responses:
        "200":
          description: Effective current preferences (persisted or default).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferencesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: updateNotificationPreferences
      tags: [Notifications]
      summary: Partially update notification delivery preferences
      description: |
        Updates only the fields provided; omitted fields are left unchanged.
        Both fields must be real JSON booleans — a string like `"true"` is
        rejected, not coerced. Unknown keys are rejected rather than silently
        accepted, since a UI toggle must correspond to real backend behaviour
        (there is currently no generic product SMS or WhatsApp delivery to
        control — see the T4/T5 implementation reports).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationPreferencesUpdate"
      responses:
        "200":
          description: The preferences after applying the update.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferencesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The current brand membership does not exist (no membership to attach preferences to).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: An unknown preference key was supplied, or a value was not a JSON boolean.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/profile_photos:
    get:
      operationId: listAdminProfilePhotoQueue
      tags: [Trust]
      summary: List the profile photo moderation review queue for the current brand
      description: |
        Requires verified admin MFA and `admin.profile_photos.moderate`.
        Returns every kept, still-undecided
        (pending_review) profile photo for the request's brand, oldest-first
        by (created_at, id), bounded to 100 entries. This is the discovery
        path a moderator needs to find photos awaiting a decision before
        calling PATCH /api/v1/admin/profile_photos/{id} — required for any
        brand configured moderate-first (see the DateZA media policy).
        Approved and rejected photos never appear here. Cross-brand photos are
        simply absent, never disclosed.
      responses:
        "200":
          description: The current moderation queue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProfilePhotoQueueResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
  /api/v1/admin/profile_photos/{id}:
    patch:
      operationId: moderateProfilePhoto
      tags: [Trust]
      summary: Apply a terminal moderation decision to a pending profile photo
      description: |
        Requires verified admin MFA and `admin.profile_photos.moderate` on the
        request brand.
        The opaque photo UUID is resolved only inside that brand. Approval makes
        the placement visible; rejection makes it hidden and independently
        non-deliverable. Repeating the same terminal decision is idempotent;
        attempting the opposite terminal decision returns a conflict. Every real
        transition is audited without media bytes, URLs, keys, or free-form notes.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [approved, rejected]
      responses:
        "200":
          description: Current terminal state and whether this request performed the transition.
          content:
            application/json:
              schema:
                type: object
                required: [photo, transitioned]
                properties:
                  transitioned:
                    type: boolean
                  photo:
                    $ref: "#/components/schemas/AdminProfilePhotoModeration"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The photo already has the opposite terminal decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/admin/reports:
    get:
      operationId: listReports
      tags: [Admin]
      summary: List the moderation queue for the current brand
      description: |
        Requires verified admin MFA and `admin.reports.read`. Returns reports for the request's brand
        (resolved from the host — a brand id is never accepted from the client),
        oldest-first by (created_at, id) so the longest-waiting reports surface
        first, cursor-paginated and bounded. Access requires an active AdminUser
        with an active assignment for this brand: unauthenticated callers get 401,
        ordinary users and admins assigned elsewhere get 403. Cross-brand reports
        are simply absent, never disclosed.
      parameters:
        - $ref: "#/components/parameters/ReportStatusFilter"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/AdminReportLimit"
      responses:
        "200":
          description: A page of reports and an opaque next cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminReportListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "422":
          $ref: "#/components/responses/InvalidInput"
  /api/v1/admin/reports/{id}:
    get:
      operationId: getReport
      tags: [Admin]
      summary: Inspect one report
      description: |
        Requires verified admin MFA and `admin.reports.read`. The read is audited (a sensitive-read
        SecurityEvent is recorded). Unknown and cross-brand ids share the neutral
        `report_unavailable` (404). Only moderator-relevant fields are returned;
        no credentials, sessions, email/phone, private location, or media.
      parameters:
        - $ref: "#/components/parameters/ReportId"
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminReportResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "404":
          description: Report is unknown or belongs to another brand.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateReport
      tags: [Admin]
      summary: Apply a moderation lifecycle transition
      description: |
        Requires verified admin MFA and `admin.reports.moderate`. Applies one lifecycle transition and records the
        decision (audited; `reviewed_by`/`reviewed_at`/`resolution_note` set). Only
        `status` and an optional short `note` are accepted; report internals
        (reporter, target, brand, reason, timestamps) can never be mass-assigned.
        Transitions: `open → reviewing | dismissed`, `reviewing → actioned |
        dismissed | open`. `actioned`/`dismissed` are terminal. `actioned` means
        "resolved as warranting action" — it does NOT suspend or ban the account;
        account enforcement is a separate capability (TS-04). A disallowed target
        from a non-terminal state is `invalid_transition` (422); a transition out of
        a terminal state (e.g. another moderator already resolved it) is
        `report_conflict` (409).
      parameters:
        - $ref: "#/components/parameters/ReportId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReportRequest"
      responses:
        "200":
          description: The updated report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminReportResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "404":
          description: Report is unknown or belongs to another brand.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The report is already in a terminal state (`report_conflict`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Invalid `status`, `invalid_transition`, or an oversized `note`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/profiles/{profile_id}/suspension:
    post:
      operationId: suspendProfile
      tags: [Admin]
      summary: Apply a brand-level suspension to a profile's owner
      description: |
        Requires verified admin MFA and `admin.enforcements.manage`. Brand-level enforcement: suspends the target's
        membership in this brand, revokes all of their sessions for this brand, and
        records an audited, reversible `AccountEnforcement`. Everything happens in
        one transaction. The target's network identity and any other-brand access
        are untouched (platform-wide bans are not modelled yet). Enforcement is
        deliberately separate from the report lifecycle: an optional `report_id`
        links the cause without changing that report's status. Idempotent-by-
        conflict: a second suspension of an already-suspended user returns 409
        `already_suspended`. Cross-brand/unknown targets return neutral
        `profile_unavailable` (404).
      parameters:
        - $ref: "#/components/parameters/PublicProfileId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuspendProfileRequest"
      responses:
        "201":
          description: The suspension was applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEnforcementResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "404":
          description: Target is unknown or belongs to another brand (`profile_unavailable`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The target is already suspended (`already_suspended`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: An unknown `report_id` (`invalid_report`) or an oversized `reason`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: reinstateProfile
      tags: [Admin]
      summary: Lift a brand-level suspension
      description: |
        Requires verified admin MFA and `admin.enforcements.manage`. Reactivates the membership and marks the
        enforcement reverted, audited, in one transaction. Restores ONLY what
        suspension changed — it does not revive revoked sessions (the user logs in
        again), ended matches, blocks, or deleted data. Reinstating a profile that
        is not suspended returns 409 `not_suspended`.
      parameters:
        - $ref: "#/components/parameters/PublicProfileId"
      responses:
        "200":
          description: The suspension was lifted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEnforcementResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "404":
          description: Target is unknown or belongs to another brand (`profile_unavailable`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The target is not currently suspended (`not_suspended`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/hq/operator:
    get:
      operationId: getCurrentHqOperator
      tags: [Hq]
      summary: Resolve the current operator, capabilities, assignments, and MFA state
      description: |
        Available after ordinary authentication and a current-brand admin
        assignment; MFA step-up is not required for this bootstrap response.
        `effective_capabilities`, never the role label, is authoritative for UI
        affordances. Other brand assignments are informational switcher targets;

  /api/v1/hq/members/{lookup}/discovery_diagnostic:
    get:
      operationId: getMemberDiscoveryDiagnostic
      tags: [Hq]
      summary: "\"Why is Discover empty for this member?\" read-only funnel diagnostic"
      description: |
        Requires verified admin MFA and `hq.discovery_diagnostics.read`;
        brand-scoped. Requires the member to have a
        profile (`profile_unavailable` 404 otherwise). Re-runs the live
        discovery engine's own eligibility stages (Matching::VisibilityScope,
        Matching::EligibilityScope, Matching::ExclusionsScope) read-only,
        reporting a candidate count at each stage — it never mutates
        `DiscoveryAllocation`/`DiscoveryAllocationCandidate` and never consumes
        the member's normal daily discovery quota. When the member themselves
        is not currently eligible to see discovery at all (incomplete profile,
        suspended, etc.), `eligible: false` is returned with a reason and no
        stages, instead of an error. The read is audited
        (`hq.member_discovery_diagnostic_viewed`).
      parameters:
        - $ref: "#/components/parameters/HqLookup"
      responses:
        "200":
          description: Eligibility and, if eligible, a stage-by-stage candidate-count breakdown.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HqDiscoveryDiagnosticResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "404":
          description: No member matches `lookup`, or the member has no profile yet (`member_unavailable` / `profile_unavailable`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Opaque brand-bound D8N session token.
    cookieAuth:
      type: apiKey
      in: cookie
      name: d8n_web_session
      description: Host-only HttpOnly brand-bound browser session credential.
  parameters:
    DiscoveryMode:
      name: mode
      in: query
      required: false
      description: |
        Discovery feed selector. Omitted or `for_you` returns the default
        compatibility-ranked feed; `new_here` returns the newest eligible
        profiles first. Eligibility is identical across modes. An unsupported
        value returns 422 `invalid_mode`.
      schema:
        type: string
        enum: [for_you, new_here]
        default: for_you
    DiscoveryVibe:
      name: vibe
      in: query
      required: false
      description: |
        Optional facet filter: a public "vibes" option code (e.g.
        `420_friendly`). Narrows the feed to profiles that selected it, on top of
        the normal eligibility rules, and combines with any `mode`. An
        unsupported value returns 422 `invalid_filter`.
      schema:
        type: string
    DiscoveryOnline:
      name: online
      in: query
      required: false
      description: |
        Optional "online now" facet. When `true`, narrows the feed to profiles
        whose user has been active in the last 10 minutes. Combines with `mode`
        and `vibe`.
      schema:
        type: boolean
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque signed cursor returned by the same endpoint and brand.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    FindCursor:
      name: cursor
      in: query
      required: false
      description: Opaque signed cursor bound to the brand, membership, policy, and filters.
      schema:
        type: string
    FindLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 10
        default: 10
    FindMinAge:
      name: min_age
      in: query
      required: false
      schema:
        type: integer
        minimum: 18
        maximum: 120
    FindMaxAge:
      name: max_age
      in: query
      required: false
      schema:
        type: integer
        minimum: 18
        maximum: 120
    FindMaxDistance:
      name: max_distance_km
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
    FindRelationshipIntent:
      name: relationship_intent
      in: query
      required: false
      description: Active DateZA relationship-intent option code; narrows eligible candidates.
      schema:
        type: string
    PublicProfileId:
      name: profile_id
      in: path
      required: true
      description: Stable public profile UUID from discovery.
      schema:
        type: string
        format: uuid
    PhotoId:
      name: id
      in: path
      required: true
      description: Owner photo record ID.
      schema:
        type: integer
    PublicMatchId:
      name: match_id
      in: path
      required: true
      description: Stable public match UUID from the match list.
      schema:
        type: string
        format: uuid
    PublicConversationId:
      name: conversation_id
      in: path
      required: true
      description: Stable public conversation UUID from the conversation list or start-conversation response.
      schema:
        type: string
        format: uuid
    PublicMessageId:
      name: message_id
      in: path
      required: true
      description: Stable public message UUID from a message list/send response.
      schema:
        type: string
        format: uuid
    PublicAttachmentId:
      name: id
      in: path
      required: true
      description: Stable public message-attachment UUID from a message's `attachments` array.
      schema:
        type: string
        format: uuid
    MessageLimit:
      name: limit
      in: query
      required: false
      description: Page size for message history.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 30
    HookId:
      name: hook_id
      in: path
      required: true
      description: Stable public Hook UUID from the received-Hooks inbox.
      schema:
        type: string
        format: uuid
    HookLimit:
      name: limit
      in: query
      required: false
      description: Page size for the received-Hooks inbox.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    OpenerId:
      name: opener_id
      in: path
      required: true
      description: Stable public D8N Opener UUID from the received-openers inbox.
      schema:
        type: string
        format: uuid
    OpenerLimit:
      name: limit
      in: query
      required: false
      description: Page size for the received-openers inbox.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    ReportId:
      name: id
      in: path
      required: true
      description: Internal report id (admin-only; scoped to the moderator's brand).
      schema:
        type: integer
    ReportStatusFilter:
      name: status
      in: query
      required: false
      description: Narrow the queue to one lifecycle status. Unknown values return 422 `invalid_filter`.
      schema:
        type: string
        enum: [open, reviewing, actioned, dismissed]
    AdminReportLimit:
      name: limit
      in: query
      required: false
      description: Page size for the moderation queue.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    HqLookup:
      name: lookup
      in: path
      required: true
      description: An email, a phone number, or a profile `public_id` UUID. Resolved only within the request's brand.
      schema:
        type: string
    HqHistoryLimit:
      name: limit
      in: query
      required: false
      description: Page size for an HQ member-history sub-resource.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    HqRepeatOffenderLimit:
      name: limit
      in: query
      required: false
      description: "Maximum repeat-offender rows returned. The response reports `truncated: true` when more rows exist."
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    HqEnforcementStateFilter:
      name: state
      in: query
      required: false
      description: Restrict brand-wide enforcement history to active or reverted rows.
      schema:
        type: string
        enum: [active, reverted]
  responses:
    Unauthorized:
      description: Missing, invalid, expired, revoked, or wrong-brand session. Cookie bootstrap may return `session_expired` or `session_revoked`; other cases return `unauthorized`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    CsrfRejected:
      description: Cookie-authenticated unsafe request omitted or supplied an invalid `X-CSRF-Token` (`csrf_token_invalid`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InteractionForbidden:
      description: >-
        For a published DateZA member, the identifier attached to the current
        login session has not been verified (`identifier_verification_required`).
        Existing profile, membership, and lifecycle authorization errors remain
        distinct. This DateZA-only rule does not change HookUs authorization.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    HookNotConfigured:
      description: >-
        The resolved database brand has no production contract
        (`brand_not_configured`), or Hook is disabled by its contract
        (`hook_not_configured`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    OpenerNotConfigured:
      description: >-
        The resolved database brand has no production contract
        (`brand_not_configured`), or D8N Opener is disabled by its contract
        (`opener_not_configured`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    HookTonightNotConfigured:
      description: >-
        The resolved database brand has no production contract
        (`brand_not_configured`), or Hook Tonight is disabled by its contract
        (`hook_tonight_not_configured`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AdminForbidden:
      description: |
        Administrative access denied. `forbidden` means there is no active
        current-brand assignment or required effective capability (including
        revoked access). `admin_mfa_required` means the assignment/capability is
        valid but this ordinary session has not completed backend MFA step-up.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AdminMfaRateLimited:
      description: Too many recent admin MFA failures (`admin_mfa_rate_limited`).
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds before another MFA proof may be attempted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BrandRequired:
      description: Request host did not resolve to an active brand.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AuthMethodUnavailable:
      description: Request host did not resolve to an active brand, or this authentication method is disabled.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: >-
        Rate limit exceeded (`rate_limited`). Returned by authentication throttles
        and by the generic abuse-protection layer on write/read surfaces
        (messaging, likes, passes, reports, media uploads, profile writes,
        discovery, Hook Tonight). The 🔥 Hook send endpoint has its own distinct
        product limit (`hook_rate_limited`) and is documented separately.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds before another request should be attempted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ProfileOrMembershipRequired:
      description: Required brand membership/profile/lifecycle state is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InvalidInput:
      description: Request input, cursor, or limit is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationFailed:
      description: Validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"
    ProfileValidationFailed:
      description: >-
        Profile values failed validation (`invalid_profile`), or the request
        submitted known D8N profile fields that the resolved brand has not
        enabled (`invalid_profile_fields`).
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/ValidationError"
              - $ref: "#/components/schemas/InvalidProfileFields"
    NotFound:
      description: Resource is unavailable, including cross-brand resources.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InteractionConflict:
      description: Interaction conflicts with the current participant state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthResponse:
      type: object
      required: [status, app, api_version, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        app:
          const: d8n
        api_version:
          const: v1
        checks:
          type: object
          required: [primary_database, queue_database]
          properties:
            primary_database:
              type: string
              enum: [ok, unavailable]
            queue_database:
              type: string
              enum: [ok, unavailable]
    VersionResponse:
      type: object
      required:
        [app, git_sha, release, image_version, environment,
         rails_environment, build_timestamp, booted_at]
      properties:
        app:
          const: d8n
        git_sha:
          type: [string, "null"]
          pattern: "^[0-9a-fA-F]{40}$"
        release:
          type: [string, "null"]
          description: Kamal image version when present, otherwise the immutable git SHA.
        image_version:
          type: [string, "null"]
          description: Runtime `KAMAL_VERSION`; may be a deployment alias, so use `git_sha` for source identity.
        environment:
          type: string
          description: D8N deployment environment such as staging or production.
        rails_environment:
          type: string
        build_timestamp:
          type: [string, "null"]
          format: date-time
        booted_at:
          type: string
          format: date-time
    HqOperatorRole:
      type: string
      enum:
        [founder, super_admin, operations, trust_safety, support,
         engineering, marketing, analyst, moderator]
    HqCapability:
      type: string
      enum:
        - hq.member.sensitive_read
        - hq.member.security_read
        - hq.discovery_diagnostics.read
        - hq.trust_safety.read
        - admin.reports.read
        - admin.reports.moderate
        - admin.enforcements.manage
        - admin.profile_photos.moderate
        - admin.operators.read
        - admin.operators.manage
        - admin.brand_operations.manage
        - hq.system.read
        - hq.analytics.read
    HqOperatorAssignment:
      type: object
      required: [brand, role, effective_capabilities]
      properties:
        brand:
          type: string
        role:
          $ref: "#/components/schemas/HqOperatorRole"
        effective_capabilities:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/HqCapability"
    HqMfaState:
      type: object
      required: [state, required, verified, recovery_codes_remaining]
      properties:
        state:
          type: string
          enum: [not_enrolled, pending, active]
        required:
          const: true
        verified:
          type: boolean
          description: True only when this exact session completed step-up against the current active credential.
        recovery_codes_remaining:
          type: [integer, "null"]
          minimum: 0
    HqCurrentOperatorResponse:
      type: object
      required: [operator]
      properties:
        operator:
          type: object
          required:
            [admin_user_id, user_id, status, current_brand, role,
             effective_capabilities, grantable_roles, brand_assignments, mfa]
          properties:
            admin_user_id:
              type: integer
            user_id:
              type: integer
            status:
              type: string
              enum: [active, suspended, disabled]
            current_brand:
              type: string
            role:
              $ref: "#/components/schemas/HqOperatorRole"
            effective_capabilities:
              type: array
              uniqueItems: true
              items:
                $ref: "#/components/schemas/HqCapability"
            grantable_roles:
              type: array
              uniqueItems: true
              description: Server-authoritative roles this actor may grant; Founder itself is never returned.
              items:
                $ref: "#/components/schemas/HqOperatorRole"
            brand_assignments:
              type: array
              items:
                $ref: "#/components/schemas/HqOperatorAssignment"
            mfa:
              $ref: "#/components/schemas/HqMfaState"
    HqOperator:
      type: object
      required:
        [admin_user_id, user_id, admin_status, assignment_status, role,
         effective_capabilities, mfa_enrolled]
      properties:
        admin_user_id:
          type: integer
        user_id:
          type: integer
        admin_status:
          type: string
          enum: [active, suspended, disabled]
        assignment_status:
          type: string
          enum: [active, suspended, revoked]
        role:
          $ref: "#/components/schemas/HqOperatorRole"
        effective_capabilities:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/HqCapability"
        mfa_enrolled:
          type: boolean
    HqOperatorResponse:
      type: object
      required: [operator]
      properties:
        operator:
          $ref: "#/components/schemas/HqOperator"
    HqOperatorListResponse:
      type: object
      required: [operators]
      properties:
        operators:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/HqOperator"
    HqCreateOperatorRequest:
      type: object
      required: [email, role]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          description: Existing verified D8N identity with an active membership on the current brand.
        role:
          $ref: "#/components/schemas/HqOperatorRole"
    HqUpdateOperatorRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        role:
          $ref: "#/components/schemas/HqOperatorRole"
        status:
          type: string
          enum: [active, suspended, revoked]
    HqMfaCodeRequest:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code:
          type: string
          description: Six-digit TOTP or one-time recovery code. Never logged or audited.
    HqMfaEnrollmentResponse:
      type: object
      required: [mfa]
      properties:
        mfa:
          type: object
          required: [state, secret, provisioning_uri]
          properties:
            state:
              const: pending
            secret:
              type: string
              description: Enrollment-only Base32 secret; display once and never persist in frontend storage/logs.
            provisioning_uri:
              type: string
              format: uri
    HqMfaConfirmationResponse:
      type: object
      required: [mfa, recovery_codes]
      properties:
        mfa:
          type: object
          required: [state, verified]
          properties:
            state:
              const: active
            verified:
              const: true
        recovery_codes:
          type: array
          minItems: 8
          maxItems: 8
          description: Returned once; prompt the operator to store these offline.
          items:
            type: string
    HqMfaChallengeResponse:
      type: object
      required: [mfa]
      properties:
        mfa:
          type: object
          required: [state, verified, method, recovery_codes_remaining]
          properties:
            state:
              const: active
            verified:
              const: true
            method:
              type: string
              enum: [totp, recovery_code]
            recovery_codes_remaining:
              type: integer
              minimum: 0
    HqMfaStateResponse:
      type: object
      required: [mfa]
      properties:
        mfa:
          type: object
          required: [state, verified]
          properties:
            state:
              const: not_enrolled
            verified:
              const: false
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    ValidationError:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          required: [details]
          properties:
            details:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
    InvalidProfileFields:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          required: [details]
          properties:
            error:
              const: invalid_profile_fields
            details:
              type: object
              required: [fields]
              properties:
                fields:
                  type: array
                  items:
                    type: string
    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
    BrandSummary:
      type: object
      required: [slug, name]
      properties:
        slug:
          type: string
        name:
          type: string
    AuthMethodsResponse:
      type: object
      required: [brand, methods]
      properties:
        brand:
          $ref: "#/components/schemas/BrandSummary"
        methods:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [phone_password, email_password, google]
    IdentifierVerificationRequest:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [phone, email]
    VerificationDeliveryResponse:
      type: object
      required: [message, resend_available_in, expires_at]
      properties:
        message:
          type: string
        resend_available_in:
          type: integer
          minimum: 0
          description: Server-owned seconds until another code request is eligible.
        expires_at:
          type: [string, "null"]
          format: date-time
          description: Server-authoritative contact-verification expiry; null for the generic no-delivery response.
    SessionIdentifierVerification:
      type: object
      required: [kind, verified, masked_destination]
      properties:
        kind:
          type: string
          enum: [phone, email]
        verified:
          type: boolean
        masked_destination:
          type: string
          description: Safe display form of the current session credential identifier; never the raw value.
    VerificationDispatchState:
      type: object
      required: [code_dispatched, resend_available_in, expires_at]
      properties:
        code_dispatched:
          type: boolean
          description: True only while a usable verification challenge is queued or confirmed sent.
        resend_available_in:
          type: integer
          minimum: 0
          description: Server-owned seconds until another code request is eligible.
        expires_at:
          type: [string, "null"]
          format: date-time
          description: Expiry of the usable contact-verification code (one hour after issue), or null when none was dispatched.
    PasswordAuthRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          description: International phone number or email address; normalized by the server.
        password:
          type: string
          format: password
          minLength: 6
          description: At least 6 characters and no more than 72 UTF-8 bytes.
        device_name:
          type: [string, "null"]
          maxLength: 120
        session_mode:
          type: string
          enum: [browser]
          description: Omit for bearer mode. Use `browser` for an HttpOnly cookie without a bearer secret in JSON.
    PasswordChangeRequest:
      type: object
      required: [current_password, password, password_confirmation]
      properties:
        current_password:
          type: string
          format: password
        password:
          type: string
          format: password
          minLength: 6
          description: At least 6 characters, no more than 72 UTF-8 bytes, and different from the current password.
        password_confirmation:
          type: string
          format: password
    EmailChangeRequest:
      type: object
      required: [email, current_password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Proposed replacement login email. It is not activated until code confirmation.
        current_password:
          type: string
          format: password
          description: Current password for the email-backed credential used by this session.
    EmailChangeConfirmation:
      type: object
      required: [email, code]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: The same proposed email supplied to the request step.
        code:
          type: string
          pattern: "^[0-9]{6}$"
          description: Single-use code delivered to the proposed email; expires after 10 minutes.
    EmailChangeResponse:
      type: object
      required: [identifier, revoked_session_count]
      properties:
        identifier:
          type: object
          required: [kind, verified]
          properties:
            kind:
              const: email
            verified:
              const: true
        revoked_session_count:
          type: integer
          minimum: 0
          description: Other active sessions revoked because the login identifier changed.
    PasswordRecoveryRequest:
      type: object
      required: [identifier]
      properties:
        identifier:
          type: string
          description: International phone number or email address; normalized by the server.
    PasswordRecoveryVerifyRequest:
      type: object
      required: [identifier, code]
      properties:
        identifier:
          type: string
          description: The same identifier used to request recovery.
        code:
          type: string
          pattern: "^[0-9]{6}$"
          description: The recovery code delivered to the identifier's channel.
    PasswordResetAuthorization:
      type: object
      required: [reset_token, expires_at]
      properties:
        reset_token:
          type: string
          description: Single-use secret authorizing one password reset. Send it only to the reset endpoint.
        expires_at:
          type: string
          format: date-time
          description: When the reset authorization expires (15 minutes after issue).
    PasswordResetRequest:
      type: object
      required: [reset_token, password, password_confirmation]
      properties:
        reset_token:
          type: string
          description: The reset authorization token returned by the verify step.
        password:
          type: string
          format: password
          minLength: 6
          description: At least 6 characters and no more than 72 UTF-8 bytes.
        password_confirmation:
          type: string
          format: password
    IdentifierVerification:
      type: object
      required: [kind, code]
      properties:
        kind:
          type: string
          enum: [phone, email]
        code:
          type: string
          pattern: "^[0-9]{6}$"
    IdentifierVerificationResponse:
      type: object
      required: [identifier]
      properties:
        identifier:
          type: object
          required: [kind, verified]
          properties:
            kind:
              type: string
              enum: [phone, email]
            verified:
              const: true
    AuthSessionResponse:
      type: object
      required: [token, token_type, expires_at, user_id, brand]
      properties:
        token:
          type: string
          description: Secret bearer token returned only when the session is issued.
        token_type:
          const: Bearer
        expires_at:
          type: string
          format: date-time
        user_id:
          type: integer
          description: Private platform identity ID; do not use as a public dating-profile ID.
        brand:
          $ref: "#/components/schemas/BrandSummary"
    PasswordAuthSessionResponse:
      type: object
      required: [expires_at, user_id, brand, identifier, verification_required, verification_channel, verification, onboarding]
      oneOf:
        - required: [token, token_type]
        - required: [browser_session]
      properties:
        token:
          type: string
          description: Present only in default bearer mode; never present in browser mode.
        token_type:
          const: Bearer
        browser_session:
          type: object
          required: [persisted, csrf_token]
          properties:
            persisted:
              const: true
            csrf_token:
              type: string
              description: Send as `X-CSRF-Token` on unsafe cookie-authenticated requests.
        expires_at:
          type: string
          format: date-time
        user_id:
          type: integer
        brand:
          $ref: "#/components/schemas/BrandSummary"
        identifier:
          $ref: "#/components/schemas/SessionIdentifierVerification"
        verification_required:
          type: boolean
        verification_channel:
          type: [string, "null"]
          enum: [phone, email, null]
        verification:
          $ref: "#/components/schemas/VerificationDispatchState"
        onboarding:
          $ref: "#/components/schemas/ProfileOnboardingStatus"
    MeResponse:
      type: object
      required: [user_id, brand, session, identifier, verification_required, verification, account_status, account_controls]
      properties:
        user_id:
          type: integer
        brand:
          $ref: "#/components/schemas/BrandSummary"
        session:
          type: object
          required: [id, expires_at, authentication_mode, csrf_token]
          properties:
            id:
              type: integer
            expires_at:
              type: string
              format: date-time
            authentication_mode:
              type: string
              enum: [bearer, cookie]
            csrf_token:
              type: [string, "null"]
              description: Present for cookie authentication; null for bearer authentication.
        identifier:
          oneOf:
            - $ref: "#/components/schemas/SessionIdentifierVerification"
            - type: "null"
        verification_required:
          type: boolean
        verification:
          oneOf:
            - $ref: "#/components/schemas/VerificationDispatchState"
            - type: "null"
        account_status:
          const: active
          description: |
            Always "active" here — an authenticated session can only exist against
            an active BrandMembership (see SessionAuthenticator), so a deactivated
            or deleted account can never reach this endpoint. A deactivated
            account is observed by the client as an `account_deactivated` error
            from `POST /api/v1/auth/password/login`; a deleted account is
            observed as simply being logged out. There is no `deletion_pending`
            state because account closure is immediate.
        account_controls:
          $ref: "#/components/schemas/AccountControls"
    AccountControls:
      type: object
      required: [password_change, deactivation, deletion]
      description: Brand-policy availability of D8N ID account-lifecycle capabilities, for Settings to render only supported actions.
      properties:
        password_change:
          type: boolean
        deactivation:
          type: boolean
        deletion:
          type: boolean
    AccountDeactivationRequest:
      type: object
      required: [confirmation]
      properties:
        confirmation:
          type: string
          enum: [deactivate]
          description: Must equal "deactivate" to authorize this action.
    AccountDeactivationResponse:
      type: object
      required: [deactivated, already_deactivated]
      properties:
        deactivated:
          const: true
        already_deactivated:
          type: boolean
          description: True when the account was already deactivated (idempotent).
    CloseAccountRequest:
      type: object
      required: [confirmation]
      properties:
        confirmation:
          type: string
          enum: [close]
          description: Must equal "close" to authorize this one-way destructive action.
    CloseAccountResponse:
      type: object
      required: [closed, already_closed, media_purge_state]
      properties:
        closed:
          const: true
        already_closed:
          type: boolean
          description: True when the account was already closed (idempotent).
        media_purge_state:
          type: string
          enum: [pending, completed, failed]
          description: Async physical media-purge status; starts pending.
    Completion:
      type: object
      description: |
        Publication completeness: whether the member may publish and enter the
        dating experience. A required photo must have a ready safe derivative
        and be admitted by brand policy; rejected/deleted/failed/unready photos
        never count. Moderate-first brands may count a hidden pending safe
        derivative for onboarding while still withholding it publicly. Distinct
        from RichProfileCompletion.
      required: [complete, percent, missing]
      properties:
        complete:
          type: boolean
        percent:
          type: integer
          minimum: 0
          maximum: 100
        missing:
          type: array
          items:
            type: string
        sections:
          type: object
          description: |
            Informational per-section completeness (photos, bio, basics, intent,
            lifestyle, interests, prompts, verification). Present on the owner
            profile only. Purely a client nudge — never affects requirements,
            publication, or visibility.
          additionalProperties:
            type: object
            required: [complete]
            properties:
              complete:
                type: boolean
    RichProfileCompletion:
      type: [object, "null"]
      description: |
        Optional post-onboarding richness score. null means the brand has not
        composed a richness model. It never affects publication or eligibility.
      required: [percent, level, missing, suggestions, sections]
      properties:
        percent:
          type: integer
          minimum: 0
          maximum: 100
        level:
          type: string
          enum: [starter, growing, good, standout]
        missing:
          type: array
          items:
            type: string
            enum: [more_photos, bio, looking_for, interests, prompt, work_or_education, lifestyle, relationship_intent, family_plans, languages, personality]
        suggestions:
          type: array
          items:
            type: object
            required: [key, label]
            properties:
              key:
                type: string
              label:
                type: string
        sections:
          type: object
          additionalProperties:
            type: object
            required: [percent, complete]
            properties:
              percent:
                type: integer
                minimum: 0
                maximum: 100
              complete:
                type: boolean
    ProfileCounts:
      type: object
      description: |
        Backward-compatible stored/kept-record counts. These are not silently
        redefined as public/renderable counts; use the returned active prompt and
        interest arrays when that distinction matters.
      required: [photos, prompts, interests]
      properties:
        photos:
          type: integer
          minimum: 0
          description: Kept owner photo placements, regardless of processing/moderation delivery state.
        prompts:
          type: integer
          minimum: 0
        interests:
          type: integer
          minimum: 0
    ContactVerification:
      type: object
      required: [contact]
      description: |
        Contact-control verification only: at least one kept email or phone
        identifier has been verified. No RealMe or identity proof is implied.
      properties:
        contact:
          type: object
          required: [verified]
          properties:
            verified:
              type: boolean
    PublicationState:
      type: object
      required: [published, status, visibility]
      properties:
        published:
          type: boolean
        status:
          type: string
          enum: [draft, active, suspended]
        visibility:
          type: string
          enum: [hidden, visible]
    ProfileUpdate:
      type: object
      description: |
        Owner-scoped onboarding update. `first_name` and `last_name` update the
        private platform identity and are never part of public profile JSON.
        `display_name` remains the separate, brand-owned public dating identity.
        Only fields advertised by the resolved brand's
        `GET /api/v1/profile/configuration` contract may be submitted. Known D8N
        fields disabled for that brand return `invalid_profile_fields` (422).
      properties:
        first_name:
          type: [string, "null"]
          maxLength: 100
          description: Private, self-declared account identity. Required by DateZA completion; not a verified claim.
        last_name:
          type: [string, "null"]
          maxLength: 100
          description: Private, self-declared account identity. Required by DateZA completion and never publicly exposed.
        display_name:
          type: [string, "null"]
          maxLength: 80
        bio:
          type: [string, "null"]
          maxLength: 1000
        birthdate:
          type: [string, "null"]
          format: date
        gender:
          type: [string, "null"]
          maxLength: 40
        pronouns:
          type: [string, "null"]
          maxLength: 40
        visibility:
          type: string
          enum: [hidden, visible]
        country_code:
          type: [string, "null"]
          pattern: "^[A-Z]{2}$"
        city:
          type: [string, "null"]
          maxLength: 120
        occupation:
          type: [string, "null"]
          maxLength: 120
        job_title:
          type: [string, "null"]
          maxLength: 120
        company_name:
          type: [string, "null"]
          maxLength: 120
          description: Employer. Optional and NEVER exposed to other members (owner-only).
        school_or_institution:
          type: [string, "null"]
          maxLength: 160
        looking_for_text:
          type: [string, "null"]
          maxLength: 600
        children_count:
          type: [integer, "null"]
          minimum: 0
          maximum: 30
          description: Optional; owner-only. No other child detail is stored or exposed.
        height_cm:
          type: [integer, "null"]
          minimum: 100
          maximum: 250
        body_type:
          type: [string, "null"]
          maxLength: 80
        languages_spoken:
          type: array
          maxItems: 15
          description: Legacy free-text languages, retained for backward compatibility. Prefer `languages`.
          items:
            type: string
            maxLength: 40
        languages:
          type: array
          maxItems: 15
          description: |
            Canonical structured languages. `code` must be a supported taxonomy
            code; `proficiency` and `primary` are optional (at most one primary).
          items:
            $ref: "#/components/schemas/Language"
        smoking:
          type: [string, "null"]
          enum: [never, occasionally, regularly, null]
        drinking:
          type: [string, "null"]
          enum: [never, occasionally, regularly, null]
        fitness:
          type: [string, "null"]
          enum: [never, occasionally, regularly, null]
    OwnerProfile:
      allOf:
        - $ref: "#/components/schemas/ProfileUpdate"
        - type: object
          description: >-
            Owner profile scalars are present only when enabled by the resolved
            brand configuration. Stable platform envelope fields remain present.
          required: [id, brand, status, visibility, location, options, prompts, counts, verification, publication, completion, publication_completion, profile_completion]
          properties:
            id:
              type: string
              format: uuid
            brand:
              $ref: "#/components/schemas/BrandSummary"
            status:
              type: string
              enum: [draft, active, suspended]
            visibility:
              type: string
              enum: [hidden, visible]
            location:
              $ref: "#/components/schemas/OwnerProfileLocation"
            options:
              $ref: "#/components/schemas/ProfileOptionSelections"
            prompts:
              type: array
              items:
                $ref: "#/components/schemas/PromptAnswer"
            completion:
              $ref: "#/components/schemas/Completion"
            publication_completion:
              $ref: "#/components/schemas/Completion"
            profile_completion:
              $ref: "#/components/schemas/RichProfileCompletion"
            counts:
              $ref: "#/components/schemas/ProfileCounts"
            verification:
              $ref: "#/components/schemas/ContactVerification"
            publication:
              $ref: "#/components/schemas/PublicationState"
    OwnerProfileResponse:
      type: object
      required: [profile]
      properties:
        profile:
          $ref: "#/components/schemas/OwnerProfile"
    CurrentProfileResponse:
      type: object
      required: [profile, onboarding]
      properties:
        profile:
          oneOf:
            - $ref: "#/components/schemas/OwnerProfile"
            - type: "null"
        onboarding:
          $ref: "#/components/schemas/ProfileOnboardingStatus"
    ProfileOnboardingStatus:
      type: object
      required: [state, next_step, profile_exists, profile_complete, profile_published, completion]
      properties:
        state:
          type: string
          enum: [profile_required, profile_incomplete, ready_to_publish, complete, profile_suspended]
        next_step:
          type: [string, "null"]
          enum: [profile, preferences, photos, location, options, publication, null]
        profile_exists:
          type: boolean
        profile_complete:
          type: boolean
        profile_published:
          type: boolean
        completion:
          $ref: "#/components/schemas/Completion"
    ProfileOptionSelections:
      type: object
      additionalProperties:
        type: array
        items:
          type: string
    Language:
      type: object
      required: [code]
      description: |
        A structured language entry. On write, only `code` is required (`proficiency`
        and `primary` optional; at most one primary). On read, `label` is included.
      properties:
        code:
          type: string
          description: Supported taxonomy code (ISO 639-1), e.g. "en".
        label:
          type: string
          readOnly: true
          description: Human-readable label from the taxonomy (read-only).
        proficiency:
          type: [string, "null"]
          enum: [native, fluent, conversational, learning, null]
        primary:
          type: boolean
    ProfileLocation:
      type: object
      required: [precision]
      description: |
        Safe, approximate location metadata for presentation — never raw
        coordinates. Viewer-relative `distance_km` is supplied separately in status.
      properties:
        city:
          type: [string, "null"]
        country_code:
          type: [string, "null"]
        precision:
          type: string
          enum: [approximate]
    OwnerProfileLocation:
      type: object
      required: [configured]
      description: Owner-safe location state. Raw coordinates are never returned.
      properties:
        configured:
          type: boolean
        place:
          type: object
          required: [name, display_path]
          properties:
            name:
              type: string
            display_path:
              type: string
    ProfileInterest:
      type: object
      required: [slug, label]
      properties:
        slug:
          type: string
        label:
          type: string
        category:
          type: [string, "null"]
    PromptAnswer:
      type: object
      required: [key, prompt, answer, position]
      properties:
        key:
          type: string
        prompt:
          type: string
          description: The prompt text (copy) at read time.
        answer:
          type: string
        position:
          type: integer
          minimum: 0
    PromptAnswerInput:
      type: object
      required: [key, answer]
      properties:
        key:
          type: string
        answer:
          type: string
          maxLength: 300
    PublicProfilePhoto:
      type: object
      required: [id, position, primary, url, url_expires_in]
      description: |
        A safe, D8N-generated display derivative of a profile photo. It is
        decoded, re-encoded, and stripped of EXIF/GPS/other metadata. Only
        deliverable photos (kept, visible, moderation-eligible, and finished
        processing) appear; rejected media never appears even if its visibility
        is inconsistent. The raw
        original and its storage key are never exposed. The `url` is a
        short-lived signed URL — refetch the profile to renew it.
      properties:
        id:
          type: string
          format: uuid
          description: |
            Stable, opaque photo id. This is the `target_id` used to report this
            specific photo via POST /api/v1/reports; never the internal id or the
            R2 object key.
        position:
          type: integer
          minimum: 0
        primary:
          type: boolean
          description: True only for the first deliverable photo in deterministic display order.
        url:
          type: string
          format: uri
        url_expires_in:
          type: integer
    PublicProfile:
      type: object
      description: >-
        Public scalar and derived fields are present only when their source field
        is enabled by the profile's brand. Stable platform envelope fields remain
        present.
      required: [id, photos, options]
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: [string, "null"]
        age:
          type: [integer, "null"]
          minimum: 18
        bio:
          type: [string, "null"]
        gender:
          type: [string, "null"]
        pronouns:
          type: [string, "null"]
        country_code:
          type: [string, "null"]
        city:
          type: [string, "null"]
        location:
          oneOf:
            - $ref: "#/components/schemas/ProfileLocation"
            - type: "null"
        occupation:
          type: [string, "null"]
        job_title:
          type: [string, "null"]
        school_or_institution:
          type: [string, "null"]
        looking_for_text:
          type: [string, "null"]
        height_cm:
          type: [integer, "null"]
        body_type:
          type: [string, "null"]
        languages_spoken:
          type: array
          description: Legacy free-text languages, retained for backward compatibility.
          items:
            type: string
        languages:
          type: array
          description: Canonical structured languages (with taxonomy label).
          items:
            $ref: "#/components/schemas/Language"
        smoking:
          type: [string, "null"]
        drinking:
          type: [string, "null"]
        fitness:
          type: [string, "null"]
        photos:
          type: array
          description: |
            Safe display derivatives, ordered by position. The first returned item
            is the public primary photo. Empty when no photo is deliverable.
          items:
            $ref: "#/components/schemas/PublicProfilePhoto"
        options:
          description: |
            Selections for public_profile-visibility groups. On the profile-detail
            endpoint this ALSO includes matches_only groups when an active Match
            exists. company_name and owner-only groups are never included.
          $ref: "#/components/schemas/ProfileOptionSelections"
    Compatibility:
      type: object
      required: [score, confidence, reasons]
      properties:
        score:
          type: integer
          minimum: 0
          maximum: 100
        confidence:
          type: number
          minimum: 0
          maximum: 1
        reasons:
          type: array
          items:
            type: string
            enum: [shared_intent, similar_vibe, mutual_age_fit]
    DatezaCompatibility:
      type: [object, "null"]
      description: |
        Pair-specific deterministic DateZA compatibility. null means meaningful
        comparable input weight is below the dateza_v1 publication threshold;
        it does not mean incompatibility. Reason codes reveal no raw answers.
      required: [score, confidence, confidence_level, version, reasons]
      properties:
        score:
          type: integer
          minimum: 0
          maximum: 100
        confidence:
          type: number
          minimum: 0
          maximum: 1
        confidence_level:
          type: string
          enum: [low, medium, high]
        version:
          type: string
          enum: [dateza_v1]
        reasons:
          type: array
          maxItems: 5
          items:
            type: string
            enum:
              - shared_long_term_intent
              - compatible_relationship_goals
              - relationship_goal_mismatch
              - compatible_family_plans
              - family_plan_mismatch
              - shared_no_smoking
              - smoking_lifestyle_mismatch
              - compatible_drinking_style
              - similar_faith_importance
              - similar_social_style
              - compatible_meeting_pace
              - shared_interests
              - shared_languages
              - compatible_communication_style
              - compatible_planning_style
              - similar_travel_style
              - compatible_diet
    ProfileStatus:
      type: object
      description: |
        Viewer-relative status signals, recomputed per request. Present only on the
        discovery feed and the single-profile detail endpoint — NOT on match or
        conversation payloads, which carry the base public profile only.
      required: [verified, online, active_today, new_here, last_active_at, distance_km]
      properties:
        verified:
          type: boolean
          description: |
            The member has proven ownership of at least one contact identifier
            (email or phone). This is CONTACT verification, not photo/identity
            ("it's really them") verification, which does not exist yet — treat it
            as a "reachable" signal rather than a strong trust badge. On profile
            detail, prefer `verification.contact.verified`; this top-level field
            remains as a backward-compatible legacy projection.
        active_today:
          type: boolean
          description: An active brand session was used within the last 24 hours.
        new_here:
          type: boolean
          description: The member's profile was created within the last 7 days.
        online:
          type: boolean
          description: An active brand session was used within the last 10 minutes.
        last_active_at:
          type: [string, "null"]
          format: date-time
          description: |
            Most recent active-session use (ISO8601), or null when the member has
            no active session (never signed in on this brand, revoked, or expired).
        distance_km:
          type: [integer, "null"]
          minimum: 1
          description: |
            Server-calculated whole-kilometre great-circle distance from the
            viewer, floored to 1km (never 0, which would read as exact
            co-location). null unless both members have a location valid under
            the resolved brand policy: DateZA locations persist until replaced or
            removed; HookUs locations must be no older than 24 hours. Clients
            must not calculate distance from coordinates (coordinates are never
            returned).
    HookUsProfileState:
      type: object
      description: Optional HookUs capability state, composed only for HookUs surfaces that enable it.
      required: [hook_tonight_active, hook_state]
      properties:
        hook_tonight_active:
          type: boolean
          description: The member currently has a live Hook Tonight availability state.
        hook_state:
          type: string
          enum: [available, pending, hooked, unavailable]
          description: |
            The viewer's 🔥 Hook button state toward this profile. Deliberately
            does not distinguish declined, expired, or blocked outcomes.
    ProfileWithStatus:
      allOf:
        - $ref: "#/components/schemas/PublicProfile"
        - $ref: "#/components/schemas/ProfileStatus"
        - type: object
          description: HookUs profile detail adds these fields; brands without Hook capabilities omit them.
          properties:
            hook_tonight_active:
              type: boolean
            hook_state:
              type: string
              enum: [available, pending, hooked, unavailable]
    DiscoveryProfile:
      allOf:
        - $ref: "#/components/schemas/PublicProfile"
        - $ref: "#/components/schemas/ProfileStatus"
        - $ref: "#/components/schemas/HookUsProfileState"
        - type: object
          required: [compatibility]
          properties:
            compatibility:
              $ref: "#/components/schemas/Compatibility"
    DailyDiscoveryProfile:
      allOf:
        - $ref: "#/components/schemas/PublicProfile"
        - $ref: "#/components/schemas/ProfileStatus"
        - type: object
          required: [compatibility]
          properties:
            compatibility:
              $ref: "#/components/schemas/DatezaCompatibility"
    DailySelectionMetadata:
      type: object
      required: [allocation_date, daily_limit, count, finalized, refreshes_at]
      properties:
        allocation_date:
          type: string
          format: date
          description: Allocation period date in the configured surface timezone.
        daily_limit:
          type: integer
          minimum: 1
        count:
          type: integer
          minimum: 0
          description: Number of allocated candidates still eligible and safe to deliver.
        finalized:
          type: boolean
          const: true
          description: The period's allocation will not be routinely reranked or refilled.
        refreshes_at:
          type: string
          format: date-time
          description: Start of the next allocation period in the configured timezone.
    DiscoveryResponse:
      type: object
      required: [profiles, next_cursor]
      properties:
        profiles:
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/DiscoveryProfile"
              - $ref: "#/components/schemas/DailyDiscoveryProfile"
        next_cursor:
          type: [string, "null"]
        selection:
          $ref: "#/components/schemas/DailySelectionMetadata"
          description: Present only for a stable daily-batch surface.
    FindProfileStatus:
      type: object
      required: [verified, online, active_today, new_here, last_active_at, distance_km]
      properties:
        verified:
          type: boolean
        online:
          type: boolean
        active_today:
          type: boolean
        new_here:
          type: boolean
        last_active_at:
          type: [string, "null"]
          format: date-time
        distance_km:
          type: [integer, "null"]
          minimum: 1
    FindProfile:
      allOf:
        - $ref: "#/components/schemas/PublicProfile"
        - $ref: "#/components/schemas/FindProfileStatus"
        - type: object
          required: [compatibility]
          properties:
            compatibility:
              $ref: "#/components/schemas/DatezaCompatibility"
    FindAllowance:
      type: object
      required: [limit, used, remaining, exhausted, resets_at]
      properties:
        limit:
          type: integer
          minimum: 1
        used:
          type: integer
          minimum: 0
        remaining:
          type: integer
          minimum: 0
        exhausted:
          type: boolean
        resets_at:
          type: string
          format: date-time
          description: Next midnight in Africa/Johannesburg, including its UTC offset.
    FindResponse:
      type: object
      required: [profiles, next_cursor, allowance]
      properties:
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/FindProfile"
        next_cursor:
          type: [string, "null"]
        allowance:
          $ref: "#/components/schemas/FindAllowance"
    ProfileDetail:
      description: |
        The rich single-profile view (GET /profiles/:id): the public profile with
        viewer-relative status, detail-only sections, explicit contact verification,
        and DateZA compatibility where configured. matches_only option groups appear
        under `options` only when an active Match exists.
      allOf:
        - $ref: "#/components/schemas/ProfileWithStatus"
        - type: object
          required: [prompts, interests, verification]
          properties:
            prompts:
              type: array
              items:
                $ref: "#/components/schemas/PromptAnswer"
            interests:
              type: array
              description: Categorized interests derived from the `interests` group's selections.
              items:
                $ref: "#/components/schemas/ProfileInterest"
            verification:
              $ref: "#/components/schemas/ContactVerification"
            compatibility:
              $ref: "#/components/schemas/DatezaCompatibility"
    ProfileDetailResponse:
      type: object
      required: [profile]
      properties:
        profile:
          $ref: "#/components/schemas/ProfileDetail"
    ProfilePreferencesUpdate:
      type: object
      properties:
        min_age:
          type: [integer, "null"]
          minimum: 18
          maximum: 120
        max_age:
          type: [integer, "null"]
          minimum: 18
          maximum: 120
        interested_in:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 40
        max_distance_km:
          type: [integer, "null"]
          minimum: 1
          maximum: 500
        country:
          type: [string, "null"]
          pattern: "^[A-Z]{2}$"
        relationship_intent:
          type: [string, "null"]
          maxLength: 80
    ProfilePreferences:
      allOf:
        - $ref: "#/components/schemas/ProfilePreferencesUpdate"
        - type: object
          required: [id, profile_id, brand, interested_in]
          properties:
            id:
              type: integer
            profile_id:
              type: string
              format: uuid
            brand:
              $ref: "#/components/schemas/BrandSummary"
    ProfileLocationUpdate:
      type: object
      required: [latitude, longitude, accuracy_meters, captured_at]
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
          writeOnly: true
        longitude:
          type: number
          minimum: -180
          maximum: 180
          writeOnly: true
        accuracy_meters:
          type: integer
          minimum: 0
          maximum: 100000
        captured_at:
          type: string
          format: date-time
    ProfileLocationState:
      type: object
      required: [configured]
      properties:
        configured:
          type: boolean
        accuracy_meters:
          type: integer
        source:
          type: string
          enum: [device, manual, imported, place]
        captured_at:
          type: string
          format: date-time
        place:
          description: |
            Present only when source is `place`. Never includes coordinates.
            `kind`/`code`/`country_code` are populated by `GET /api/v1/profile/location`;
            the write endpoints (`PUT /profile/location`, `PUT /profile/place`) only
            ever return `id`, `name`, `display_path`.
          type: object
          required: [id, name, display_path]
          properties:
            id:
              type: integer
            kind:
              type: string
              enum: [region, city, locality]
            name:
              type: string
            code:
              type: string
            country_code:
              type: string
            display_path:
              type: string
              description: Human-readable, fine-to-coarse label, e.g. "Sea Point, Cape Town, Western Cape".
    ProfileLocationResponse:
      type: object
      required: [location]
      properties:
        location:
          $ref: "#/components/schemas/ProfileLocationState"
    Place:
      type: object
      required: [id, kind, name, code, has_children]
      properties:
        id:
          type: integer
        kind:
          type: string
          enum: [region, city, locality]
          description: Country-level entries are never listed; DateZA's country_code is implicit.
        name:
          type: string
        code:
          type: string
          description: Stable slug, unique among siblings.
        has_children:
          type: boolean
          description: Whether a more specific level exists to drill into (not every city has cataloged localities).
    LocationSearchResult:
      type: object
      required: [place_id, label, area, city, region, country_code, kind]
      properties:
        place_id:
          type: integer
          description: Directly usable as the place_id body param for PUT /api/v1/profile/place.
        label:
          type: string
          description: Human-readable, fine-to-coarse display label, e.g. "Sea Point, Cape Town, Western Cape".
        area:
          type: string
          description: The matched area's own name (suburb, town, or city name).
        city:
          type: [string, "null"]
          description: Null when the result itself is a region, or no cataloged city ancestor exists.
        region:
          type: [string, "null"]
        country_code:
          type: string
        kind:
          type: string
          enum: [region, city, locality]
          description: Never "country" — a country is never an acceptable dating-area selection.
    ProfilePhoto:
      type: object
      required: [id, profile_id, position, primary, status, visibility, processing_state, deleted_at, image]
      properties:
        id:
          type: integer
        profile_id:
          type: string
          format: uuid
        position:
          type: integer
        primary:
          type: boolean
          description: True for the first kept owner photo in position/id order; derived, never stored separately.
        status:
          type: string
          description: Moderation lifecycle; independent of processing_state and visibility.
          enum: [pending_review, approved, rejected]
        visibility:
          type: string
          enum: [hidden, visible]
        processing_state:
          type: string
          description: |
            Safe-derivative pipeline state. Only `ready` photos are eligible for
            delivery to other users. `image` shows the owner their raw upload
            while `pending`/`processing`, and the safe display derivative once
            `ready`. `failed` marks a permanently unprocessable image.
          enum: [pending, processing, ready, failed]
        deleted_at:
          type: [string, "null"]
          format: date-time
        image:
          oneOf:
            - $ref: "#/components/schemas/ProfilePhotoImage"
            - type: "null"
    ProfilePhotoImage:
      type: object
      required: [filename, content_type, byte_size, url, url_expires_in]
      properties:
        filename:
          type: string
        content_type:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        byte_size:
          type: integer
        url:
          type: string
          description: Short-lived signed retrieval URL (direct from private R2).
        url_expires_in:
          type: integer
          description: Seconds until the signed retrieval URL expires.
    ProfilePhotoUpload:
      type: object
      required: [signed_id, url, headers, expires_in, byte_size_limit, allowed_content_types]
      properties:
        signed_id:
          type: string
          description: Opaque id to submit when attaching the completed upload.
        url:
          type: string
          description: Short-lived presigned PUT URL for the media bytes.
        headers:
          type: object
          additionalProperties:
            type: string
          description: Exact headers to send with the PUT (includes Content-MD5).
        expires_in:
          type: integer
          description: Seconds until the presigned upload URL expires.
        byte_size_limit:
          type: integer
        allowed_content_types:
          type: array
          items:
            type: string
    ProfileConfigurationResponse:
      type: object
      required: [configuration, onboarding]
      properties:
        configuration:
          $ref: "#/components/schemas/ProfileConfiguration"
        onboarding:
          $ref: "#/components/schemas/ProfileOnboardingStatus"
    ProfileConfiguration:
      type: object
      required: [identity_fields, profile_fields, preference_fields, collections, option_groups, prompts, openers]
      properties:
        identity_fields:
          type: array
          description: Private platform-identity fields enabled for this brand's onboarding flow.
          items:
            $ref: "#/components/schemas/ConfiguredField"
        profile_fields:
          type: array
          items:
            $ref: "#/components/schemas/ConfiguredField"
        preference_fields:
          type: array
          items:
            $ref: "#/components/schemas/ConfiguredField"
        collections:
          type: array
          items:
            $ref: "#/components/schemas/ConfiguredCollection"
        option_groups:
          type: array
          items:
            $ref: "#/components/schemas/ConfiguredOptionGroup"
        prompts:
          type: array
          description: Brand-enabled prompt definitions a member may answer.
          items:
            $ref: "#/components/schemas/ConfiguredPrompt"
        openers:
          type: array
          description: >-
            Brand-enabled D8N Opener catalog. Empty for a freeform brand
            (HookUs); a brand whose opener policy requires curation (DateZA)
            lists the entries a sender must choose from for
            `POST /api/v1/profiles/{profile_id}/opener`.
          items:
            $ref: "#/components/schemas/ConfiguredOpener"
    ConfiguredField:
      type: object
      required: [key, label, required, cardinality, input_type, visibility, options]
      properties:
        key:
          type: string
        label:
          type: string
        required:
          type: boolean
        cardinality:
          type: string
          enum: [single, multiple]
        input_type:
          type: string
          enum: [text, textarea, date, integer, select, string_list, language_list]
        visibility:
          type: string
          enum: [owner_only, public_profile]
        options:
          type: array
          description: Controlled choices when the field has a server-owned vocabulary; otherwise empty.
          items:
            type: object
            required: [code, label]
            properties:
              code:
                type: string
              label:
                type: string
    ConfiguredCollection:
      type: object
      required: [key, label, required, minimum_count, maximum_count]
      properties:
        key:
          type: string
        label:
          type: string
        required:
          type: boolean
        minimum_count:
          type: integer
          minimum: 1
        maximum_count:
          type: integer
          minimum: 1
          description: Server-enforced brand-policy maximum for this collection.
    ConfiguredOptionGroup:
      type: object
      required: [key, label, cardinality, max_selections, required, visibility, options]
      properties:
        key:
          type: string
        label:
          type: string
        cardinality:
          type: string
          enum: [single, multiple]
        max_selections:
          type: integer
        required:
          type: boolean
        visibility:
          type: string
          enum: [owner_only, public_profile, matches_only]
        options:
          type: array
          items:
            type: object
            required: [code, label]
            properties:
              code:
                type: string
              label:
                type: string
              category:
                type: [string, "null"]
    ConfiguredPrompt:
      type: object
      required: [key, text]
      properties:
        key:
          type: string
        text:
          type: string
        category:
          type: [string, "null"]
    ConfiguredOpener:
      type: object
      required: [key, text]
      properties:
        key:
          type: string
        text:
          type: string
    IncompleteProfileError:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          required: [completion]
          properties:
            completion:
              type: object
              required: [percent, missing]
              properties:
                percent:
                  type: integer
                missing:
                  type: array
                  items:
                    type: string
    LikeResponse:
      type: object
      required: [liked, matched, match_id, created]
      properties:
        liked:
          const: true
        matched:
          type: boolean
        match_id:
          type: [string, "null"]
          format: uuid
        created:
          type: boolean
    LikeProfile:
      allOf:
        - $ref: "#/components/schemas/PublicProfile"
        - $ref: "#/components/schemas/ProfileStatus"
        - type: object
          properties:
            compatibility:
              $ref: "#/components/schemas/DatezaCompatibility"
              description: >-
                Present only for brands with a pair compatibility strategy
                configured (DateZA today). Omitted entirely — not null — for
                brands without one (HookUs).
    LikeListItem:
      type: object
      required: [liked_at, profile]
      properties:
        liked_at:
          type: string
          format: date-time
        profile:
          $ref: "#/components/schemas/LikeProfile"
    LikeListResponse:
      type: object
      required: [likes, next_cursor]
      properties:
        likes:
          type: array
          items:
            $ref: "#/components/schemas/LikeListItem"
        next_cursor:
          type: [string, "null"]
    PassResponse:
      type: object
      required: [passed, created]
      properties:
        passed:
          const: true
        created:
          type: boolean
    BlockResponse:
      type: object
      required: [blocked, created]
      properties:
        blocked:
          const: true
        created:
          type: boolean
    BlockedProfilesResponse:
      type: object
      required: [blocks]
      properties:
        blocks:
          type: array
          description: Profiles the current member has blocked, newest first.
          items:
            type: object
            required: [profile, blocked_at]
            properties:
              profile:
                type: object
                required: [id, display_name]
                description: Minimum information needed to recognise and unblock the target.
                properties:
                  id:
                    type: string
                    format: uuid
                  display_name:
                    type: [string, "null"]
              blocked_at:
                type: string
                format: date-time
    ReportReason:
      type: string
      description: |
        Stable safety-reason code. Codes are stable and never renumbered; the
        frontend maps them to display labels and may offer a tailored subset per
        target type. `violence_or_threat`, `non_consensual_content`, and
        `impersonation` were added in Reporting V2.
      enum:
        [inappropriate_content, harassment, spam, fake_profile, underage, other,
         violence_or_threat, non_consensual_content, impersonation]
    ReportTargetType:
      type: string
      description: |
        The kind of thing being reported. `profile` reports a person; `message`,
        `profile_media`, and `hook` each report one specific piece of content;
        `conversation` reports the interaction as a whole for pattern-level harm
        no single message captures. New types are added as the underlying
        features ship.
      enum: [profile, message, profile_media, hook, conversation]
    ReportRequest:
      type: object
      required: [reason]
      properties:
        reason:
          $ref: "#/components/schemas/ReportReason"
        note:
          type: [string, "null"]
          maxLength: 2000
          description: Optional free-text detail from the reporter.
    ReportResponse:
      type: object
      required: [reported, created]
      properties:
        reported:
          const: true
        created:
          type: boolean
          description: True when a new report was filed; false when an open report already existed.
    FileReportRequest:
      type: object
      required: [target_type, reason]
      properties:
        target_type:
          $ref: "#/components/schemas/ReportTargetType"
        target_id:
          type: [string, "null"]
          description: |
            Opaque public id of the target content — a message id, photo id,
            Hook id, or conversation id (a profile's public id when
            `target_type` is `profile`). The responsible profile is always
            derived server-side from this target, never supplied by the client.
        reason:
          $ref: "#/components/schemas/ReportReason"
        details:
          type: [string, "null"]
          maxLength: 2000
          description: Optional untrusted reporter context. Normalized and length-bounded.
        block:
          type: boolean
          default: false
          description: |
            When true, the responsible profile is also blocked after the report is
            filed. Both actions are idempotent.
    FileReportResponse:
      type: object
      required: [report, created, blocked]
      properties:
        report:
          type: object
          required: [status]
          properties:
            status:
              type: string
              const: received
              description: |
                Acknowledgement only. Internal moderation status/notes/evidence
                and any offender history are never exposed to the reporter.
        created:
          type: boolean
          description: True when a new report was filed; false when an open report for this target already existed.
        blocked:
          type: boolean
          description: True when `block` was requested and the responsible profile is now blocked.
    ProductNotification:
      type: object
      required: [id, type, title, body, payload, read_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - dateza.welcome
            - dateza.like_received
            - dateza.match_created
            - dateza.opener_received
            - dateza.message_received
          description: Stable semantic type. New types are added compatibly.
        title:
          type: string
        body:
          type: string
        payload:
          oneOf:
            - $ref: "#/components/schemas/EmptyNotificationPayload"
            - $ref: "#/components/schemas/DatingEventNotificationPayload"
          description: |
            Type-controlled, presentation-safe structured data. Empty for
            dateza.welcome. For the D8N dating events (like_received,
            match_created, opener_received, message_received), carries only
            opaque public identifiers — `actor.profile_id` (who did it) and
            `target.type`/`target.id` (what to open). Message notifications also
            carry `target.message_id`, an opaque identifier used to resolve the
            exact message under current authorization. Never latitude/longitude,
            message text, names, or photos; the frontend resolves `actor`/
            `target` through the normal owner-scoped endpoints (profile detail,
            match, conversation), which independently enforce block/suspension/
            closure access. `target.type` is one of `profile`, `match`,
            `opener`, `conversation`.
        read_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
    EmptyNotificationPayload:
      type: object
      additionalProperties: false
      description: The payload shape for dateza.welcome, which carries no fields.
    DatingEventNotificationPayload:
      type: object
      required: [actor, target]
      additionalProperties: false
      properties:
        actor:
          type: object
          required: [profile_id]
          additionalProperties: false
          description: The profile who performed the action that produced this notification.
          properties:
            profile_id:
              type: string
              format: uuid
        target:
          type: object
          required: [type, id]
          additionalProperties: false
          description: Where the frontend can navigate to act on this notification.
          properties:
            type:
              type: string
              enum: [profile, match, opener, conversation]
            id:
              type: string
              format: uuid
            message_id:
              type: string
              format: uuid
              description: Present only when target.type is conversation.
    NotificationListResponse:
      type: object
      required: [notifications, unread_count]
      properties:
        notifications:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/ProductNotification"
        unread_count:
          type: integer
          minimum: 0
    NotificationResponse:
      type: object
      required: [notification]
      properties:
        notification:
          $ref: "#/components/schemas/ProductNotification"
    MarkAllNotificationsReadResponse:
      type: object
      required: [marked_read, unread_count]
      properties:
        marked_read:
          type: integer
          minimum: 0
        unread_count:
          const: 0
    NotificationPreferences:
      type: object
      required: [product_email_enabled, push_enabled]
      properties:
        product_email_enabled:
          type: boolean
          description: Whether D8N product notifications (e.g. match_created) may be emailed. In-app delivery is unaffected.
        push_enabled:
          type: boolean
          description: Whether D8N product notifications may be pushed to a registered device. In-app delivery is unaffected.
    NotificationPreferencesResponse:
      type: object
      required: [preferences]
      properties:
        preferences:
          $ref: "#/components/schemas/NotificationPreferences"
    NotificationPreferencesUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        product_email_enabled:
          type: boolean
        push_enabled:
          type: boolean
    Match:
      type: object
      required: [id, matched_at, profile]
      properties:
        id:
          type: string
          format: uuid
        matched_at:
          type: string
          format: date-time
        profile:
          $ref: "#/components/schemas/PublicProfile"
    MatchListResponse:
      type: object
      required: [matches, next_cursor]
      properties:
        matches:
          type: array
          items:
            $ref: "#/components/schemas/Match"
        next_cursor:
          type: [string, "null"]
    Conversation:
      type: object
      required: [id, match_id, status, created_at, profile, last_message]
      properties:
        id:
          type: string
          format: uuid
        match_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [active, closed]
        created_at:
          type: string
          format: date-time
        profile:
          $ref: "#/components/schemas/PublicProfile"
        last_message:
          description: Preview of the newest message, or null for an empty conversation.
          oneOf:
            - $ref: "#/components/schemas/MessagePreview"
            - type: "null"
    MessagePreview:
      type: object
      required: [id, sender_id, body, created_at]
      properties:
        id:
          type: string
          format: uuid
        sender_id:
          type: [string, "null"]
          format: uuid
          description: Public profile id of the author.
        body:
          type: string
        created_at:
          type: string
          format: date-time
    Message:
      type: object
      required: [id, conversation_id, sender_id, body, attachments, created_at]
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        sender_id:
          type: string
          format: uuid
          description: |
            Public profile id of the author. The client identifies its own
            messages by comparing against the counterpart profile id on the
            conversation (there are exactly two participants).
        body:
          type: [string, "null"]
          description: Null for a media-only message (D8N Chat Media). A message always has a body, an attachment, or both.
        attachments:
          type: array
          description: Image/video attachments (D8N Chat Media), ordered by position. Empty for a text-only message.
          items:
            $ref: "#/components/schemas/MessageAttachment"
        created_at:
          type: string
          format: date-time
    MessageAttachment:
      type: object
      required: [id, media_kind, processing_state, deleted, content_type, byte_size, width, height, duration_seconds]
      properties:
        id:
          type: string
          format: uuid
        media_kind:
          type: string
          enum: [image, video]
        processing_state:
          type: string
          description: |
            `pending`/`processing` until the safe delivery rendition exists
            (image: re-encoded/EXIF-stripped derivative; video: structural
            validation — see Media::VideoContainerValidator). Only `ready`
            attachments carry `view_url`/`download_url`/`poster_url`; the
            recipient never sees a broken half-processed attachment as ready.
            `failed` is terminal (corrupt/unsupported upload).
          enum: [pending, processing, ready, failed]
        deleted:
          type: boolean
          description: True once the sender has deleted this attachment ("delete for everyone"). No delivery URLs are present when true.
        content_type:
          type: [string, "null"]
        byte_size:
          type: [integer, "null"]
        width:
          type: [integer, "null"]
          description: Image only; null for video (no server-side frame decode is available — see ticket's video processing notes).
        height:
          type: [integer, "null"]
        duration_seconds:
          type: [number, "null"]
          description: Video only, best-effort from the container's `mvhd` box; null if unavailable.
        view_url:
          type: string
          description: Short-lived signed URL for inline view/play (the safe rendition, never the full-quality original). Present only when `processing_state` is `ready` and not deleted.
        download_url:
          type: string
          description: Short-lived signed URL with a `Content-Disposition:attachment` header, serving the original full-quality bytes. Present only when `processing_state` is `ready` and not deleted.
        poster_url:
          type: string
          description: Video only. Short-lived signed URL for a client-supplied poster/thumbnail image, if one was provided at send time. Never generated server-side (no video frame decoder in this deployment).
    MessageListResponse:
      type: object
      required: [messages, next_cursor]
      properties:
        messages:
          type: array
          description: Newest-first page of messages.
          items:
            $ref: "#/components/schemas/Message"
        next_cursor:
          type: [string, "null"]
    SendMessageRequest:
      type: object
      description: >-
        At least one of `body` or `attachment_uploads` is required; a message
        with neither is rejected (`message_blank`).
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 2000
          description: Plain-text message. NFC-normalized, Unicode preserved. Optional when at least one attachment is present.
        attachment_uploads:
          type: array
          maxItems: 4
          description: >-
            Already-uploaded, verified blobs to finalize into this message
            (D8N Chat Media). Each `signed_id` comes from a prior
            `POST /api/v1/conversations/{conversation_id}/attachments/uploads`
            call whose bytes have already been PUT to the returned URL. "Attach"
            and "send" are the same operation — there is no separate finalize step.
          items:
            $ref: "#/components/schemas/AttachmentUploadRef"
    AttachmentUploadRef:
      type: object
      required: [signed_id, media_kind]
      properties:
        signed_id:
          type: string
          description: Opaque id returned by the upload-authorization endpoint.
        media_kind:
          type: string
          enum: [image, video]
        poster_signed_id:
          type: string
          description: Optional. Signed id of a separately-uploaded (image, media_kind=image) poster/thumbnail for a video attachment.
    SendMessageResponse:
      type: object
      required: [message]
      properties:
        message:
          $ref: "#/components/schemas/Message"
    MessageAttachmentUpload:
      type: object
      required: [signed_id, url, headers, expires_in, media_kind, byte_size_limit, allowed_content_types]
      properties:
        signed_id:
          type: string
          description: Opaque id to submit as `attachment_uploads[].signed_id` when sending the message.
        url:
          type: string
          description: Short-lived presigned PUT URL for the media bytes.
        headers:
          type: object
          additionalProperties:
            type: string
          description: Exact headers to send with the PUT (includes Content-MD5).
        expires_in:
          type: integer
          description: Seconds until the presigned upload URL expires.
        media_kind:
          type: string
          enum: [image, video]
        byte_size_limit:
          type: integer
          description: >-
            Technical abuse ceiling for this media kind (video: a generous
            infrastructure protection, not a product-facing video length/size
            limit — see Messaging::MessageAttachmentUpload).
        allowed_content_types:
          type: array
          items:
            type: string
    CreateMessageAttachmentUploadRequest:
      type: object
      required: [media_kind, content_type, byte_size, checksum]
      properties:
        media_kind:
          type: string
          enum: [image, video]
        content_type:
          type: string
          enum: [image/jpeg, image/png, image/webp, video/mp4, video/quicktime]
        byte_size:
          type: integer
          minimum: 1
        checksum:
          type: string
          description: Base64-encoded MD5 digest of the file bytes.
        filename:
          type: string
    DeleteMessageAttachmentResponse:
      type: object
      required: [attachment]
      properties:
        attachment:
          type: object
          required: [id, deleted]
          properties:
            id:
              type: string
              format: uuid
            deleted:
              type: boolean
    HookTonightActivateRequest:
      type: object
      description: |
        Optional activation body. V1 accepts a single availability `intent`;
        omitting the body activates with the default.
      properties:
        intent:
          type: string
          enum: [open_to_meeting]
          default: open_to_meeting
          description: The availability intent. Unsupported values yield `invalid_intent`.
    HookTonightState:
      type: object
      description: |
        Current Hook Tonight availability, authoritative and clock-checked. When
        `active` is false, `expires_at` and `intent` are null.
      required: [active, expires_at, intent]
      properties:
        active:
          type: boolean
          description: Whether the member is currently live in the Hook Tonight pool.
        expires_at:
          type: [string, "null"]
          format: date-time
          description: When the current availability lapses, or null when inactive.
        intent:
          type: [string, "null"]
          enum: [open_to_meeting, null]
          description: The active availability intent, or null when inactive.
    SendHookRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 2000
          description: |
            The opener the sender chose to submit (the pre-filled default or an
            edited version). Plain text, non-blank, NFC-normalized, Unicode
            preserved. Same constraints as a chat message.
    SendHookResponse:
      type: object
      required: [hook]
      properties:
        hook:
          $ref: "#/components/schemas/HookAcknowledgement"
    HookAcknowledgement:
      type: object
      description: |
        Minimal sender-facing acknowledgement. The sender learns only that their
        opener is pending and when it lapses — never anything the recipient does.
      required: [id, status, created_at, expires_at]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending]
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: When the pending Hook expires if the recipient never engages.
    ReceivedHook:
      type: object
      description: One received Hook in the recipient inbox.
      required: [id, message, created_at, expires_at, sender]
      properties:
        id:
          type: string
          format: uuid
        message:
          type: string
          description: The sender's opener.
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        sender:
          $ref: "#/components/schemas/PublicProfile"
    HookInboxResponse:
      type: object
      required: [hooks, next_cursor]
      properties:
        hooks:
          type: array
          description: Newest-first page of live received Hooks.
          items:
            $ref: "#/components/schemas/ReceivedHook"
        next_cursor:
          type: [string, "null"]
    HookReplyRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 2000
          description: The recipient's reply text. Same constraints as a chat message.
    HookReplyResponse:
      type: object
      description: The unlocked conversation plus the recipient's stored reply message.
      required: [conversation, message]
      properties:
        conversation:
          $ref: "#/components/schemas/Conversation"
        message:
          $ref: "#/components/schemas/Message"
    SendOpenerRequest:
      type: object
      required: [opener_key]
      properties:
        opener_key:
          type: string
          description: |
            The stable key of one entry from the brand's curated opener catalog
            (`GET /api/v1/profile/configuration` → `openers`). D8N Opener brands
            are catalog-only — there is no freeform text field; the resolved
            catalog `text` is what gets sent.
    SendOpenerResponse:
      type: object
      required: [opener]
      properties:
        opener:
          $ref: "#/components/schemas/HookAcknowledgement"
    OpenerInboxResponse:
      type: object
      required: [openers, next_cursor]
      properties:
        openers:
          type: array
          description: Newest-first page of live received D8N Openers.
          items:
            $ref: "#/components/schemas/ReceivedHook"
        next_cursor:
          type: [string, "null"]
    AdminProfilePhotoModeration:
      type: object
      required: [id, profile_id, position, status, visibility, processing_state]
      properties:
        id:
          type: string
          format: uuid
        profile_id:
          type: string
          format: uuid
        position:
          type: integer
          minimum: 0
        status:
          type: string
          enum: [approved, rejected]
        visibility:
          type: string
          enum: [hidden, visible]
        processing_state:
          type: string
          enum: [pending, processing, ready, failed]
    AdminProfilePhotoQueueResponse:
      type: object
      required: [photos]
      properties:
        photos:
          type: array
          items:
            $ref: "#/components/schemas/AdminProfilePhotoQueueEntry"
    AdminProfilePhotoQueueEntry:
      type: object
      required: [id, profile_id, position, created_at, image]
      properties:
        id:
          type: string
          format: uuid
        profile_id:
          type: string
          format: uuid
        position:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        image:
          type: [object, "null"]
          description: Short-lived signed URL to the safe (EXIF-stripped) display derivative, or null if processing has not completed.
          required: [content_type, url, url_expires_in]
          properties:
            content_type:
              type: string
            url:
              type: string
              format: uri
            url_expires_in:
              type: integer
    AdminReportParty:
      description: Minimal identity of a report participant, or null if unresolved.
      oneOf:
        - type: object
          required: [id, display_name]
          properties:
            id:
              type: string
              format: uuid
            display_name:
              type: [string, "null"]
        - type: "null"
    AdminReport:
      type: object
      required:
        [id, status, reason, target_type, evidence, reporter, reported, note,
         resolution_note, reviewed_by_admin_user_id, reviewed_at, created_at, updated_at]
      properties:
        id:
          type: integer
        status:
          type: string
          enum: [open, reviewing, actioned, dismissed]
        reason:
          $ref: "#/components/schemas/ReportReason"
        target_type:
          $ref: "#/components/schemas/ReportTargetType"
        evidence:
          type: object
          additionalProperties: true
          description: |
            Minimal, immutable moderation snapshot captured when the report was
            filed (e.g. message/opener text, photo identity + lifecycle). Empty
            for a plain profile report. Survives later deletion of the target.
            Moderator-only; never contains R2 keys, storage paths, or URLs.
        reporter:
          $ref: "#/components/schemas/AdminReportParty"
        reported:
          description: The responsible profile, derived server-side from the target.
          $ref: "#/components/schemas/AdminReportParty"
        note:
          type: [string, "null"]
          description: Reporter-supplied context.
        resolution_note:
          type: [string, "null"]
          description: Moderator's short decision note.
        reviewed_by_admin_user_id:
          type: [integer, "null"]
        reviewed_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AdminReportListResponse:
      type: object
      required: [reports, next_cursor]
      properties:
        reports:
          type: array
          items:
            $ref: "#/components/schemas/AdminReport"
        next_cursor:
          type: [string, "null"]
    AdminReportResponse:
      type: object
      required: [report]
      properties:
        report:
          $ref: "#/components/schemas/AdminReport"
    UpdateReportRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [reviewing, actioned, dismissed, open]
          description: Target lifecycle status. Server enforces valid transitions.
        note:
          type: [string, "null"]
          maxLength: 2000
          description: Optional short moderator decision note.
    SuspendProfileRequest:
      type: object
      properties:
        reason:
          type: [string, "null"]
          maxLength: 500
          description: Optional short moderator reason (audited, never exposed publicly).
        report_id:
          type: [integer, "null"]
          description: Optional id of the report that motivated the enforcement (same brand).
    AdminEnforcement:
      type: object
      required:
        [id, state, profile_id, reason, report_id, admin_user_id,
         reverted_by_admin_user_id, created_at, reverted_at]
      properties:
        id:
          type: integer
        state:
          type: string
          enum: [active, reverted]
          description: The enforcement's own state, distinct from account/report status.
        profile_id:
          type: [string, "null"]
          format: uuid
        reason:
          type: [string, "null"]
        report_id:
          type: [integer, "null"]
        admin_user_id:
          type: integer
        reverted_by_admin_user_id:
          type: [integer, "null"]
        created_at:
          type: string
          format: date-time
        reverted_at:
          type: [string, "null"]
          format: date-time
    AdminEnforcementResponse:
      type: object
      required: [enforcement]
      properties:
        enforcement:
          $ref: "#/components/schemas/AdminEnforcement"
    HqTrustSafetyOverviewResponse:
      type: object
      required: [overview]
      properties:
        overview:
          type: object
          required: [brand, generated_at, reports, enforcements]
          properties:
            brand:
              type: string
            generated_at:
              type: string
              format: date-time
            reports:
              type: object
              required:
                [total, by_status, awaiting_decision, oldest_open_report_at,
                 oldest_open_report_age_seconds, by_reason, by_target_type,
                 sla_status, overdue]
              properties:
                total:
                  type: integer
                by_status:
                  type: object
                  description: Stable keys `open`, `reviewing`, `actioned`, and `dismissed`; absent states are returned as zero.
                  additionalProperties:
                    type: integer
                awaiting_decision:
                  type: integer
                  description: Reports whose status is `open` or `reviewing`.
                oldest_open_report_at:
                  type: [string, "null"]
                  format: date-time
                oldest_open_report_age_seconds:
                  type: [integer, "null"]
                by_reason:
                  type: object
                  description: Stable keys for every current Report reason; absent reasons are returned as zero.
                  additionalProperties:
                    type: integer
                by_target_type:
                  type: object
                  description: Stable keys for every current Report target type; absent types are returned as zero.
                  additionalProperties:
                    type: integer
                sla_status:
                  type: string
                  enum: [not_configured]
                overdue:
                  type: [integer, "null"]
                  description: Null until an approved Trust & Safety SLA policy exists.
            enforcements:
              type: object
              required: [total, active]
              properties:
                total:
                  type: integer
                active:
                  type: integer
    HqRepeatOffender:
      type: object
      required:
        [profile_id, display_name, member_360_lookup, report_count,
         awaiting_decision_count, latest_report_at]
      properties:
        profile_id:
          type: string
          format: uuid
        display_name:
          type: [string, "null"]
        member_360_lookup:
          type: [string, "null"]
          format: uuid
        report_count:
          type: integer
          minimum: 2
        awaiting_decision_count:
          type: integer
        latest_report_at:
          type: string
          format: date-time
    HqRepeatOffenderListResponse:
      type: object
      required: [repeat_offenders, minimum_reports, truncated]
      properties:
        repeat_offenders:
          type: array
          items:
            $ref: "#/components/schemas/HqRepeatOffender"
        minimum_reports:
          type: integer
          enum: [2]
        truncated:
          type: boolean
    HqMemberSummary:
      type: object
      required: [user_id, profile_id, brand, membership_status]
      properties:
        user_id:
          type: integer
        profile_id:
          type: [string, "null"]
          format: uuid
        brand:
          type: string
        membership_status:
          type: string
          enum: [active, suspended, left, deactivated]
    HqIdentifier:
      type: object
      required: [kind, value, verified_at, last_seen_at]
      properties:
        kind:
          type: string
          enum: [email, phone]
        value:
          type: string
        verified_at:
          type: [string, "null"]
          format: date-time
        last_seen_at:
          type: [string, "null"]
          format: date-time
    HqSession:
      type: object
      required: [device_name, ip_address, last_used_at, expires_at, revoked_at]
      properties:
        device_name:
          type: [string, "null"]
        ip_address:
          type: [string, "null"]
        last_used_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        revoked_at:
          type: [string, "null"]
          format: date-time
    HqIdentitySection:
      type: object
      required:
        [user_id, user_status, first_name, last_name, user_created_at, membership_status, member_since,
         identifiers, recent_sessions]
      properties:
        user_id:
          type: integer
        user_status:
          type: string
          enum: [active, suspended, closed]
        first_name:
          type: [string, "null"]
        last_name:
          type: [string, "null"]
        user_created_at:
          type: string
          format: date-time
        membership_status:
          type: string
          enum: [active, suspended, left, deactivated]
        member_since:
          type: string
          format: date-time
        identifiers:
          type: array
          description: Up to the 10 oldest kept email/phone identifiers. Never includes oauth or device-fingerprint identifiers.
          items:
            $ref: "#/components/schemas/HqIdentifier"
        recent_sessions:
          type: array
          description: Up to the 5 most recently used sessions for this brand. No token digests.
          items:
            $ref: "#/components/schemas/HqSession"
    HqProfileSection:
      type: object
      required: [exists]
      properties:
        exists:
          type: boolean
          description: False when this member has no Profile on this brand yet — every other property is absent in that case.
        public_id:
          type: string
          format: uuid
        display_name:
          type: [string, "null"]
        status:
          type: string
          enum: [draft, active, suspended]
        visibility:
          type: string
          enum: [hidden, visible]
        gender:
          type: [string, "null"]
        birthdate:
          type: [string, "null"]
          format: date
        country_code:
          type: [string, "null"]
        city:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
        onboarding_state:
          type: string
          enum: [profile_required, profile_incomplete, ready_to_publish, complete, profile_suspended]
        onboarding_next_step:
          type: [string, "null"]
        onboarding_completion_percent:
          type: integer
        photo_count:
          type: integer
        photos:
          type: array
          description: Up to the 20 most recent kept photos, ordered by position. No image URLs.
          items:
            type: object
            required: [id, position, status, visibility, processing_state]
            properties:
              id:
                type: string
              position:
                type: integer
              status:
                type: string
                enum: [pending_review, approved, rejected]
              visibility:
                type: string
                enum: [hidden, visible]
              processing_state:
                type: string
                enum: [pending, processing, ready, failed]
        preference:
          type: object
          nullable: true
          properties:
            min_age:
              type: [integer, "null"]
            max_age:
              type: [integer, "null"]
            max_distance_km:
              type: [integer, "null"]
            relationship_intent:
              type: [string, "null"]
            interested_in:
              type: array
              items:
                type: string
            country:
              type: [string, "null"]
    HqProductSection:
      type: object
      required:
        [likes_given, likes_received, matches_active, hooks_sent, hooks_received, hooks_live_sent,
         hooks_live_received, hook_tonight_live, conversations_count, recent_conversations,
         blocks_given, blocks_received]
      properties:
        likes_given:
          type: integer
        likes_received:
          type: integer
        matches_active:
          type: integer
        hooks_sent:
          type: integer
        hooks_received:
          type: integer
        hooks_live_sent:
          type: integer
        hooks_live_received:
          type: integer
        hook_tonight_live:
          type: boolean
        conversations_count:
          type: integer
        recent_conversations:
          type: array
          description: Up to the 5 most recent conversations. No message content.
          items:
            type: object
            required: [id, status, created_at]
            properties:
              id:
                type: string
                format: uuid
              status:
                type: string
                enum: [active, closed]
              created_at:
                type: string
                format: date-time
        blocks_given:
          type: integer
        blocks_received:
          type: integer
    HqCommsSection:
      type: object
      required: [delivery_counts_by_status, delivery_counts_by_channel, recent_deliveries]
      properties:
        delivery_counts_by_status:
          type: object
          description: Counts over the 200 most recent NotificationDelivery rows for this member, keyed by status.
          additionalProperties:
            type: integer
        delivery_counts_by_channel:
          type: object
          additionalProperties:
            type: integer
        recent_deliveries:
          type: array
          description: The 10 most recent deliveries.
          items:
            type: object
            required: [channel, status, provider, sent_at, failed_at, error_code, created_at]
            properties:
              channel:
                type: string
                enum: [sms, email, push, whatsapp, in_app]
              status:
                type: string
                enum: [pending, sent, failed, skipped, processing]
              provider:
                type: string
              sent_at:
                type: [string, "null"]
                format: date-time
              failed_at:
                type: [string, "null"]
                format: date-time
              error_code:
                type: [string, "null"]
              created_at:
                type: string
                format: date-time
    HqSafetySection:
      type: object
      required:
        [reports_filed_count, reports_received_count, recent_reports, active_enforcement,
         enforcement_count, account_closure]
      properties:
        reports_filed_count:
          type: integer
        reports_received_count:
          type: integer
        recent_reports:
          type: array
          description: Up to the 5 most recent reports naming this member in either direction. No evidence/note — see GET /api/v1/admin/reports/{id} for full detail.
          items:
            type: object
            required: [id, status, reason, target_type, direction, created_at]
            properties:
              id:
                type: integer
              status:
                type: string
                enum: [open, reviewing, actioned, dismissed]
              reason:
                type: string
              target_type:
                type: string
                enum: [profile, message, profile_media, hook, conversation]
              direction:
                type: string
                enum: [filed, received]
              created_at:
                type: string
                format: date-time
        active_enforcement:
          allOf:
            - $ref: "#/components/schemas/AdminEnforcement"
          nullable: true
        enforcement_count:
          type: integer
        account_closure:
          type: object
          nullable: true
          properties:
            media_purge_state:
              type: string
              enum: [pending, completed, failed]
            created_at:
              type: string
              format: date-time
    HqActivitySection:
      type: object
      required: [last_login_at, recent_auth_attempts, recent_security_events]
      properties:
        last_login_at:
          type: [string, "null"]
          format: date-time
        recent_auth_attempts:
          type: array
          description: Up to the 5 most recent auth attempts. Full history via GET .../auth_attempts.
          items:
            type: object
            required: [kind, result, ip_address, created_at]
            properties:
              kind:
                type: string
                enum: [password, email_otp, phone_otp, oauth, webauthn, recovery_code]
              result:
                type: string
                enum: [succeeded, failed, throttled, locked]
              ip_address:
                type: [string, "null"]
              created_at:
                type: string
                format: date-time
        recent_security_events:
          type: array
          description: Up to the 5 most recent security events. Full history via GET .../security_events.
          items:
            type: object
            required: [event_type, severity, created_at]
            properties:
              event_type:
                type: string
              severity:
                type: string
                enum: [info, warning, high, critical]
              created_at:
                type: string
                format: date-time
    HqMember360Response:
      type: object
      required: [member, sections]
      properties:
        member:
          $ref: "#/components/schemas/HqMemberSummary"
        sections:
          type: object
          required: [identity, profile, product, comms, safety, activity]
          properties:
            identity:
              $ref: "#/components/schemas/HqIdentitySection"
            profile:
              $ref: "#/components/schemas/HqProfileSection"
            product:
              $ref: "#/components/schemas/HqProductSection"
            comms:
              $ref: "#/components/schemas/HqCommsSection"
            safety:
              $ref: "#/components/schemas/HqSafetySection"
            activity:
              $ref: "#/components/schemas/HqActivitySection"
    HqSecurityEvent:
      type: object
      required: [id, event_type, severity, metadata, ip_address, created_at]
      properties:
        id:
          type: integer
        event_type:
          type: string
        severity:
          type: string
          enum: [info, warning, high, critical]
        metadata:
          type: object
          description: Opaque ids/status only, per this codebase's existing SecurityEvent convention — never raw message/report content.
        ip_address:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
    HqSecurityEventListResponse:
      type: object
      required: [security_events, next_cursor]
      properties:
        security_events:
          type: array
          items:
            $ref: "#/components/schemas/HqSecurityEvent"
        next_cursor:
          type: [string, "null"]
    HqAuthAttempt:
      type: object
      required: [id, kind, result, identifier, ip_address, created_at]
      properties:
        id:
          type: integer
        kind:
          type: string
          enum: [password, email_otp, phone_otp, oauth, webauthn, recovery_code]
        result:
          type: string
          enum: [succeeded, failed, throttled, locked]
        identifier:
          type: string
          description: The raw identifier string supplied at attempt time (as typed, not necessarily normalized).
        ip_address:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
    HqAuthAttemptListResponse:
      type: object
      required: [auth_attempts, next_cursor]
      properties:
        auth_attempts:
          type: array
          items:
            $ref: "#/components/schemas/HqAuthAttempt"
        next_cursor:
          type: [string, "null"]
    HqEnforcementListResponse:
      type: object
      required: [enforcements, next_cursor]
      properties:
        enforcements:
          type: array
          items:
            $ref: "#/components/schemas/AdminEnforcement"
        next_cursor:
          type: [string, "null"]
    HqDiscoveryDiagnosticResponse:
      type: object
      required: [eligible, ineligibility_reason, stages]
      properties:
        eligible:
          type: boolean
          description: Whether this member is currently eligible to see discovery at all.
        ineligibility_reason:
          type: [string, "null"]
          description: Set only when `eligible` is false (e.g. `profile_unavailable`, `discovery_not_configured`).
        stages:
          type: array
          description: Empty when `eligible` is false. Otherwise one entry per discovery funnel stage, in order.
          items:
            type: object
            required: [stage, description, candidate_count]
            properties:
              stage:
                type: string
                enum: [visible_active_profiles, reciprocal_gender_age_distance, final_eligible_candidates]
              description:
                type: string
              candidate_count:
                type: integer
    StartConversationResponse:

service: d8n-staging

builder:
  args:
    D8N_GIT_SHA: <%= %x(git rev-parse HEAD).strip %>
    D8N_BUILD_TIMESTAMP: <%= Time.now.utc.strftime("%Y-%m-%dT%H:%M:%SZ") %>

servers:
  web:
    - 145.241.185.41
  job:
    hosts:
      - 145.241.185.41
    cmd: bin/jobs
    stop_timeout: 30

proxy:
  ssl: true
  hosts:
    - staging-api.d8n.tech
    - dateza-staging-api.d8n.tech

env:
  clear:
    RAILS_ENV: production
    D8N_DATABASE_HOST: d8n-staging-db
    D8N_DATABASE_PORT: "5432"
    D8N_DATABASE_NAME: d8n_production
    D8N_QUEUE_DATABASE_NAME: d8n_production_queue
    D8N_DATABASE_USERNAME: d8n
    JOB_CONCURRENCY: "1"
    D8N_R2_ENABLED: "true"
    # Staging runs with RAILS_ENV=production, so media storage needs an explicit
    # deployment environment. Brand onboarding is configuration-driven here;
    # each slug must have a matching r2_<brand>_staging service and secrets.
    D8N_DEPLOYMENT_ENV: "staging"
    D8N_R2_BRANDS: "hookus,dateza"
    # Transactional delivery providers (see domains/notifications). Provider NAMES
    # are not secret; their credentials are (below). With these set, the app fails
    # closed until the matching secrets are present: email/phone codes will not send
    # and OTP requests surface delivery_unavailable rather than pretending to send.
    D8N_EMAIL_PROVIDER: "resend"
    D8N_SMS_PROVIDER: "twilio"
    # Verified Resend sender identities. D8N_EMAIL_FROM is the legacy HookUs-only
    # key; other brands must have an explicit D8N_<BRAND>_EMAIL_FROM value and
    # never inherit it. These public addresses live in clear deployment config.
    D8N_EMAIL_FROM: "HookUs <no-reply@hookus.app>"
    D8N_DATEZA_EMAIL_FROM: "DateZA <no-reply@date-za.com>"
    # Brand-owned destination for notification email CTAs. Paths are composed
    # by the shared notification deep-link boundary from opaque public ids.
    D8N_DATEZA_APP_URL: "https://www.date-za.com"
    # Explicit browser origins permitted to call the staging API. HookUs and
    # DateZA frontends talk to the real staging backend during integration.
    # Origins are not secrets; never use "*" here. Extend this comma-separated
    # list only for approved frontend origins.
    D8N_CORS_ORIGINS: "http://localhost:3001,http://127.0.0.1:3001,http://192.168.0.109:3001,https://hookus.app,https://www.hookus.app,https://hookus-web.hookus.workers.dev,http://localhost:5173,https://dateza.vercel.app,https://www.date-za.com"

  secret:
    - RAILS_MASTER_KEY
    - D8N_DATABASE_PASSWORD
    - D8N_R2_ACCESS_KEY_ID
    - D8N_R2_SECRET_ACCESS_KEY
    - D8N_R2_BUCKET
    - D8N_R2_ENDPOINT
    # New HookUs uploads use the brand-specific service. These staging values
    # deliberately reference the existing d8n-staging-media resource/credential;
    # legacy D8N_R2_* names above remain for already-persisted `r2` blobs.
    - D8N_R2_HOOKUS_STAGING_ACCESS_KEY_ID
    - D8N_R2_HOOKUS_STAGING_SECRET_ACCESS_KEY
    - D8N_R2_HOOKUS_STAGING_BUCKET
    - D8N_R2_DATEZA_STAGING_ACCESS_KEY_ID
    - D8N_R2_DATEZA_STAGING_SECRET_ACCESS_KEY
    - D8N_R2_DATEZA_STAGING_BUCKET
    # Resend (email) — API key only; the From identity is public clear config above.
    - RESEND_API_KEY
    # Twilio (SMS) — Standard API Key auth (no account auth token). Account SID +
    # API Key SID + API Key secret (TWILIO_CLIENT_SECRET) + one Messaging Service
    # SID per enabled brand. Top-level Kamal env is inherited by both web and job
    # roles, so the Solid Queue worker receives the same delivery configuration.
    - TWILIO_ACCOUNT_SID
    - TWILIO_API_KEY_SID
    - TWILIO_CLIENT_SECRET
    - TWILIO_HOOKUS_MESSAGING_SERVICE_SID
    - TWILIO_DATEZA_MESSAGING_SERVICE_SID
    # Active Record Encryption keys for the OTP delivery_code ciphertext. MANDATORY
    # in production: the app raises at boot if any is missing (fail-closed). Generate
    # once with `bin/rails db:encryption:init` and store in the password manager.
    - D8N_AR_ENCRYPTION_PRIMARY_KEY
    - D8N_AR_ENCRYPTION_DETERMINISTIC_KEY
    - D8N_AR_ENCRYPTION_KEY_DERIVATION_SALT

accessories:
  db:
    image: postgres:17
    host: 145.241.185.41
    port: "127.0.0.1:5434:5432"
    env:
      clear:
        POSTGRES_USER: d8n
        POSTGRES_DB: d8n_production
      secret:
        - POSTGRES_PASSWORD:D8N_DATABASE_PASSWORD
    directories:
      - /home/ubuntu/d8n-staging-db/data:/var/lib/postgresql/data

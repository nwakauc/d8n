service: d8n-staging

servers:
  web:
    - 145.241.185.41
  job:
    hosts:
      - 145.241.185.41
    cmd: bin/jobs
    stop_timeout: 30

proxy:
  ssl: true
  host: staging-api.d8n.tech

env:
  clear:
    RAILS_ENV: production
    D8N_DATABASE_HOST: d8n-staging-db
    D8N_DATABASE_PORT: "5432"
    D8N_DATABASE_NAME: d8n_production
    D8N_QUEUE_DATABASE_NAME: d8n_production_queue
    D8N_DATABASE_USERNAME: d8n
    JOB_CONCURRENCY: "1"
    D8N_R2_ENABLED: "true"
    # Explicit browser origins permitted to call the staging API. The HookUs
    # frontend dev server runs at http://localhost:3001 and talks to the real
    # staging backend during integration. Origins are not secrets; never use
    # "*" here. Extend this list (comma-separated) as real frontend origins ship.
    D8N_CORS_ORIGINS: "http://localhost:3001,http://127.0.0.1:3001"

  secret:
    - RAILS_MASTER_KEY
    - D8N_DATABASE_PASSWORD
    - D8N_R2_ACCESS_KEY_ID
    - D8N_R2_SECRET_ACCESS_KEY
    - D8N_R2_BUCKET
    - D8N_R2_ENDPOINT

accessories:
  db:
    image: postgres:17
    host: 145.241.185.41
    port: "127.0.0.1:5434:5432"
    env:
      clear:
        POSTGRES_USER: d8n
        POSTGRES_DB: d8n_production
      secret:
        - POSTGRES_PASSWORD:D8N_DATABASE_PASSWORD
    directories:
      - /home/ubuntu/d8n-staging-db/data:/var/lib/postgresql/data
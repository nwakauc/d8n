test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

# Isolated Disk service used to prove per-blob service routing without network R2.
brand_test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage-brand-test") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

r2:
  service: S3
  access_key_id: <%= ENV["D8N_R2_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["D8N_R2_SECRET_ACCESS_KEY"] %>
  region: auto
  bucket: <%= ENV["D8N_R2_BUCKET"] %>
  endpoint: <%= ENV["D8N_R2_ENDPOINT"] %>
  public: false
  force_path_style: true
  # Cloudflare R2 rejects requests that carry more than one checksum. Recent
  # aws-sdk-s3 versions add an automatic CRC32 checksum in addition to the
  # Content-MD5 that Active Storage already sends, which R2 refuses with
  # "You can only specify one non-default checksum at a time". Restrict SDK
  # checksums to operations that require them so only the single Content-MD5
  # is sent. Scoped to the R2 service so unrelated AWS SDK use is unaffected.
  request_checksum_calculation: when_required
  response_checksum_validation: when_required

# New media is routed to one private bucket per brand and deployment environment.
# Keep the legacy `r2` service above: existing HookUs blobs persist that
# service_name in PostgreSQL and must remain readable/purgeable without migration.
r2_hookus_staging:
  service: S3
  access_key_id: <%= ENV["D8N_R2_HOOKUS_STAGING_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["D8N_R2_HOOKUS_STAGING_SECRET_ACCESS_KEY"] %>
  region: auto
  bucket: <%= ENV["D8N_R2_HOOKUS_STAGING_BUCKET"] %>
  endpoint: <%= ENV["D8N_R2_ENDPOINT"] %>
  public: false
  force_path_style: true
  request_checksum_calculation: when_required
  response_checksum_validation: when_required

